<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table de traçage</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-title">
        <strong data-i18n="app.title"></strong>
        <span id="hud-subtitle" data-i18n="app.subtitle"></span>
        <span id="dev-badge" class="dev-badge" data-i18n="dev.badge" data-i18n-title="dev.badgeTitle" hidden></span>
      </div>
      <canvas id="clock" aria-hidden="true"></canvas>
      <div class="hud-date"><div id="date"></div><div id="time"></div></div>
      <div class="hud-group speed-group">
        <button type="button" id="btn-pause"></button>
        <div id="speeds" class="speeds" data-i18n-title="hud.speedTitle"></div>
        <div id="speed-confirm" class="speed-confirm" hidden role="alertdialog"></div>
      </div>
      <div class="hud-group">
        <button type="button" id="btn-atlantic" data-i18n="hud.atlantic"></button>
        <button type="button" id="btn-britain" data-i18n="hud.britain"></button>
        <button type="button" id="btn-england" data-i18n="hud.england"></button>
      </div>
      <div class="hud-group">
        <button type="button" id="btn-ruler" data-i18n="hud.ruler"></button>
        <button type="button" id="btn-radar" data-i18n="hud.radarShort" data-i18n-title="hud.radarCover"></button>
        <button type="button" id="btn-reports" data-i18n="hud.reports"></button>
        <button type="button" id="btn-formations" data-i18n="hud.formations" data-i18n-title="hud.formationsTitle"></button>
        <button type="button" id="btn-roster" data-i18n="hud.roster"></button>
        <button type="button" id="btn-cards" data-i18n="hud.cards"></button>
        <button type="button" id="btn-scenario" data-i18n="hud.scenario"></button>
        <button type="button" id="btn-settings" data-i18n="hud.settings"></button>
        <button type="button" id="btn-help" data-i18n="hud.help"></button>
        <button type="button" id="btn-panel" class="only-small" data-i18n="hud.panel"></button>
      </div>
    </header>

    <main id="table">
      <canvas id="map"></canvas>
      <div id="alert" class="alert" hidden role="alert">
        <strong id="alert-title" data-i18n="alert.title"></strong>
        <span id="alert-text"></span>
        <span id="alert-more" class="alert-more" hidden></span>
        <span class="alert-buttons">
          <button type="button" id="alert-show" data-i18n="alert.show"></button>
          <button type="button" id="alert-close" class="close" data-i18n-label="alert.close">×</button>
        </span>
      </div>
      <div id="question" class="question" hidden role="alertdialog" aria-live="assertive">
        <strong id="question-title"></strong>
        <span id="question-text"></span>
        <span id="question-left" class="question-left"></span>
        <span class="question-buttons">
          <span id="question-yesno" class="question-buttons">
            <button type="button" id="question-yes" data-i18n="question.yes"></button>
            <button type="button" id="question-no" data-i18n="question.no"></button>
          </span>
          <span id="question-options" class="question-buttons" hidden></span>
          <button type="button" id="question-show" class="secondary" data-i18n="question.show"></button>
        </span>
        <span id="question-more" class="question-more" hidden></span>
      </div>
      <div id="coach" class="coach" hidden role="status" aria-live="polite"></div>
      <aside id="unit-panel" class="unit-panel" hidden aria-labelledby="unit-title">
        <div class="sheet-grip" data-grip="sheet" aria-hidden="true"></div>
        <header class="unit-head">
          <h2 id="unit-title"></h2>
          <span class="unit-head-buttons">
            <button type="button" data-action="centre-selection" class="icon-button" data-i18n-title="unit.centre" data-i18n-label="unit.centre">⌖</button>
            <button type="button" data-action="close-unit" class="icon-button close" data-i18n-title="unit.close" data-i18n-label="unit.close">×</button>
          </span>
        </header>
        <p id="unit-summary" class="unit-summary"></p>
        <div id="unit-bar" class="unit-bar" hidden></div>
        <nav id="unit-tabs" class="unit-tabs" role="tablist"></nav>
        <div class="unit-body" id="unit-body">
          <div id="unit-message"></div>
          <div id="unit-pre"></div>
          <canvas id="unit-profile" class="profile" hidden></canvas>
          <div id="unit-keyed"></div>
          <div id="unit-post"></div>
        </div>
      </aside>
      <div id="loading" class="loading"><span class="spinner"></span></div>
    </main>

    <aside id="panel">
      <section>
        <h2 data-i18n="panel.objectives"></h2>
        <ul id="objectives" class="objectives"></ul>
      </section>
      <section>
        <h2 class="with-tabs"><span data-i18n="panel.tote"></span>
          <span class="tabs" role="tablist">
            <button type="button" id="tab-units" role="tab" data-tab="units" data-i18n="panel.units"></button>
            <button type="button" id="tab-sites" role="tab" data-tab="sites" data-i18n="panel.sites"></button>
            <button type="button" id="tab-logistics" role="tab" data-tab="logistics" data-i18n="panel.logistics"></button>
            <button type="button" id="tab-enemies" role="tab" data-tab="enemies" data-i18n="dev.tab" class="dev-tab" hidden></button>
          </span>
        </h2>
        <div id="tote" class="tote"></div>
        <p id="panel-hint" class="hint" hidden></p>
      </section>
      <section class="log-section" id="log-section">
        <h2 class="foldable with-tabs"><span data-log-section="1"><span class="fold">▾</span> <span data-i18n="panel.log"></span></span>
          <span class="tabs" role="tablist" id="log-tabs" hidden>
            <button type="button" role="tab" data-log-tab="journal" data-i18n="panel.logJournal"></button>
            <button type="button" role="tab" data-log-tab="signals"><span data-i18n="panel.logSignals"></span> <span id="signals-count" class="badge" hidden></span></button>
          </span>
        </h2>
        <ol id="log" class="log"></ol>
        <div id="signals" class="signals" hidden></div>
      </section>
    </aside>
  </div>

  <dialog id="dlg-settings"></dialog>
  <dialog id="dlg-help"></dialog>
  <dialog id="dlg-success"></dialog>
  <dialog id="dlg-end"></dialog>
  <dialog id="dlg-desktop"></dialog>
  <dialog id="dlg-scenario"></dialog>
  <dialog id="dlg-reports" class="page-dialog"></dialog>
  <dialog id="dlg-watch" class="page-dialog"></dialog>
  <dialog id="dlg-cards" class="page-dialog"></dialog>
  <dialog id="dlg-formations" class="page-dialog"></dialog>
  <dialog id="dlg-roster" class="page-dialog"></dialog>
  <dialog id="dlg-menu" class="menu-dialog"></dialog>
  <dialog id="dlg-event"></dialog>
  <dialog id="dlg-crash"></dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
