à {time}","square":"Cap {heading} jusqu'en {ref}","position":"Cap {heading} jusqu'à {pos}","open":"Cap {heading} jusqu'à nouvel ordre","speed":" à {n} nœuds","current":"en cours","left":"reste {d}","eta":"fin vers {time}","alt":" à {alt}"},"profile":{"title":"Vue de profil","noRaid":"Aucun raid sur la table.","climb":"Montée à {ft} : {d}","level":"À l'altitude ordonnée","contact":"Contact prévu dans {d} : {verdict}","contactNone":"Le raid est trop loin ou trop rapide pour le contact au cap actuel.","verdict":{"above":"{ft} au-dessus du raid, idéal","level":"à hauteur du raid, sans avantage","low":"{ft} sous le raid, trop bas","high":"{ft} au-dessus du raid, trop haut"},"now":"maintenant","raid":"Raid {raid}","you":"{squadron}","window":"zone de combat possible","fighting":"Au combat avec le raid {raid}."},"desktop":{"title":"Conçu pour un ordinateur","text":"Ce jeu se joue sur un ordinateur, avec une souris et un clavier. Sur cet écran, la carte et les fiches seront à l'étroit.","continue":"Continuer quand même"},"types":{"Hurricane":"Hurricane","Spitfire":"Spitfire"},"resources":{"fuel":"carburant","materiel":"matériel","aircraft":"avions","fuelShort":"C","materielShort":"M","ammo":"munitions","ammoShort":"Mu"},"logistics":{"stocks":"Stocks","fuel":"Carburant","materiel":"Matériel","aircraft":"Avions prêts","tonnes":"{n} t","fuelDays":"{t} t (environ {d} j)","minStock":"Stock minimum","minHint":"Ordre permanent : quand le stock (trains en route compris) passe sous ce seuil, un train part du port le mieux placé. Vide : pas d'ordre.","minAuto":"Arcade : seuil automatique de {n} t.","apply":"Appliquer","sendTrain":"Envoyer un train","resource":"Chargement","to":"Vers","send":"Envoyer","trainHint":"Un train compte au plus {wagons} wagons : citernes de {fuel} t pour le carburant, wagons couverts de {materiel} t pour le reste. Au moins {min} t par train. Un petit train prend quand même un des trains de la ligne.","eta":"arrivée vers {time}","production":"Production","productionRate":"{n} {type} par jour","productionStopped":"arrêtée : plus de matériel","perAircraft":"{n} t de matériel par avion","unloading":"Déchargement en cours : {convoy}, reste {n} t","inbound":"Trains attendus","inboundLine":"{what}, {when}","none":"aucun","trainTitle":"Train {id}","trainLine":"{what} · {from} → {to}","trainState":{"loading":"chargement","waiting":"attend un sillon","moving":"en route","unloading":"déchargement"},"errors":{"place":"Destination invalide.","out":"Installation hors service : aucun train ne peut partir.","noLine":"Aucune ligne de chemin de fer ne relie ces deux points.","empty":"Stock vide.","tooMuch":"Trop lourd : un train compte au plus 20 wagons (citernes de 5 t, wagons couverts de 6 t).","tooLittle":"Un train emporte au moins 10 t."},"cargoPart":"{n} t de {resource}","and":"et","wagons":"Wagons","wagonsOf":"{n} sur {max}","ammo":"Munitions","ammoRate":"{n} t par jour (fabriques de munitions)"},"scenarios":{"kanalkampf":{"title":"Kanalkampf, juillet 1940","text":"10-24 juillet 1940. Deux convois HX traversent l'Atlantique, un convoi côtier attend dans l'estuaire de la Tamise. Répartissez le carburant et le matériel par le rail, protégez ports, radars, aérodromes et usines, et gardez la chasse en l'air pendant quinze jours."},"m0-july-1940":{"title":"Entraînement, juillet 1940","text":"Un scénario simple, sans logistique : un convoi à faire traverser, quelques raids à intercepter. Le tutoriel guidé y explique les gestes de base."},"play":"Jouer","adlertag":{"title":"Adlertag, août 1940","text":"12-18 août 1940. Göring lance « l'attaque de l'aigle » : la Luftwaffe veut détruire la chasse britannique, au sol et en l'air, avant l'invasion. Elle frappe d'abord les radars de la côte, puis les aérodromes, par vagues venues de Calais, d'Amiens et de Cherbourg. Les chasses libres de Bf 109, très haut, cherchent à attirer vos escadrilles : ne les gaspillez pas. Une station radar mobile arrive en renfort. Tenez les bases de secteur, gardez les radars en service et la chasse en état de se battre."},"quinze-septembre":{"title":"15 septembre 1940","text":"Dimanche 15 septembre 1940. Depuis le 7, la Luftwaffe bombarde Londres. Aujourd'hui, elle lance deux grands raids de jour sur les docks, précédés de chasses libres. Le 11 Group tient le sud-est ; de Duxford, le 12 Group peut envoyer une « Big Wing » de cinq escadrilles : faites-les voler en formation derrière un chef. Protégez les docks et abattez assez d'avions pour montrer que la RAF n'est pas vaincue, sans épuiser la chasse."},"hiver-atlantique":{"title":"Hiver dans l'Atlantique, 1941","text":"10 janvier - 31 mars 1941. Les convois HX partent d'Halifax tous les cinq jours, les SC, plus lents, de Sydney tous les huit jours. Les meutes de U-Boote les guettent au sud de l'Islande, la nuit, en surface. Quatre groupes d'escorte et le Coastal Command doivent les ramener. La Grande-Bretagne paie comptant ce qu'elle achète en Amérique : réglez la part de la cargaison que vous achetez, ou commandez des avions de patrouille. À Washington, le Congrès débat du prêt-bail."},"locked":"Se débloque en gagnant le scénario précédent de la campagne."},"reports":{"open":"Ouvrir le rapport","title":"Rapports de combat","none":"Aucun raid pour l'instant.","close":"Fermer","raid":"Raid {label}","ongoing":"en cours","outcome":{"destroyed":"Anéanti","repelled":"Repoussé","bombed":"Cible bombardée","unopposed":"Sans opposition","gone":"Rentré sans bombarder","phantom":"Fausse alerte","ongoing":"En cours","unseen":"Jamais vu","sweep":"Chasse libre"},"composition":"{bombers} {bomberType}, escorte de {escort} {escortType}.","compositionSweep":"{escort} {escortType}, sans bombardiers.","compositionAlone":"{bombers} {bomberType}, sans escorte.","seenBy":"Vu par {by} à {time}.","firstPlot":"Premier plot : {count} à {alt}.","notSeenYet":"Composition inconnue : pas encore vu par nos unités.","neverSeen":"Composition inconnue : jamais vu par nos unités.","targetConvoy":"le convoi {convoy}","hitSite":"Bombes sur {site} : dégâts {severity}, {n} % au total.","hitConvoy":"Convoi {convoy} : {n} navire(s) coulé(s).","groundLosses":"{n} avion(s) détruit(s) au sol.","noBombs":"Aucune bombe signalée.","unseenText":"Aucune de nos unités ne l'a vu et aucune bombe n'est signalée : raid reparti, ou fausse alerte du radar.","devTruth":"Mode développeur, en réalité : {force} Objectif : {target}.","devPhantom":"Mode développeur, en réalité : écho fantôme, aucun avion.","devOutcome":" Fin réelle : {outcome}.","squadron":"Escadrille","result":"Résultat","down":"Abattus","losses":"Pertes","engaged":"au combat","engagedAbove":"au combat, avec l'avantage de la hauteur","noContact":"sans contact","downCell":"{b} bomb. · {f} chass.","noSquadron":"Aucune escadrille ne l'a approché.","totals":"Bilan : {down} appareil(s) allemand(s) abattu(s) ({b} bombardiers, {f} chasseurs) pour {lost} avion(s) de la RAF perdu(s).","dayTotals":"{n} raid(s) · {down} abattus · {lost} pertes","miss":{"wide":"manqué : passé à {km} km","below":"manqué : {ft} trop bas","above":"manqué : {ft} trop haut","wideBelow":"manqué : à {km} km et {ft} trop bas","wideAbove":"manqué : à {km} km et {ft} trop haut","nothing":"rien vu"},"missGuided":" (guidage à {p} %)","naval":{"title":"{escort} contre un U-Boot","context":"{ships} escorteurs, partis de {convoy} ; trouvé : {how}.","contextAlone":"{ships} escorteurs ; trouvé : {how}.","pass":"passe {n}","passResult":{"nothing":"grenades, pas de résultat visible","damaged":"gazole et débris : touché, il rompt et rentre","lost":"contact perdu","sunk":"coulé"},"noPass":"Pas encore de passe : le groupe s'approche.","outcome":{"ongoing":"en cours","sunk":"coulé","damaged":"endommagé","lost":"perdu","brokenOff":"rompu"},"dayTotals":"{n} attaque(s) d'U-Boot, {sunk} coulé(s)"}},"reasonsScramble":{},"cards":{"title":"Fiches techniques","intro":"Les chiffres que le jeu utilise, proches de ceux de l'époque. Le plafond limite l'altitude qu'on peut ordonner.","open":"Voir la fiche technique","fighters":"Chasse (Fighter Command)","patrols":"Patrouilles","bombers":"Bombardiers allemands","escorts":"Chasseurs d'escorte allemands","sea":"En mer","cruise":"Vitesse de croisière","max":"Vitesse maximale","climb":"Montée","climbText":"{ft} ft par minute","ceiling":"Plafond","endurance":"Autonomie","minutes":"{n} min","armament":"Armement","crew":"Équipage","vsBombers":"Contre les bombardiers","vsFighters":"Contre les chasseurs","sight":"Vue (avions)","sightText":"{day} km de jour, {night} km de nuit","uboatSight":"U-Boot en surface","km":"{n} km","kg":"{n} kg","bombs":"Charge de bombes","vulnerability":"Résistance","range":"Rayon d'action","threat":"Danger pour la chasse","speedSea":"Vitesse","knots":"{n} nœuds","stragglers":"Traînards","stragglersText":"au-delà de {p} % de sa vitesse maximale, des navires décrochent","zigzag":"Zigzag","zigzagText":"{p} % plus lent, {h} % de coups au but en moins","asdic":"ASDIC (sous l'eau)","lookouts":"Vigies (surface)","lookoutsText":"{day} km de jour, {night} km de nuit","surface":"En surface","submerged":"En plongée","battery":"Batteries","batteryText":"environ {n} milles à 4 nœuds","torpedoes":"Torpilles","word":{"strong":"excellent","good":"bon","fair":"un peu en retrait","weak":"faible","vulnerable":"fragile","tough":"robuste","average":"moyen","dangerous":"redoutable"},"notes":{"Hurricane":"Le cheval de labour de 1940 : plus nombreux que le Spitfire, robuste, à son meilleur contre les bombardiers.","Spitfire":"Plus rapide et plus maniable : on l'envoie de préférence contre les chasseurs d'escorte.","Spitfire guet":"Une section qui patrouille haut au-dessus de la Manche pour signaler les raids, comme la 421 Flight créée en septembre 1940.","Anson":"Le patrouilleur côtier de 1940 : lent, peu armé, mais il oblige les U-Boote à plonger.","Hudson":"Plus rapide et mieux armé que l'Anson ; certains reçoivent le premier radar ASV fin 1940.","Sunderland":"Hydravion à très grande autonomie : il va loin au-dessus de l'Atlantique.","Do 17":"Le « crayon volant » : rapide pour un bombardier, vulnérable aux attaques de face.","Ju 87":"Le bombardier en piqué : précis, mais lent et très vulnérable sans escorte.","He 111":"Le plus gros bombardier de 1940 : robuste, la plus forte charge.","Bf 109":"Le meilleur chasseur allemand ; son faible rayon d'action limite son temps au-dessus de l'Angleterre.","Bf 110":"Chasseur lourd biplace : grand rayon d'action, mais pataud face aux Spitfire et Hurricane.","convoy":"Des dizaines de cargos et de pétroliers, en colonnes, à la vitesse du plus lent.","escort":"En 1940, quelques navires seulement pour un grand convoi ; l'ASDIC ne voit pas un U-Boot en surface.","uboat":"En 1940, il attaque surtout de nuit, en surface : presque invisible, plus rapide qu'en plongée.","Ju 88":"Le plus moderne des bombardiers de 1940 : rapide, capable d'attaquer en piqué.","Bf 110 Jabo":"Bf 110 armés de bombes, comme l'Erprobungsgruppe 210 : ils frappent vite et bas les radars et les aérodromes.","Catalina":"Hydravion américain à très grande autonomie : il couvre les convois loin dans l'Atlantique."}},"save":{"title":"Partie en cours","text":"La partie est enregistrée toute seule dans ce navigateur et reprend où vous l'avez laissée. Vous pouvez aussi l'emporter dans un fichier.","export":"Exporter la partie (.json)","import":"Importer une partie…","restart":"Recommencer ce scénario","importError":"Ce fichier n'est pas une partie de ce jeu, ou il vient d'une autre version.","exportError":"L'export n'a pas pu se faire ici. Le jeu reste enregistré dans ce navigateur."},"mru":{"title":"Stations radar mobiles","available":"{n} disponible(s)","deploy":"Déployer","placing":"Glissez sur la carte…","pending":"{name} en cours d'installation, prête vers {time}","hint":"Glissez depuis l'emplacement (sur la terre) vers la mer à surveiller.","errors":{"none":"Aucune station mobile disponible.","place":"Une station mobile s'installe sur la terre britannique."},"preview":"Station mobile · face au {az}°","mapPending":"{name} · prête à {time}"},"events":{"ok":"Compris","adlertag":{"intro":{"title":"Adlertag","text":"Prise de service, 12 août 1940. Ce matin, des Bf 110 chargés de bombes ont été vus au-dessus de Calais : les stations radar de la côte sont menacées. Le convoi HX 62 approche du nord de l'Irlande : tracez sa route."},"mru":{"title":"Station radar mobile","text":"Une station radar mobile (MRU) est prête. Onglet Installations, « Déployer », puis glissez sur la carte depuis son emplacement (sur la terre) vers la mer à surveiller : elle peut boucher le trou d'une station détruite. Il lui faut six heures pour se mettre en service, et elle porte moins loin qu'une station fixe."},"adlertag":{"title":"L'attaque de l'aigle","text":"13 août. Le mauvais temps du matin a désorganisé les premières vagues, mais Göring maintient « l'attaque de l'aigle ». Attendez-vous à des raids sur les aérodromes tout l'après-midi."},"relief":{"title":"Relève","text":"Le 266 Squadron (Spitfire) arrive à Hornchurch pour relever les escadrilles épuisées du 11 Group."},"blackThursday":{"title":"15 août","text":"15 août : la Luftwaffe fait son plus grand effort, jusque dans le nord de l'Angleterre. Dans le sud, attendez-vous à des raids toute la journée."},"hardestDay":{"title":"Le jour le plus dur","text":"18 août. Kenley et Biggin Hill sont visés en même temps. Des Stuka sont annoncés sur les aérodromes du Sussex et sur la station radar de Poling."}},"quinze-septembre":{"intro":{"title":"Dimanche 15 septembre","text":"Prise de service. Temps clair, quelques nuages. Toutes les escadrilles sont prêtes. Le Premier ministre est venu suivre la bataille au poste de commandement souterrain du 11 Group, à Uxbridge."},"uxbridge":{"title":"Uxbridge, 10 h 30","text":"Les radars voient des formations se rassembler au-dessus de Calais et de Boulogne. Engagez assez d'escadrilles sur chaque grand raid : quelques-unes ne suffiront pas contre une escorte de cent chasseurs. La Big Wing de Duxford peut décoller."},"afternoon":{"title":"Après-midi","text":"Début d'après-midi : de nouvelles formations, plus nombreuses que ce matin, se rassemblent au-dessus du Pas-de-Calais."}},"hiver-atlantique":{"intro":{"title":"Western Approaches","text":"Prise de service, 10 janvier 1941. Le HX 100 appareille d'Halifax. Les convois suivent la route de l'Amirauté ; vous pouvez la changer pour contourner les U-Boote repérés. Envoyez un groupe d'escorte au-devant de chaque convoi qui approche : vos escorteurs n'ont que sept ou huit jours d'autonomie. Les nuits d'hiver sont longues, et c'est la nuit que les U-Boote attaquent."},"packs":{"title":"Nouvelles meutes","text":"Février : de nouveaux U-Boote quittent Lorient et Saint-Nazaire. L'amiral Dönitz les groupe en meutes plus à l'ouest."},"packs2":{"title":"Encore des U-Boote","text":"Fin février : d'autres U-Boote prennent la mer. Ceux qui ont tiré leurs torpilles reviennent après une quinzaine de jours au port."},"lendLease":{"title":"Prêt-bail","text":"11 mars 1941. Le président Roosevelt signe la loi du prêt-bail. La Grande-Bretagne n'a plus à payer comptant : les convois qui partent désormais sont chargés à plein, sans dépense."},"catalina":{"title":"Catalina","text":"Les Catalina achetés en Amérique sont arrivés à Castle Archdale. Leur autonomie leur permet de couvrir les convois bien plus loin que les autres avions."},"hudson":{"title":"Hudson","text":"Les Hudson achetés en Amérique sont arrivés à Limavady."}}},"offers":{"title":"Achats en Amérique","intro":"Avant le prêt-bail, la Grande-Bretagne paie comptant. Les dollars achètent la cargaison des convois, ou des avions de patrouille.","stock":"Réserve : {n} millions de dollars (sur {m})","purchase":"Part achetée de chaque convoi qui part","purchaseHint":"Un convoi complet HX coûte environ {hx} millions, un SC {sc} millions. Ce qui n'est pas acheté part sur lest.","next":"Prochains départs","nextLine":"{convoy} : {date}, environ {cost} millions","lendLease":"Prêt-bail : les convois partent chargés à plein, sans dépense.","buy":"Commander ({cost} M$)","bought":"Commandé","arrives":"livraison {days} jours après la commande","catalina":"4 Catalina pour Castle Archdale","hudson":"6 Hudson avec radar ASV pour Limavady","refused":"Pas assez de dollars pour cette commande."},"campaign":{"title":"Campagne, acte I","intro":"Les scénarios se suivent : une victoire ouvre le suivant.","won":"Gagné","open":"À jouer","locked":"Verrouillé","training":"Entraînement","unlockAll":"Débloquer tous les scénarios","unlocked":"Victoire : le scénario « {title} » est débloqué.","tutorial":"Tutoriel guidé","carryNote":"Pertes reportées : {share} % des avions au départ (réglage « Campagne »)."},"tutorial":{"step":"Étape {n} sur {total}","next":"Suivant","finish":"Terminer","quit":"Quitter le tutoriel","waiting":"À vous…","welcome":{"title":"Bienvenue au poste de commandement","text":"Juillet 1940. Vous commandez le soutien allié : la chasse, les convois et les radars. Ce tutoriel vous guide pas à pas ; le temps est arrêté tant que vous lisez. Chaque étape passe toute seule quand vous avez fait ce qu'elle demande."},"convoy":{"title":"Faire partir le convoi","text":"Le convoi HX attend à Halifax, dans l'Atlantique. Sa fiche est ouverte : cliquez « Amirauté » dans sa barre de commandes, en haut, ou glissez depuis le convoi jusqu'au nord de l'Irlande pour tracer sa route. Un pilote le conduira au port."},"time":{"title":"Lancer le temps","text":"Le convoi est en route. Lancez le temps (Espace) et accélérez avec les boutons ×1 à ×14 400 en haut, ou les touches 1 à 6. Une alerte radar ralentira le temps toute seule."},"radar":{"title":"Les radars veillent","text":"Les stations radar de la côte surveillent la Manche. Attendez la première alerte : un raid se rassemble au-dessus de la France vers midi."},"scramble":{"title":"Alerte !","text":"Un raid est détecté : sa plaque donne son numéro, le nombre d'avions et l'altitude. Faites décoller une escadrille proche (Biggin Hill, Croydon, Hornchurch) : glissez depuis son aérodrome jusqu'au raid, ou choisissez-la dans l'onglet Unités et cliquez « Décoller » dans la barre de commandes de sa fiche."},"altitude":{"title":"Monter au-dessus","text":"Sans tracé, l'escadrille tourne au-dessus de sa base : glissez depuis elle jusqu'au raid. Réglez l'altitude avec ↑ ↓ (par 1 000 ft), ou les flèches de la barre de commandes, pour arriver au-dessus du raid : l'attaque en piqué donne l'avantage. La courbe de montée, dans la section « Route et étapes », montre si la montée sera finie à temps. Corrigez la route si le raid change de cap."},"combat":{"title":"Tally-ho !","text":"Le combat se règle tout seul, passe après passe. Contre un gros raid, envoyez une deuxième escadrille. Une escadrille à court de munitions ou de carburant rentre d'elle-même ; « Rompre » (touche D) la sort du combat."},"reports":{"title":"Le rapport","text":"Le combat est fini. Chaque raid se termine par un rapport : ouvrez « Rapports » dans le menu du haut pour le lire, ou passez à la suite."},"end":{"title":"À vous de jouer","text":"Vous connaissez l'essentiel. L'aide (en haut) détaille le reste par onglets : la fiche, l'air, la mer, le temps et les alertes. La campagne commence avec Kanalkampf : « Menu », puis « Campagne »."}},"alerts":{"uboatAttack":{"title":"Convoi attaqué","text":"{convoy} est attaqué par des U-Boote (navires coulés : {n}).","missed":"Un U-Boot a tiré sur {convoy}, sans le toucher. D'autres peuvent suivre."},"convoyBombed":{"title":"Convoi bombardé","text":"Le raid {raid} bombarde {convoy} (navires coulés : {n})."},"convoySighted":{"title":"Convoi pisté","text":"Un U-Boot piste {convoy} : la meute peut attaquer dès la nuit."},"uboatSighted":{"title":"U-Boot en vue","text":"{by} voit un U-Boot ({how}) en {where}.","near":"{by} voit un U-Boot ({how}) à {km} km de {convoy}."},"straggler":{"title":"Traînards","text":"Des navires de {convoy} décrochent (traînards : {n}). Réduisez
