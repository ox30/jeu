"place":{"of":"de {place}","over":"au-dessus {of}","near":"à {km} km {dir} {of}","grid":"{where} (carré {grid})","gridOnly":"carré {grid}","directions":["au nord","au nord-est","à l'est","au sud-est","au sud","au sud-ouest","à l'ouest","au nord-ouest"],"unknown":"position imprécise"},"alert":{"title":"ALERTE","text":"Raid {raid} · {count} appareils · {alt} · {where}","show":"Voir","close":"Fermer l'alerte","more":"+{n} en attente","decision":"À décider","decisionTitle":"Cette alerte attend un ordre : elle reste affichée jusqu'à ce qu'il soit donné, ou jusqu'à ce que vous la fermiez."},"map":{"admiraltyRoute":"Route recommandée par l'Amirauté","intercept":"Cap {heading} · {min} min","noIntercept":"Interception impossible","track5":"+5 min","track10":"+10 min","measure":"{km} km · {nm} milles · cap {heading}°","measureTime":"{unit} à {speed} : {duration}, arrivée {time}","scale":"{n} km","landHere":"terre","missed":"raté · {km} km · {ft}","missedSame":"raté · {km} km","nothing":"rien en vue","gate":"Pilote · {name}","turnBack":"demi-tour","now":"maintenant","gateShort":"Pilote","df":"U-Boot ? {time}","observersTag":"obs.","rail":"chemin de fer","end":{"orbit":"⟳ orbite","hold":"→ garde le cap","home":"⌂ rentre"},"endLand":"⌂ se pose à {airfield}","endCover":"⛨ couvre {convoy}","guided":"guidage : {p} % de chances","patrolTag":"vu","zigzag":"zigzag","uplot":"U ? {time} · {source}","uSource":{"seen":"vu en surface","periscope":"périscope","asdic":"ASDIC","radar":"radar","aircraft":"vu d'avion","asv":"radar ASV","df":"radiogoniométrie"},"seenTag":"en vue · {by}","uContact":"U-Boot · {how} · {by}","uContactUnder":"U-Boot en plongée · {how} · {by}","wingPlaque":"{name} · {n} sqn · {aircraft} · {alt}","wingGathering":"rassemblement {n}/{of}","groupPlaque":"{name} · {n} gr. · {ships}","rallyAsap":"au plus tôt","rallyAir":"RV {name} · {time} · {alt}","rallySea":"RV {name} · {time}","escortCombat":"{name} · {n} · au combat","estimated":" ?","convoyPlaque":"{name} · {ships} · {kn} nd{zigzag}","convoyPlaqueZigzag":" · zigzag","escortHunting":"{name} · {n} · en chasse","portBubble":"entrée au port","shipEnd":{"hold":"→ garde le cap","hunt":"⌖ chasse","escort":"⇢ rejoint {convoy}","port":"⚓ {port}"},"viewAir":"vue {km} km","viewSurface":"surface {km} km","viewSubmerged":"plongée {km} km","viewSurfaceNight":"surface, de nuit {km} km","greatCircle":"plus court sur le globe vers {name} : {km} km","routeLength":"route suivie : {km} km restants","condorZone":"rayon d'action des Condor ({name})","stackMore":" +{n}","stackEscort":"avec {names}","stackAsk":"{n} unités ici : cliquez pour choisir laquelle, puis tracez sa route","zone":{"cover":"{name} · {n} · couvre {convoy}","toCover":"{name} · {n} · va couvrir {convoy}","route":"{name} · {n} · en route","station":"{name} · {n} · en patrouille","home":"{name} · {n} · rentre"}},"help":{"title":"Comment jouer","steps":["Kanalkampf, 10-24 juillet 1940. Trois choses à tenir : les convois, les stocks, la défense aérienne. Vue Atlantique (A), Grande-Bretagne (L) et Angleterre (G).","Convois : les HX 55 et HX 57 sont en mer. Tracez leur route (ou donnez-leur des étapes en Réaliste) jusqu'au chenal du nord de l'Irlande ou au canal Saint-Georges, où un pilote les conduit à Liverpool ou à la Clyde. Les cercles hachurés sont des U-Boote probables, repérés par radiogoniométrie : contournez-les, ou envoyez un groupe d'escorte au-devant du convoi.","Le convoi côtier CW 7 attend dans la Tamise avec du matériel pour Southampton. Faites-le appareiller quand vous pourrez le couvrir : de jour, la Luftwaffe l'attaque dans la Manche. Une escadrille peut « Couvrir » le convoi.","Logistique : les convois déchargent carburant et matériel dans les ports. Envoyez des trains vers les bases (carburant) et les usines (matériel), ou fixez un stock minimum dans la fiche d'une base : les trains partent seuls. Sans carburant, une escadrille ne refait pas le plein. Les usines remplacent les avions perdus.","Défense : à l'alerte, faites décoller une escadrille vers le raid, réglez son altitude (↑ ↓) pour arriver au-dessus. En Arcade, « Intercepter » (ou glisser jusqu'au raid) laisse le contrôleur la guider : sa chance dépend de la couverture radar. Le trait pointillé d'un raid manqué donne l'écart ; chaque raid finit par un rapport, rangé dans « Rapports ».","Tracés : cliquez une unité pour ouvrir sa fiche et voir les carrés de sa route. Glissez un carré pour le déplacer, un « + » pour ajouter un point, l'anneau du bout pour prolonger ; double-cliquez un carré pour le retirer. Un point choisi prend une altitude avec ↑ ↓. En fin de tracé, l'escadrille orbite, sauf si vous choisissez autre chose dans la section « Route et étapes » de sa fiche (se poser si le tracé finit dans la bulle d'un aérodrome).","Victoire si les convois HX livrent 80 % de leur cargaison et le convoi côtier CW 70 %, si 30 avions ennemis sont abattus, si 4 bases sur 5 sont en service et si la chasse garde 90 % de ses avions le 24 juillet. C'est le dilemme de Dowding : engager assez pour protéger les convois et faire payer l'ennemi, sans user la chasse. Défaite immédiate si toutes les bases restent sans carburant 24 heures."],"keys":"Espace : pause · 1 à 6 : vitesse · A : Atlantique · L : Grande-Bretagne · G : Angleterre · R ou Maj + glisser : règle (la croix de son encart l'efface) · Entrée : ajouter l'étape mesurée · C : couverture radar · J : journal (sur les alertes non lues, s'il y en a) · ? : aide · Échap : annuler, puis fermer la fiche · ↑ ↓ : altitude (de l'unité choisie, ou du point choisi) · Suppr : retirer le point choisi · S : décoller · B : boost (avion ou navire) · O : orbiter · P : rentrer · D : rompre le combat (désengager le raid en cours) · Question à l'écran : Entrée = oui (au rendez-vous : le choix du plan), Échap = non (au rendez-vous : partir)","close":"Compris","stepsTraining":["Carte de l'Atlantique : glissez depuis le convoi HX (à Halifax) pour tracer sa route jusqu'à Liverpool ou la Clyde, ou cliquez sur « Route de l'Amirauté ». En réglage Réaliste, on navigue au cap : mesurez avec la règle, ajoutez des étapes, puis appareillez. Près de l'entrée d'un chenal, un pilote prend le relais.","Accélérez le temps avec les boutons ×1 à ×14 400 (touches 1 à 6). Une alerte radar ralentit le temps et zoome sur l'Angleterre.","À l'alerte, glissez depuis un aérodrome vers le raid : l'escadrille prête décolle et suit votre tracé. Vous pouvez aussi lui donner un cap direct, ou une liste d'étapes (cap 170 pendant 6 min, puis cap 155 jusqu'en J5).","Réglez l'altitude (↑ ↓, par 1 000 ft) pour arriver au-dessus du raid. Les tiges montrent l'altitude de chaque formation, et l'écart s'affiche sur la plaque du raid quand une escadrille est choisie. La vue de profil de sa fiche montre si la montée sera finie à temps.","Un raid manqué est signalé par un trait pointillé : il donne l'écart en distance et en altitude. Chaque combat se termine par un rapport dans le journal.","Les installations bombardées (aérodromes, radars, ports) apparaissent dans l'onglet Installations : un radar hors service ouvre un trou dans la couverture, un aérodrome endommagé fait décoller plus lentement."],"scenario":{"adlertag":["Adlertag, 12-18 août 1940. La Luftwaffe vise d'abord les radars de la côte (Dover, Rye, Pevensey, Ventnor), puis les aérodromes. Un radar détruit ouvre un trou dans la couverture : placez la station mobile (onglet Installations, « Déployer ») quand elle arrive.","Les raids sans bombardiers, très haut et rapides, sont des chasses libres de Bf 109 : elles cherchent à user vos escadrilles. Gardez vos forces pour les bombardiers. L'état d'alerte (repos 2 h, disponible 30 min, alerte 5 min, cockpit 2 min) règle le délai de décollage et la fatigue ; la page Effectifs le programme.","Les bases de secteur (Biggin Hill, Kenley, Hornchurch, North Weald, Tangmere, Middle Wallop, Northolt) doivent rester en service. Sans munitions ni carburant, une base ne réarme plus : surveillez les stocks et les trains depuis Chilmark et les ports.","Victoire si les sept bases de secteur restent moins de 10 heures hors service au total et les neuf radars moins de 36 heures, si 90 avions ennemis sont abattus, si la chasse garde 45 % de ses avions et si le HX 62 livre 60 % de sa cargaison. Chaque raid qui passe compte : une base est réparée en quelques heures, un radar en plus d'un jour.","Le carburant des bases ne tient pas la semaine : commandez des trains depuis les ports ou fixez un stock minimum dans la fiche de chaque base (onglet Installations). Une base à sec ne fait plus décoller personne."],"quinze-septembre":["15 septembre 1940, une seule journée. Deux grandes vagues visent les docks de Londres, vers 11 h et vers 14 h, précédées de chasses libres.","Contre une escorte de cent chasseurs, engagez beaucoup d'escadrilles sur le même raid : la pression de l'escorte se partage entre elles. Les cinq escadrilles de Duxford peuvent voler en « Big Wing » : groupez-les dans « Formations » (barre du haut). Elles décollent ensemble, se rassemblent au-dessus du chef — ce qui prend du temps — puis volent à la vitesse des Hurricane.","Victoire si 32 avions ennemis sont abattus, si les docks restent sous 50 % de dégâts et si la chasse garde 70 % de ses avions."],"hiver-atlantique":["Hiver 1941, du 10 janvier au 31 mars. Les convois HX (Halifax, tous les cinq jours) et SC (Sydney, tous les huit jours, plus lents) partent seuls sur la route de l'Amirauté. Changez-la pour contourner les U-Boote repérés ; mais le commandement allemand apprend où passent vos convois, et une route trop au sud est vite guettée à son tour, sous les Condor de Bordeaux.","Vous commandez depuis un QG à terre, au rythme des quarts. La mer ne vous appelle plus événement par événement : à chaque relève (0, 4, 8, 12, 16 et 20 h) un rapport s'écrit, onglet « Signaux » du journal — convois, groupes d'escorte, air, renseignement, et ce qui attend une décision. Le jeu ne s'arrête à une relève que si une décision nouvelle vous attend (un convoi à escorter, un groupe qui a fini ses ordres, des grenades épuisées, des repères U-Boote sur une route) ; entre deux relèves, seulement pour la première attaque d'un convoi dans la nuit. Un arrêt est une pause : « Reprendre » repart à la vitesse d'avant. Réglages, onglet Temps : arrêt aussi matin et soir, ou à chaque relève.","Silence radio (Standard et Réaliste ; réglage « Communications en mer ») : hors des eaux suivies — mer d'Irlande, canal du Nord, Minch, Manche, canal de Bristol, approches des ports, couverture des radars de Downhill et de Glenarm — vos navires ne sont vus que par estimation : un repère en tirets, marqué « ? », déplacé à chaque relève, avec un cercle de doute qui grandit depuis le dernier point sûr. Un point sûr vient d'un de vos avions en vue du navire, d'une attaque (le convoi émet alors), de ce qu'un groupe vous signale (un U-Boot vu ou attaqué, la fin d'une chasse), ou de « Demander la position », qui donne aussi un relèvement à l'ennemi. Un groupe en haute mer ne peut pas être mis dans un groupe de soutien : il faut le joindre au port ou en eaux suivies. Un ordre part par radio à la relève suivante (une nouvelle route peut être lue par le B-Dienst), au projecteur si un avion est en vue, ou confié à un groupe qui part rejoindre le convoi.","Envoyez un groupe d'escorte au-devant de chaque convoi qui approche : vos groupes ont sept ou huit jours d'autonomie et rentrent se ravitailler. Chaque groupe emporte 40 grenades par navire (120 ou 160). « Rester » le garde serré autour du convoi ; « Chasser » le laisse poursuivre un contact frais : il revient seul quand le U-Boot est coulé ou touché, le contact perdu, ou ses grenades tombées au tiers gardé pour le convoi ; pendant ce temps le convoi n'a plus d'escorte. Un U-Boot coulé est remplacé par un autre trois semaines plus tard : couler soulage, sans vider la mer. Grenadage plein (dix par passe) ou économe (cinq, moins de chances de couler). À vide, le groupe passe encore, à blanc : le U-Boot plonge et perd le convoi, sans rien risquer ; les grenades se refont au port, avec le mazout. En mars, deux groupes reçoivent un premier radar. Les nuits d'hiver sont longues (seize heures en janvier, onze fin mars) : c'est alors que les meutes attaquent, chacune à son heure. L'ombre sur la carte montre où il fait nuit.","Le Coastal Command patrouille de jour au-dessus des convois et oblige les U-Boote à plonger ; le radar ASV voit aussi un sous-marin en surface, et un convoi de nuit. Un avion qui surprend un U-Boot de près l'attaque, une fois par sortie : il coule rarement, mais le journal le dit, et son repère lance la chasse d'un groupe en « Chasser » à moins de 30 km de son convoi. Les deux cercles d'un repère U-Boot montrent où il peut être, en surface et en plongée.","Onglet Logistique : la réserve de dollars paie la cargaison des convois, qui partent chargés à plein tant qu'elle le permet. Elle peut aussi payer des Hudson ou des Catalina, mais chaque dollar dépensé ainsi manquera aux cargaisons : l'onglet donne le prix de chaque offre en tonnes, son délai de livraison et la prévision de tonnage face à l'objectif. Après le prêt-bail, tout est gratuit. Victoire si 6 800 t de carburant et 4 400 t de matériel sont déchargées et si moins de 7,5 % des navires sont perdus ; défaite si les pertes dépassent 20 %."]},"tabs":{"scenario":"Ce scénario","sheet":"La fiche","air":"Air","sea":"Mer","time":"Temps et alertes","games":"Parties et réglages","keys":"Touches"},"sheet":["La fiche d'une unité s'ouvre quand on clique l'unité, sur la carte ou dans le tableau d'état. En haut, sa barre de commandes : ses ordres en icônes, toujours visibles (Décoller, Orbiter, Rentrer, Rompre un combat ; Défense, Attaque, Poursuite ; l'altitude ; la vitesse de 50 à 100 % et le boost). Un survol de la souris donne le détail de chaque bouton.","Dessous, l'onglet Commandes : ses sections suivent l'état de l'unité (au sol, en vol, au port, en mer). Un clic sur leur titre les replie ou les rouvre, et elles restent comme vous les laissez. À côté, État et Fiche technique ; une formation a aussi Rassemblement et Membres.","Réglages, onglet Carte et fiche : la fiche à droite, à gauche ou en bas de la carte. Tirez son bord pour l'élargir (ou la grandir en bas). La croix ou Échap la ferme ; ⌖ centre la carte sur l'unité.","Tracés : glissez depuis une unité pour tracer sa route. Glissez un carré de la route pour le déplacer, un « + » pour ajouter un point, l'anneau du bout pour prolonger ; double-cliquez un carré pour le retirer. Un point choisi prend une altitude avec ↑ ↓. La section « Route et étapes » donne la courbe de montée, un cap direct, la fin de tracé et les étapes au cap. Maj + glisser mesure (règle) ; la croix de son encart l'efface.","Unités superposées : là où des unités se recouvrent sur la carte (des escadrilles qui volent ensemble, les groupes d'un même port), un seul repère porte leur nombre. Un clic ouvre la fiche avec un onglet par unité sur son bord, côté carte : l'unité de l'onglet choisi passe devant, les autres s'estompent, et les ordres comme les tracés vont à elle. On ne trace rien depuis une pile fermée (la carte le rappelle) : choisissez d'abord l'unité. Un convoi et son escorte gardent le repère et la plaque du convoi, avec le nom du groupe dessous. Un trait qui finit là où plusieurs cibles se recouvrent (deux raids, un convoi et un repère d'U-Boot) ouvre un petit choix.","Chaque raid se termine par un rapport, rangé dans « Rapports », avec ce que la RAF en sait : le premier plot, la composition une fois le raid vu, les bombes tombées ; chaque attaque à la grenade d'un groupe d'escorte aussi. La partie est gardée dans le navigateur ; le bouton ☰, puis « Exporter la partie », en fait un fichier."],"air":["Face à l'ennemi (barre de commandes) : en Défense, une escadrille n'attaque pas d'elle-même et demande l'autorisation quand elle voit un raid ; en Attaque (le défaut), elle attaque les raids qui arrivent et demande avant de poursuivre un raid qui rentre ; en Attaque et poursuite, elle poursuit sans demander jusqu'à mi-Manche, puis demande. Une question passe le jeu à ×1 et y reste ; sans réponse en 60 s, c'est non. Une seule question par raid et par escadrille ; on peut couper les questions dans Réglages. Un tracé qui finit sur un raid, ou « Intercepter », vaut autorisation. « Rompre H05 » dans la barre de commandes (touche D) sort l'unité du combat : elle tourne sur place et laisse ce raid tranquille jusqu'à un nouvel ordre sur lui. Passer à une attitude plus prudente retire les autorisations déjà données : une escadrille qui poursuivait rompt au round suivant.","Les états d'alerte : Repos (2 h : le personnel peut être n'importe où), Disponible (30 min), Alerte (5 min), Cockpit (2 min). Le délai est le temps pour être en l'air après l'ordre de décoller ; monter d'un état prend la différence (du repos à l'alerte : 1 h 55), descendre est immédiat. Un état choisi à la main dans la fiche garde la main sur le planning jusqu'à « Retour au planning ».","La fatigue : le vol et les combats fatiguent. Au sol, seul le Repos repose vraiment ; Disponible repose peu, l'Alerte à 5 minutes fatigue un peu, le Cockpit davantage. Une escadrille laissée en alerte jour et nuit finit fatiguée en une semaine : elle se bat moins bien et perd plus d'avions. Mettez vos escadrilles au repos la nuit (page Effectifs : un plan qui se répète chaque jour) ou relevez-les à tour de rôle.","La page Effectifs (barre du haut, ou « Programmation des effectifs… » dans une fiche) montre chaque aérodrome et ses escadrilles : le plan de chaque jour (de 00:00 à 24:00, il se répète), ou, case cochée, un plan d'exception pour les prochaines 24 h en heures H (H0 – H+6 repos, H+6 – H+9 alerte…), la frise des 24 heures à venir, et de quoi copier un plan vers d'autres escadrilles. La durée de l'exception se règle dans Réglages.","Programmer : « Décollage programmé » (ou « Appareillage programmé ») donne l'ordre à l'heure dite, avec la route tracée depuis la base ou les étapes préparées ; l'heure saisie est celle de l'ordre, le délai de l'état d'alerte s'y ajoute. « Rejoindre une formation » fait partir une escadrille à son heure pour rejoindre une big wing (ou un groupe de soutien).","Formations (barre du haut) : groupez des escadrilles en big wing, ou des groupes d'escorte en groupe de soutien. La formation devient une seule unité, avec une fiche et les mêmes ordres pour tous ; son chef (★) mène, le suivant prend la relève. Les fiches techniques (barre du haut) donnent vitesses, plafonds et autonomies.","Rassemblement (onglet d'une big wing ou d'un groupe de soutien) : sur le chef, ou sur un point à une heure donnée (ou au plus tôt), avec la route à suivre ensuite. Chaque membre a son heure de départ : en Arcade elles sont calculées, en Standard la fiche montre l'heure d'arrivée de chacun, en Réaliste à vous de compter (délai, montée, trajet). Avec une heure fixée, la formation part à cette heure (les premiers arrivés tournent) ; au plus tôt, dès que tous sont là. À l'heure, s'il manque quelqu'un : attendre (un temps maximum), ralentir vers la cible ou partir ; une big wing vous pose la question. Les retardataires suivent le plan en retard et rejoignent en route."],"sea":["Appareiller : un groupe d'escorte met une heure à quitter son quai, puis sort en rade, juste au large du port, ou suit jusqu'au bout le chenal choisi (« Sortie » dans la section Au port) ; il y attend vos ordres, ou prend votre tracé ou vos étapes. Un tracé tiré depuis le port part de la rade et contourne la terre par la mer.","En mer, la barre de commandes d'un groupe d'escorte donne « Face aux U-Boote » : Rester avec le convoi ou Chasser les contacts, et le grenadage, plein ou économe (section « Chasse aux U-Boote ») ; « Stop » ou tout autre ordre arrête la chasse. Un U-Boot tenu à l'ASDIC reçoit une passe de grenades toutes les 10 minutes. « Au port » rentre au port choisi dans la section « Retour au port » ; les routes de mer contournent la terre, et un tracé qui finit dans la bulle d'un port y entre. Section « Route et étapes » : que faire à la fin du tracé ou des étapes (s'arrêter, garder le cap, chercher un U-Boot sur place, rejoindre un convoi, entrer au port).","Vitesse des navires : un convoi à 100 % garde ses navires groupés ; son boost (sa meilleure vitesse) en laisse décrocher. Un groupe d'escorte à 100 % file à sa vitesse de mer ; son boost (+15 %) use son autonomie 1,6 fois plus vite. Zigzag et route de l'Amirauté sont dans la barre d'un convoi.","Autonomie : un groupe rentre de lui-même quand il ne lui reste que de quoi regagner le port le plus proche, plus un jour de marge (« Retour au port » montre la distance et le temps pour chaque port). Si vous le retenez en mer et que son mazout s'épuise, il quitte tout, convoi compris, et se traîne au port le plus proche à 7 nœuds au plus : vous ne pouvez plus que choisir son port.","Le commandement des U-Boote (BdU) tend tous les deux jours une ligne de patrouille en travers de la route que vos convois ont prise ces derniers temps : au début la route de l'Amirauté, plus au sud si vos convois y passent. Le B-Dienst lit une part des messages de routage (Réglages, onglet Partie, 0 à 100 %) : deux U-Boote vont alors attendre le convoi en travers de sa route. Les Fw 200 Condor de Bordeaux couvrent le golfe de Gascogne et l'ouest de l'Irlande (cercle pointillé sur la carte) : ils signalent les convois aux U-Boote et bombardent parfois. Les U-Boote n'entrent ni en mer d'Irlande, ni dans la Manche, le canal de Bristol ou les eaux intérieures des Hébrides (mines, patrouilles) : ils attendent au large et contournent la terre.","Le globe : la carte est plate, mais les distances sont celles du globe ; plus au nord, le chemin est plus court qu'il n'y paraît. Sélectionnez un convoi : la carte montre en pointillé le plus court chemin sur le globe jusqu'aux entrées des chenaux, et la longueur de la route suivie. Une escorte qui tient un U-Boot à l'ASDIC annonce sa profondeur et son cap estimés.","Un U-Boot vu par un avion ou par une escorte lève une alerte « U-Boot en vue » et ramène le jeu à ×1 ; dans l'Atlantique, au rythme des quarts, il est noté au rapport de la relève et le temps continue. Les deux cercles d'un repère montrent où il peut être, en surface et en plongée ; Réglages, onglet Carte et fiche, « Zones de vue », montre ce que voient vos navires et vos avions.","Patrouilles de Coastal Command : à ×3 600, un avion traverse 250 km de carte par seconde quand un convoi en parcourt 17. À partir de ×600, une patrouille en vol est donc dessinée par ce qu'elle fait plutôt que par son avion : son repère se tient près du convoi qu'elle couvre, au bout de sa route ou là où elle orbite, sa plaque dit « couvre HX 102 », « en route », « en patrouille » ou « rentre », et son cercle est tracé en bleu, hachuré là où elle voit : tout le cercle de jour, la courte portée de son radar ASV la nuit, rien la nuit sans radar. Le geste ne change pas : cliquez le repère pour ouvrir la fiche, glissez depuis lui pour tracer une route ; l'unité en main retrouve son avion, sa route et ses carrés. À ×60 et en dessous, l'avion lui-même est dessiné. Réglages, onglet Carte et fiche, pour s'en passer."],"time":["Les alertes ralentissent le temps : un raid ramène à ×10 ; en mer, toute alerte ramène à ×1 (on décide, puis on accélère) ; une base à ×600. Chaque vitesse se règle dans Réglages, onglet Temps et alertes. Pendant une action ennemie, une vitesse élevée demande confirmation (réglable).","Une alerte qui attend un ordre porte « À décider » : elle reste à l'écran jusqu'à ce que l'ordre soit donné ou qu'on la ferme (« Voir » montre l'endroit sans la fermer). Une information s'efface seule. Au-delà de quatre alertes en attente, les plus anciennes passent au journal comme « non lues » : le bouton Journal de la barre du haut porte leur nombre, et un clic (ou J) ouvre le journal sur elles.","Les pages (rapports, fiches techniques, formations, effectifs, aide, réglages) et le menu ☰ mettent le jeu en pause (réglable pour les pages)."],"images":{"sheet":"La fiche d'une escadrille en vol : la barre de commandes en haut, l'onglet Commandes dessous.","roster":"La page Effectifs : les aérodromes à gauche, les escadrilles et leurs plannings à droite.","escort":"La fiche d'un groupe d'escorte en mer : sortie, convois, chasse, retour au port."},"games":["Le jeu s'ouvre sur le menu principal. Continuer reprend la dernière partie ; Campagne montre la chaîne de l'Âge I et ce qui est gagné ; Scénarios donne une carte par bataille, avec son enjeu, ses dates et sa durée estimée ; Entraînement propose les quatre leçons du tutoriel (intercepter, ravitailler, escorter, états d'alerte et fatigue) et un scénario d'essai ; Charger retrouve les parties gardées.","En jeu, le bouton ☰ ouvre Reprendre, Sauvegarder, Exporter, Réglages de la partie, Aide, Recommencer et Menu principal. Revenir au menu principal garde la partie : « Continuer » la reprend où elle en était.","Sauvegardes : la partie en cours est gardée dans ce navigateur à mesure que l'on joue. S'y ajoutent une sauvegarde automatique par jour de jeu (toutes les deux heures de jeu dans une bataille d'une journée) : les cinq dernières de la partie en cours sont gardées, et la dernière de chacune des parties d'avant (cinq au plus). Enfin vos sauvegardes manuelles (☰, Sauvegarder), gardées jusqu'à ce que vous les supprimiez. Tout est dans « Charger », au menu principal. En Réaliste, ces points de reprise permettent de rejouer une journée sans tout refaire.","Une sauvegarde contient la partie, ses réglages et tout son journal, rapports de quart compris. Le fichier exporté se recharge par Charger, « Importer une partie ». Un fichier abîmé, ou venu d'une version plus récente, est refusé avec sa raison, sans toucher à la partie en cours ; les parties enregistrées depuis la version 2.6.1 se chargent.","Si le navigateur ne peut plus enregistrer (stockage plein, navigation privée), « Non enregistré » s'affiche dans la barre du haut, le journal et le menu principal le disent : exportez la partie dans un fichier. Une partie que l'on s'apprête à remplacer et qui n'a pas pu être gardée le dit aussi, avant de disparaître. Les leçons du tutoriel ne s'enregistrent pas : elles se jouent d'une traite.","Les réglages qui changent les règles (préréglage, détection, carburant, fatigue, B-Dienst, communications en mer, arrêt aux relèves…) appartiennent à la partie : fixés au lancement, ils se changent en cours de route par ☰, Réglages de la partie, et le journal note chaque changement. Si le préréglage change, l'écran de fin et la campagne le disent : « commencée en Réaliste, terminée en Standard ». Le report de campagne reste celui du départ. Les réglages d'affichage (son, ombre de la nuit, place de la fiche…) restent ceux du joueur.","Lancer une autre partie ou en charger une demande confirmation quand une partie est en cours ; Recommencer aussi, dès dix minutes de jeu. La partie remplacée est gardée parmi les sauvegardes automatiques."]},"end":{"title":"Fin de service","bombersDown":"Bombardiers abattus : {n}","fightersDown":"Chasseurs ennemis abattus : {n}","rafLost":"Avions de la RAF perdus : {n}","groundLosses":"Dont détruits au sol : {n}","raidsIntercepted":"Raids interceptés avant leur cible : {n}","raidsRepelled":"Raids repoussés : {n}","targetsHit":"Bombardements subis : {n}","convoysArrived":"Convois arrivés : {n}","success":"Objectifs atteints.","failure":"Objectifs non atteints.","replay":"Rejouer","close":"Fermer","victory":"Victoire : tous les objectifs sont atteints.","defeat":"Défaite : des objectifs ne sont pas atteints.","defeatFuel":"Défaite : la chasse est restée clouée au sol, faute de carburant.","defeatFighters":"Défaite : Fighter Command n'a presque plus d'avions.","objectives":"Objectifs","shipsSunk":"Navires marchands perdus : {n}","uboatsSunk":"U-Boote coulés : {n}","unloaded":"Déchargé dans hort":"Mu"},"logistics":{"stocks":"Stocks","fuel":"Carburant","materiel":"Matériel","aircraft":"Avions prêts","tonnes":"{n} t","fuelDays":"{t} t (environ {d} j)","minStock":"Stock minimum","minHint":"Ordre permanent : quand le stock (trains en route compris) passe sous ce seuil, un train part du port le mieux placé. Vide : pas d'ordre.","minAuto":"Arcade : seuil automatique de {n} t.","apply":"Appliquer","sendTrain":"Envoyer un train","resource":"Chargement","to":"Vers","send":"Envoyer","trainHint":"Un train compte au plus {wagons} wagons : citernes de {fuel} t pour le carburant, wagons couverts de {materiel} t pour le reste. Au moins {min} t par train. Un petit train prend quand même un des trains de la ligne.","eta":"arrivée vers {time}","production":"Production","productionRate":"{n} {type} par jour","productionStopped":"arrêtée : plus de matériel","perAircraft":"{n} t de matériel par avion","unloading":"Déchargement en cours : {convoy}, reste {n} t","inbound":"Trains attendus","inboundLine":"{what}, {when}","none":"aucun","trainTitle":"Train {id}","trainLine":"{what} · {from} → {to}","trainState":{"loading":"chargement","waiting":"attend un sillon","moving":"en route","unloading":"déchargement"},"errors":{"place":"Destination invalide.","out":"Installation hors service : aucun train ne peut partir.","noLine":"Aucune ligne de chemin de fer ne relie ces deux points.","empty":"Stock vide.","tooMuch":"Trop lourd : un train compte au plus 20 wagons (citernes de 5 t, wagons couverts de 6 t).","tooLittle":"Un train emporte au moins 10 t."},"cargoPart":"{n} t de {resource}","and":"et","wagons":"Wagons","wagonsOf":"{n} sur {max}","ammo":"Munitions","ammoRate":"{n} t par jour (fabriques de munitions)"},"scenarios":{"kanalkampf":{"title":"Kanalkampf, juillet 1940","stake":"Faire passer les convois de la Manche et de l'Atlantique sans user la chasse avant la vraie bataille.","text":"10-24 juillet 1940. Deux convois HX traversent l'Atlantique, un convoi côtier attend dans l'estuaire de la Tamise. Répartissez le carburant et le matériel par le rail, protégez ports, radars, aérodromes et usines, et gardez la chasse en l'air pendant quinze jours."},"m0-july-1940":{"title":"Entraînement, juillet 1940","stake":"Apprendre les gestes : tracer une route, accélérer le temps, faire décoller, lire un rapport.","text":"Un scénario simple, sans logistique : un convoi à faire traverser, quelques raids à intercepter. Pour s'exercer librement, sans instructeur, après les leçons du tutoriel."},"play":"Jouer","adlertag":{"title":"Adlertag, août 1940","stake":"Tenir une semaine sous les coups portés aux radars et aux aérodromes, en gardant assez de chasseurs.","text":"12-18 août 1940. Göring lance « l'attaque de l'aigle » : la Luftwaffe veut détruire la chasse britannique, au sol et en l'air, avant l'invasion. Elle frappe d'abord les radars de la côte, puis les aérodromes, par vagues venues de Calais, d'Amiens et de Cherbourg. Les chasses libres de Bf 109, très haut, cherchent à attirer vos escadrilles : ne les gaspillez pas. Une station radar mobile arrive en renfort. Tenez les bases de secteur, gardez les radars en service et la chasse en état de se battre."},"quinze-septembre":{"title":"15 septembre 1940","stake":"Briser en une journée les deux grands raids sur Londres avec ce qui reste de la chasse.","text":"Dimanche 15 septembre 1940. Depuis le 7, la Luftwaffe bombarde Londres. Aujourd'hui, elle lance deux grands raids de jour sur les docks, précédés de chasses libres. Le 11 Group tient le sud-est ; de Duxford, le 12 Group peut envoyer une « Big Wing » de cinq escadrilles : faites-les voler en formation derrière un chef. Protégez les docks et abattez assez d'avions pour montrer que la RAF n'est pas vaincue, sans épuiser la chasse."},"hiver-atlantique":{"title":"Hiver dans l'Atlantique, 1941","stake":"Amener carburant et matériel à travers les meutes de U-Boote, en perdant moins de 7,5 % des navires.","text":"10 janvier - 31 mars 1941. Les convois HX partent d'Halifax tous les cinq jours, les SC, plus lents, de Sydney tous les huit jours. Les meutes de U-Boote les guettent au sud de l'Islande, la nuit, en surface. Quatre groupes d'escorte et le Coastal Command doivent les ramener. La Grande-Bretagne paie comptant ce qu'elle achète en Amérique : chaque convoi chargé entame la réserve de dollars, et les avions de patrouille commandés là-bas se paient en dollars et en tonnes de cargaison. À Washington, le Congrès débat du prêt-bail."},"locked":"Se débloque en gagnant le scénario précédent de la campagne.","lecon-intercepter":{"title":"Leçon 1 : intercepter","stake":"Décoller au premier plot.","text":"Une leçon du tutoriel : un raid que l'instructeur laisse passer, puis un raid à intercepter."},"lecon-ravitailler":{"title":"Leçon 2 : ravitailler","stake":"Un train de carburant et un stock minimum.","text":"Une leçon du tutoriel : une base presque à sec, un train depuis Southampton, un stock minimum."},"lecon-escorter":{"title":"Leçon 3 : escorter","stake":"Un groupe d'escorte pour un convoi, au rythme des quarts.","text":"Une leçon du tutoriel : un rapport de quart, un groupe envoyé au-devant d'un convoi, les consignes et les grenades."},"lecon-alerte":{"title":"Leçon 4 : états d'alerte et fatigue","stake":"Reposer une escadrille fatiguée, rappeler une escadrille reposée.","text":"Une leçon du tutoriel : les états d'alerte, la fatigue et la page Effectifs."}},"reports":{"open":"Ouvrir le rapport","title":"Rapports de combat","none":"Aucun raid pour l'instant.","close":"Fermer","raid":"Raid {label}","ongoing":"en cours","outcome":{"destroyed":"Anéanti","repelled":"Repoussé","bombed":"Cible bombardée","unopposed":"Sans opposition","gone":"Rentré sans bombarder","phantom":"Fausse alerte","ongoing":"En cours","unseen":"Jamais vu","sweep":"Chasse libre"},"composition":"{bombers} {bomberType}, escorte de {escort} {escortType}.","compositionSweep":"{escort} {escortType}, sans bombardiers.","compositionAlone":"{bombers} {bomberType}, sans escorte.","seenBy":"Vu par {by} à {time}.","firstPlot":"Premier plot : {count} à {alt}.","notSeenYet":"Composition inconnue : pas encore vu par nos unités.","neverSeen":"Composition inconnue : jamais vu par nos unités.","targetConvoy":"le convoi {convoy}","hitSite":"Bombes sur {site} : dégâts {severity}, {n} % au total.","hitConvoy":"Convoi {convoy} : {n} navire(s) coulé(s).","groundLosses":"{n} avion(s) détruit(s) au sol.","noBombs":"Aucune bombe signalée.","unseenText":"Aucune de nos unités ne l'a vu et aucune bombe n'est signalée : raid reparti, ou fausse alerte du radar.","devTruth":"Mode développeur, en réalité : {force} Objectif : {target}.","devPhantom":"Mode développeur, en réalité : écho fantôme, aucun avion.","devOutcome":" Fin réelle : {outcome}.","squadron":"Escadrille","result":"Résultat","down":"Abattus","losses":"Pertes","engaged":"au combat","engagedAbove":"au combat, avec l'avantage de la hauteur","noContact":"sans contact","downCell":"{b} bomb. · {f} chass.","noSquadron":"Aucune escadrille ne l'a approché.","totals":"Bilan : {down} appareil(s) allemand(s) abattu(s) ({b} bombardiers, {f} chasseurs) pour {lost} avion(s) de la RAF perdu(s).","dayTotals":"{n} raid(s) · {down} abattus · {lost} pertes","miss":{"wide":"manqué : passé à {km} km","below":"manqué : {ft} trop bas","above":"manqué : {ft} trop haut","wideBelow":"manqué : à {km} km et {ft} trop bas","wideAbove":"manqué : à {km} km et {ft} trop haut","nothing":"rien vu"},"missGuided":" (guidage à {p} %)","naval":{"title":"{escort} contre un U-Boot","context":"{ships} escorteurs, partis de {convoy} ; trouvé : {how}.","contextAlone":"{ships} escorteurs ; trouvé : {how}.","pass":"passe {n}","passResult":{"nothing":"grenades, pas de résultat visible","damaged":"gazole et débris : touché, il rompt et rentre","lost":"contact perdu","sunk":"coulé"},"noPass":"Pas encore de passe : le groupe s'approche.","charges":"{n} grenades","dry":"à blanc","chargesTotal":"Grenades lancées : {n}.","ou  de labour de 1940 : plus nombreux que le Spitfire, robuste, à son meilleur contre les bombardiers.","Spitfire":"Plus rapide et plus maniable : on l'envoie de préférence contre les chasseurs d'escorte.","Spitfire guet":"Une section qui patrouille haut au-dessus de la Manche pour signaler les raids, comme la 421 Flight créée en septembre 1940.","Anson":"Le patrouilleur côtier de 1940 : lent, peu armé, mais il oblige les U-Boote à plonger.","Whitley":"Un bombardier de nuit passé au Coastal Command fin 1940 : lent, mais il tient l'air neuf heures et porte loin au large.","Hudson":"Plus rapide et mieux armé que l'Anson ; certains reçoivent le premier radar ASV fin 1940.","Sunderland":"Hydravion à très grande autonomie : il va loin au-dessus de l'Atlantique.","Do 17":"Le « crayon volant » : rapide pour un bombardier, vulnérable aux attaques de face.","Ju 87":"Le bombardier en piqué : précis, mais lent et très vulnérable sans escorte.","He 111":"Le plus gros bombardier de 1940 : robuste, la plus forte charge.","Bf 109":"Le meilleur chasseur allemand ; son faible rayon d'action limite son temps au-dessus de l'Angleterre.","Bf 110":"Chasseur lourd biplace : grand rayon d'action, mais pataud face aux Spitfire et Hurricane.","convoy":"Des dizaines de cargos et de pétroliers, en colonnes, à la vitesse du plus lent.","escort":"En 1940, quelques navires seulement pour un grand convoi ; l'ASDIC ne voit pas un U-Boot en surface.","uboat":"En 1940, il attaque surtout de nuit, en surface : presque invisible, plus rapide qu'en plongée.","Ju 88":"Le plus moderne des bombardiers de 1940 : rapide, capable d'attaquer en piqué.","Bf 110 Jabo":"Bf 110 armés de bombes, comme l'Erprobungsgruppe 210 : ils frappent vite et bas les radars et les aérodromes.","Catalina":"Hydravion américain à très grande autonomie : il couvre les convois loin dans l'Atlantique."}},"save":{"export":"Exporter la partie (.json)","import":"Importer une partie…","errors":{"notAGame":"Ce fichier n'est pas une partie d escorte de cent chasseurs. La Big Wing de Duxford peut décoller."},"afternoon":{"title":"Après-midi","text":"Début d'après-midi : de nouvelles formations, plus nombreuses que ce matin, se rassemblent au-dessus du Pas-de-Calais."}},"hiver-atlantique":{"intro":{"title":"Western Approaches","text":"Prise de service, 10 janvier 1941. Le HX 102 appareille d'Halifax. Les convois suivent la route de l'Amirauté ; vous pouvez la changer pour contourner les U-Boote repérés. Envoyez un groupe d'escorte au-devant de chaque convoi qui approche : vos escorteurs n'ont que sept ou huit jours d'autonomie. Les nuits d'hiver sont longues, et c'est la nuit que les U-Boote attaquent."},"packs":{"title":"Nouvelles meutes","text":"Février : de nouveaux U-Boote quittent Lorient et Saint-Nazaire. L'amiral Dönitz les groupe en meutes plus à l'ouest."},"packs2":{"title":"Encore des U-Boote","text":"Fin février : d'autres U-Boote prennent la mer. Ceux qui ont tiré leurs torpilles reviennent après une quinzaine de jours au port."},"lendLease":{"title":"Prêt-bail","text":"11 mars 1941. Le président Roosevelt signe la loi du prêt-bail. La Grande-Bretagne n'a plus à payer comptant : les convois qui partent désormais sont chargés à plein, sans dépense."},"catalina":{"title":"Catalina","text":"Les Catalina achetés en Amérique sont arrivés à Castle Archdale. Leur autonomie leur permet de couvrir les convois bien plus loin que les autres avions."},"hudson":{"title":"Hudson","text":"Les Hudson achetés en Amérique sont arrivés à Limavady."}}},"offers":{"title":"Achats en Amérique","intro":"Avant le prêt-bail, la Grande-Bretagne paie comptant. Les convois partent chargés à plein tant que la réserve le permet ; ce qu'elle ne peut plus payer part sur lest.","congress":"Le Congrès débat du prêt-bail : chaque dollar dépensé ici manquera aux cargaisons. Vote attendu en mars.","stock":"Réserve : {n} millions de dollars (sur {m})","forecast":"Prévision de tonnage","fuel":"Carburant :","materiel":"Matériel :","forecastLine":"{unloaded} t déchargées + {atSea} t en mer + {buyable} t encore achetables = {total} t (objectif {target} t)","forecastHint":"Sans compter les pertes à venir, ni un éventuel prêt-bail. « Achetables » : les convois qui peuvent encore arriver avant la fin, payés avec la réserve.","forecastHintLend":"Sans compter les pertes à venir. Les convois qui peuvent encore arriver avant la fin partent chargés à plein.","next":"Prochains départs","nextLine":"{convoy} : {date}, chargé à plein, {cost} millions","nextLineShort":"{convoy} : {date}, chargé à {share} % seulement, faute de dollars ({cost} millions)","nextLineFree":"{convoy} : {date}, chargé à plein (prêt-bail)","lendLease":"Prêt-bail voté : les convois partent chargés à plein, sans dépense, et les avions sont fournis sans paiement.","aircraft":"Avions de patrouille","price":"{cost} millions de dollars, soit environ {fuel} t de carburant ou {materiel} t de matériel","priceFree":"Fournis au titre du prêt-bail, sans paiement","delivery":"Livraison en {days} jours : arrivée le {date} si vous commandez aujourd'hui","ordered":"Commande passée : les avions rejoindront leur base à la date annoncée au journal","buy":"Commander ({cost} M$)","buyFree":"Commander","bought":"Commandé","catalina":"4 Catalina pour Castle Archdale","hudson":"6 Hudson avec radar ASV pour Limavady","refused":"Pas assez de dollars pour cette commande."},"campaign":{"title":"Campagne, acte I","intro":"Les scénarios se suivent : une victoire ouvre le suivant.","won":"Gagné","open":"À jouer","locked":"Verrouillé","training":"Entraînement","unlockAll":"Débloquer tous les scénarios","unlocked":"Victoire : le scénario « {title} » est débloqué.","tutorial":"Les leçons","carryNote":"Pertes reportées : {share} % des avions au départ (réglage « Campagne »)."},"tutorial":{"step":"{lesson} · étape {n} sur {total}","next":"Suivant","finish":"Terminer la leçon","quit":"Quitter la leçon","waiting":"À vous…","lessons":{"intercept":{"name":"Leçon 1 · Intercepter","summary":"Un raid perdu, en démonstration, puis un raid à vous : décoller au premier plot","steps":{"welcome":{"title":"Le poste de commandement","text":"Juillet 1940 : vous commandez la chasse du sud-est de l'Angleterre. Les radars voient les raids se rassembler au-dessus de la France ; à vous de faire décoller à temps. D'abord, ce qui arrive quand on attend trop : l'instructeur prend la main."},"demo":{"title":"Démonstration : trop tard","text":"Un raid se rassemble au-dessus de Calais : sa plaque donne son numéro, ses avions et son altitude. L'instructeur attend qu'il passe la côte pour faire décoller le 32 Sqn de Biggin Hill. Le temps s'écoule à ×60."},"why":{"title":"Pourquoi c'était perdu","text":"Le radar a vu le raid à {seen}. L'ordre de décoller est parti à {ordered}, {waited} minutes plus tard ; les bombes sont tombées sur Hawkinge à {bombed}, {left} minutes après l'ordre. Or il faut deux minutes pour décoller, cinq pour monter à 12 000 ft, puis le trajet. Le préavis du radar ne suffit que si l'on décolle au premier plot."},"yourTurn":{"title":"À vous","text":"Un autre raid arrive dans deux minutes : une douzaine de bombardiers sans escorte. Le 32 Sqn rentre ; vous avez le 111 Sqn, à Croydon : sa fiche est ouverte. Dès que le raid apparaît, faites-le décoller."},"watch":{"title":"Guetter le premier plot","text":"Le temps s'écoule à ×10 (boutons ×1 à ×14 400 en haut, ou touches 1 à 6 ; Espace : pause). Une alerte s'affichera au premier plot du raid."},"scramble":{"title":"Alerte : décollez !","text":"Glissez depuis Croydon jusqu'au raid : le trait est la route du 111 Sqn, qui décolle aussitôt. Ou cliquez « Décoller » dans sa fiche, puis tracez sa route depuis l'escadrille."},"altitude":{"title":"Arriver au-dessus","text":"Le pointillé prolonge la trajectoire du raid : visez devant lui. Réglez l'altitude avec ↑ ↓ (par 1 000 ft) pour arriver au-dessus : l'attaque en piqué donne l'avantage. Si le raid change de cap, tracez une nouvelle route depuis l'escadrille."},"combat":{"title":"Tally-ho !","text":"Le combat se règle tout seul, passe après passe. Une escadrille à court de munitions ou de carburant rentre d'elle-même. Attendez la fin du raid."},"reports":{"title":"Le rapport","text":"Chaque raid se termine par un rapport : ouvrez « Rapports », dans la barre du haut, pour comparer le raid qu'on a laissé passer et le vôtre, ou passez à la suite."},"end":{"title":"Leçon terminée","text":"L'essentiel tient en une phrase : décoller au premier plot, et monter au-dessus. La leçon suivante montre ce qui fait voler les escadrilles : le carburant."}}},"supply":{"name":"Leçon 2 · Ravitailler","summary":"Un train de carburant et un stock minimum : sans eux, la chasse reste au sol","steps":{"welcome":{"title":"Le carburant","text":"Une escadrille consomme du carburant à chaque sortie, et sa base un peu chaque jour. Les convois le déchargent dans les ports ; les trains l'amènent aux bases. Sans ordre de train, Kanalkampf se perd par panne de carburant."},"base":{"title":"Une base à sec","text":"La fiche de Biggin Hill est ouverte : il lui reste 4 t de carburant, moins d'une sortie pour le 32 Sqn. Une alerte « stock bas » vous préviendrait en partie ; ici, on agit tout de suite."},"train":{"title":"Envoyer un train","text":"Voici la fiche du port de Southampton, qui a du carburant en stock, ouverte sur son onglet « Ordres ». Sous « Envoyer un train » : tapez 20 dans la case Carburant, choisissez Biggin Hill dans « Vers », puis cliquez « Envoyer »."},"minimum":{"title":"Un stock minimum","text":"Le train est parti. Pour ne plus y penser : dans la fiche de Biggin Hill, onglet « Ordres », sous « Stock minimum (carburant) », tapez 30 puis « Appliquer ». Dès que le stock, trains en route compris, passera sous ce seuil, un train partira seul du port le mieux placé."},"wait":{"title":"Le train roule","text":"Un train met quelques heures : chargement, trajet, déchargement. Accélérez le temps (×600) et suivez-le sur la carte, ou dans l'onglet Logistique du tableau d'état."},"end":{"title":"Leçon terminée","text":"Biggin Hill a de nouveau du carburant, et son stock minimum veille. Au début d'une bataille, fixez un stock minimum à chaque base de chasse : c'est le geste qui fait tenir Kanalkampf et Adlertag."}}},"escort":{"name":"Leçon 3 · Escorter","summary":"Un convoi, un groupe d'escorte, un rapport de quart et les grenades","steps":{"welcome":{"title":"La mer","text":"Janvier 1941. Le convoi HX 102 approche des îles Britanniques ; deux U-Boote rôdent près de sa route. En mer, le jeu vit au rythme des quarts : un rapport à chaque relève (0, 4, 8, 12, 16 et 20 h), et un arrêt seulement quand une décision vous attend."},"relief":{"title":"Attendre la relève","text":"Le temps s'écoule à ×600. À la relève de 8 h, le rapport de quart s'ouvrira tout seul : il a une décision pour vous."},"send":{"title":"À décider","text":"Le rapport dit ce qui s'est passé pendant le quart et, sous « À décider », ce qui vous attend : HX 102 navigue sans escorte, à portée du 1er groupe d'escorte. Cliquez le bouton « Envoyer EG 1 (Liverpool) » de cette ligne (ou, dans la fiche du groupe, « Rejoindre HX 102 »)."},"orders":{"title":"Consignes et grenades","text":"Voici la fiche du groupe. « Rester » : il garde le convoi et n'attaque que ce qui approche. « Chasser » : il quitte le convoi pour un U-Boot repéré. Chaque passe coûte des grenades (40 par navire, refaites au port) : « Plein » ou « Économe ». Choisissez une consigne ou un grenadage."},"sail":{"title":"Le groupe rejoint","text":"Accélérez (×3 600). Le groupe met un peu plus d'un jour à rejoindre le convoi ; les rapports de quart s'écrivent sans vous arrêter tant qu'il n'y a rien à décider (onglet « Signaux » du journal). Une attaque de nuit, elle, arrête le jeu."},"end":{"title":"Leçon terminée","text":"Le convoi a son escorte. Dans la partie complète s'ajoutent le silence radio (positions estimées en haute mer, ordres à la relève), le mazout des groupes et les avions de Coastal Command : l'aide de « Hiver dans l'Atlantique » les explique."}}},"alert":{"name":"Leçon 4 · États d'alerte et fatigue","summary":"Mettre au repos une escadrille fatiguée, rappeler une escadrille reposée, programmer les effectifs","steps":{"welcome":{"title":"Les pilotes","text":"Voler et se battre fatigue les pilotes ; une escadrille fatiguée se bat moins bien et perd plus d'avions. Au sol, seul le Repos repose vraiment. L'état d'alerte règle aussi le délai de décollage : Repos 2 h, Disponible 30 min, Alerte 5 min, Cockpit 2 min."},"rest":{"title":"Mettre au repos","text":"Le 32 Sqn est fatigué : sa fiche, ouverte, le dit sous son nom (72 %). Sous « État d'alerte », cliquez « Repos (2 h) » et confirmez. Il lui faudra deux heures pour revenir en alerte : on ne met pas tout le monde au repos en même temps."},"ready":{"title":"Rappeler une escadrille","text":"Le 111 Sqn, lui, est reposé et au repos. Dans sa fiche, cliquez « Alerte (5 min) » : le rappel prend 1 h 55, le temps de faire revenir le personnel. Descendre d'un état est immédiat, monter prend la différence des délais."},"roster":{"title":"La page Effectifs","text":"Pour ne pas le faire à la main chaque soir : le bouton « Effectifs » de la barre du haut ouvre le planning de chaque escadrille, heure par heure, qui se répète chaque jour. Ouvrez-la, ou passez à la suite."},"night":{"title":"Une nuit de repos","text":"Accélérez le temps (×600) : le 32 Sqn récupère huit points par heure au repos. Laissé en alerte à 5 minutes, il aurait continué à se fatiguer un peu."},"end":{"title":"Leçon terminée","text":"Une escadrille reposée la nuit reste fraîche toute une semaine ; laissée en alerte jour et nuit, elle finit fatiguée. Vous avez les quatre gestes : intercepter, ravitailler, escorter, reposer. La campagne commence avec Kanalkampf."}}}},"watching":"Regardez…","patience":"Le temps passe…","handsOff":"Démonstration : l'instructeur a la main. Votre tour vient juste après.","over":{"title":"La leçon s'arrête ici","text":"Le temps de « {lesson} » est écoulé avant sa dernière étape. Rien n'est perdu : une leçon se rejoue en quelques minutes, avec son instructeur.","again":"Rejouer la leçon"}},"alerts":{"uboatAttack":{"title":"Convoi attaqué","text":"{convoy} est attaqué par des U-Boote (navires coulés : {n}).","missed":"Un U-Boot a tiré sur {convoy}, sans le toucher. D'autres peuvent suivre."},"convoyBombed":{"title":"Convoi bombardé","text":"Le raid {raid} bombarde {convoy} (navires coulés : {n})."},"convoySighted":{"title":"Convoi pisté","text":"Un U-Boot piste {convoy} : la meute peut attaquer dès la nuit."},"uboatSighted":{"title":"U-Boot en vue","text":"{by} voit un U-Boot ({how}) en {where}.","near":"{by} voit un U-Boot ({how}) à {km} km de {convoy}."},"straggler":{"title":"Traînards","text":"Des navires de {convoy} décrochent (traînards : {n}). Réduisez la vitesse ou envoyez une escorte."},"convoyInEscortRange":{"title":"Escorte","text":"{convoy} arrive à portée de vos escortes (groupes libres au port : {n}).","none":"{convoy} arrive à portée de vos escortes, mais aucun groupe n'est libre."},"escortLowFuel":{"title":"Escorte à court","text":"{escort} doit rentrer se ravitailler : {convoy} n'a plus d'escorte.","alone":"{escort} doit rentrer se ravitailler."},"seaStop":{"title":"Convoi attaqué","text":"{convoy} est attaqué par un U-Boot : {n} navire(s) coulé(s). Le jeu est en pause ; les torpillages suivants de la nuit iront au rapport de quart.","missed":"{convoy} est attaqué par un U-Boot : torpilles manquées. Le jeu est en pause ; les attaques suivantes de la nuit iront au rapport de quart."},"escortChargesOut":{"title":"Grenades épuisées","text":"{escort} n'a plus de grenades près de {convoy} : il fait encore plonger, mais ne coulera plus rien. Le laisser, ou le renvoyer réarmer ?","alone":"{escort} n'a plus de grenades : il fait encore plonger, mais ne coulera plus rien. Le laisser, ou le renvoyer réarmer ?"},"escortDry":{"title":"Escorte à sec","text":"{
