<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table de traçage</title>
  <link rel="icon" href="data:,">
  <style>
/* Plotting table, 1940: dark wood around the map, paper cards, typewritten plaques. */

:root {
  --wood: #2e261c;
  --wood-light: #4a3c2a;
  --brass: #b8902f;
  --paper: #ede3c8;
  --paper-dark: #ddd0ae;
  --ink: #2b241a;
  --ink-soft: #5d513e;
  --raf-blue: #2c4a7c;
  --raf-red: #a8322d;
  --green: #2e6b3a;
  --amber: #b07a12;
  --panel-width: 340px;
  font-family: Georgia, "Times New Roman", serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--wood);
  color: var(--ink);
}

#app {
  display: grid;
  grid-template-rows: auto 1fr;
  grid-template-columns: 1fr var(--panel-width);
  height: 100vh;
  height: 100dvh;
}

/* ---------- top bar ---------- */

#hud {
  grid-column: 1 / 3;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  padding: 6px 12px;
  background: linear-gradient(#3a2f22, var(--wood));
  color: var(--paper);
  border-bottom: 3px solid #1b150e;
}

.hud-title { display: flex; flex-direction: column; line-height: 1.1; min-width: 150px; }
.hud-title strong { font-size: 15px; letter-spacing: 0.04em; }
.hud-title span { font-size: 12px; opacity: 0.75; font-style: italic; }

#clock { width: 46px; height: 46px; }

.hud-date { line-height: 1.15; min-width: 170px; }
#date { font-size: 13px; }
#time { font: bold 20px "Courier New", Courier, monospace; letter-spacing: 0.05em; }

.hud-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.speeds { display: flex; gap: 2px; }
.speed-group { position: relative; }
.speed-confirm {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: max-content; max-width: 420px;
  background: #6b4a12; color: #fff3e0; border: 2px solid #e8c27a; border-radius: 4px;
  padding: 6px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}
.speed-confirm[hidden] { display: none; }
.speed-confirm span { flex: 1 1 100%; }
#hud .speed-confirm button { background: #fff3e0; color: #6b4a12; border: none; font-weight: bold; }
#hud .speed-confirm button[data-confirm='no'] { background: transparent; color: #fff3e0; border: 1px solid #e8c27a; }

button {
  font: 13px Georgia, "Times New Roman", serif;
  cursor: pointer;
}

#hud button {
  background: var(--wood-light);
  color: #f2e9d2;
  border: 1px solid #8a7350;
  border-radius: 3px;
  padding: 4px 8px;
}
#hud button:hover { background: #5c4b34; }
#hud button.active { background: var(--brass); color: #1c160e; border-color: #e0c27a; }
.speeds button { font-family: "Courier New", Courier, monospace !important; padding: 4px 6px !important; }

.only-small { display: none !important; }

/* The tools: a pictogram, a short word under it when there is room, the name and the key in the tooltip. */
#hud .tools { flex-wrap: nowrap; gap: 3px; }
#hud button.tool, #hud #btn-pause {
  position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; min-width: 40px; min-height: 38px; padding: 3px 5px; line-height: 1;
}
#hud button.tool[hidden] { display: none; }
#hud .tool svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#hud .tool-glyph { font: bold 17px/19px Georgia, serif; height: 19px; }
#hud #btn-pause .tool-glyph { font: 13px/19px "Courier New", Courier, monospace; letter-spacing: -1px; }
#hud .tool-label { font-size: 10px; letter-spacing: 0.02em; white-space: nowrap; }
#hud .tool-count {
  position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: #b3261e; color: #fff; font: bold 11px/16px Georgia, serif; text-align: center; box-shadow: 0 0 0 1px #1b150e;
}
#hud .tool-count[hidden] { display: none; }
.hud-pop { position: relative; display: inline-flex; }
.pop-menu {
  position: absolute; top: calc(100% + 5px); left: 0; z-index: 30; display: flex; flex-direction: column; gap: 3px;
  min-width: 170px; padding: 6px; background: var(--wood); border: 1px solid #8a7350; border-radius: 4px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
}
.pop-menu[hidden] { display: none; }
#hud .pop-menu button { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; padding: 6px 9px; font-size: 13px; }
.pop-menu kbd { font: bold 11px "Courier New", Courier, monospace; border: 1px solid #8a7350; border-radius: 3px; padding: 0 4px; opacity: 0.85; }

/* Laptop widths: the top bar stays on one line. */
@media (max-width: 1700px) {
  #hud { gap: 6px 10px; padding: 5px 10px; }
  .hud-title { min-width: 0; }
  .hud-title strong { font-size: 14px; }
  .hud-title span { font-size: 11px; }
  .hud-date { min-width: 148px; }
  #date { font-size: 12px; }
  #hud button { padding: 3px 6px; font-size: 12.5px; }
  .speeds button { padding: 3px 4px !important; }
  #hud button.tool, #hud #btn-pause { min-width: 36px; padding: 3px 4px; }
}

/* Narrow laptops and tablets (1 024 px wide): everything tighter, and the bar still on one
   line with the word under each pictogram (a tablet has no bubble to name it). */
@media (max-width: 1250px) {
  #hud { gap: 5px 6px; padding: 4px 8px; }
  #hud .tool-label { font-size: 9.5px; }
  #hud button.tool, #hud #btn-pause { min-width: 32px; min-height: 32px; padding: 3px 2px; }
  /* « Non enregistré » as a sign alone (its bubble and the journal say the rest). */
  #hud #save-problem { font-size: 0; padding: 3px 7px !important; min-height: 32px; }
  #hud #save-problem::before { content: '⚠'; font-size: 16px; }
  .hud-title { max-width: 112px; }
  .hud-title strong { display: none; }
  #clock { width: 40px; height: 40px; }
  .hud-date { min-width: 0; }
  #time { font-size: 18px; }
  .speeds button { font-size: 12px !important; padding: 3px !important; }
}

/* ---------- map ---------- */

#table { position: relative; grid-row: 2; grid-column: 1; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }

.loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--paper); font-size: 16px; padding: 20px; text-align: center;
}
.loading.error { color: var(--raf-red); }
.loading[hidden] { display: none; }
.spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 4px solid var(--paper-dark); border-top-color: var(--raf-blue);
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.alert {
  position: absolute; top: 46px; left: 50%; transform: translateX(-50%);
  /* On a narrow table (a sheet open at 1 024 px) the text goes under the title on lines of
     its own, instead of one word a line beside it. */
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
  max-width: calc(100% - 24px);
  background: #7c1f18; color: #fff3e0;
  border: 2px solid #f0b8a0; border-radius: 4px;
  padding: 8px 12px; font-size: 14px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  z-index: 5;
}
.alert[hidden] { display: none; }
.alert strong { letter-spacing: 0.12em; white-space: nowrap; }
#alert-text { flex: 1 1 200px; min-width: 0; }
.alert .alert-buttons { margin-left: auto; }
/* A line dropped where several targets overlap: the small choice (dropChoice.js). */
.drop-choice {
  position: absolute; z-index: 6; display: flex; flex-direction: column; gap: 4px; min-width: 190px; max-width: 280px;
  padding: 8px 30px 8px 10px; background: var(--paper); color: var(--ink); border: 2px solid #1b150e; border-radius: 5px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
}
.drop-choice[hidden] { display: none; }
.drop-choice strong { font-size: 12px; letter-spacing: 0.04em; }
.drop-choice button { text-align: left; padding: 7px 10px; border: 1px solid #8a7350; border-radius: 4px; background: #f7f0dc; color: var(--ink); font: 13px Georgia, serif; cursor: pointer; }
.drop-choice button.secondary { background: transparent; font-style: italic; }
.drop-choice button.close { position: absolute; top: 4px; right: 4px; padding: 0 6px; border: none; background: transparent; font-size: 16px; }
.alert-kind { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; border: 1px solid #f0b8a0; border-radius: 3px; padding: 1px 5px; white-space: nowrap; }
.alert-kind[hidden] { display: none; }
.alert-buttons { display: flex; gap: 6px; white-space: nowrap; }
.alert button {
  background: #fff3e0; color: #7c1f18; border: none; border-radius: 3px; padding: 3px 10px; font-weight: bold;
}
.alert button.close { background: transparent; color: #fff3e0; font-size: 18px; padding: 0 4px; }
.alert.flash { animation: flash 0.5s ease-in-out 4; }
@keyframes flash { 50% { background: #b5291e; } }
.alert-more { font-size: 12px; opacity: 0.85; white-space: nowrap; }
.alert button[hidden] { display: none; }
/* A decision to take (escort, fuel, a convoy waiting): amber, no flashing red. */
.alert[data-level='warning'] { background: #6b4a12; border-color: #e8c27a; }
.alert[data-level='warning'] button:not(.close) { color: #6b4a12; }
.alert[data-level='warning'].flash { animation: flash-warning 0.5s ease-in-out 3; }
@keyframes flash-warning { 50% { background: #94661a; } }

/* ---------- developer mode ---------- */

.dev-badge {
  align-self: flex-start; display: inline-block; margin-top: 2px; padding: 0 6px; border-radius: 3px;
  background: #c0178f; color: #fff; font: bold 11px "Courier New", Courier, monospace; letter-spacing: 0.1em;
}
.dev-badge[hidden] { display: none; }
.tabs .dev-tab { color: #c0178f; }
.tabs .dev-tab[hidden] { display: none; }
.tote-row.dev-row { display: flex; align-items: center; gap: 6px; cursor: default; }
.dev-row .name { flex: 1 1 auto; min-width: 0; white-space: normal; font-weight: normal; font-size: 11.5px; color: #8a1468; }
.dev-row.active .name { font-weight: bold; }
.dev-row:not(.active) .name { opacity: 0.75; }
.dev-row button { flex: none; font-size: 11px; padding: 1px 6px; }

/* ---------- tutorial ---------- */

.coach {
  position: absolute; left: 12px; bottom: 12px; z-index: 4;
  width: min(360px, calc(100% - 24px));
  background: var(--paper); color: var(--ink);
  border: 2px solid var(--brass); border-radius: 4px;
  padding: 10px 12px; font-size: 13.5px; line-height: 1.4;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}
.coach[hidden] { display: none; }
/* The tutorial box stays beside the unit sheet, wherever the sheet stands. */
#table.with-unit:not(.sheet-bottom) .coach { width: min(360px, calc(100% - min(var(--sheet-w, 400px), 92%) - 24px)); }
#table.with-unit.sheet-left .coach { left: calc(min(var(--sheet-w, 400px), 92%) + 12px); }
#table.with-unit.sheet-bottom .coach { bottom: calc(min(var(--sheet-h, 300px), 80%) + 12px); }
.coach-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.coach-head small { color: var(--ink-soft); white-space: nowrap; }
.coach p { margin: 6px 0 8px; }
.coach-buttons { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.coach-buttons button:not(.link) {
  margin-left: auto; background: var(--raf-blue); color: #fff; border: none; border-radius: 3px; padding: 4px 12px; font: inherit;
}
.coach-wait { margin-left: auto; color: var(--ink-soft); font-style: italic; }
.coach .coach-nudge { margin: 0 0 8px; padding: 4px 8px; background: #f3e2b8; border-left: 3px solid var(--brass); font-size: 12.5px; }

/* ---------- campaign, purchases ---------- */

.scenarios .badge { font-size: 11px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; background: var(--paper-dark); color: var(--ink-soft); }
.scenarios .badge.won { background: var(--green); color: #fff; }
.scenarios .badge.open { background: var(--raf-blue); color: #fff; }
.scenarios li.locked p, .scenarios li.locked b { color: var(--ink-soft); }
.scenario-buttons { display: flex; gap: 8px; }
.unlocked { color: var(--green); font-weight: bold; }
.currency { padding: 4px 8px 8px; font-size: 13px; }
.currency p { margin: 4px 0; }
.currency .order-line { flex-wrap: wrap; }
.currency button {
  background: var(--paper); border: 1px solid var(--ink-soft); border-radius: 3px; padding: 2px 8px; font: inherit; color: var(--ink);
}
.currency button.active { background: var(--raf-blue); color: #fff; border-color: var(--raf-blue); }
.currency button:disabled { opacity: 0.55; }
.currency .offer { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.currency .offer .grow { flex: 1 1 auto; }
.currency .offer small { color: var(--ink-soft); }
.currency .offer button { white-space: nowrap; }
.next-sailings { margin: 2px 0 6px; padding-left: 18px; }
.forecast { margin: 2px 0 4px; padding-left: 18px; }
.forecast li { margin: 2px 0; }
.forecast li.short { color: #8a3b1c; }
.currency .hint.warn { color: #8a3b1c; font-style: normal; }

/* ---------- side panel ---------- */

#panel {
  grid-row: 2; grid-column: 2;
  overflow-y: auto;
  background: var(--paper);
  border-left: 4px solid #1b150e;
  padding: 6px 10px 20px;
  font-size: 13px;
}

#panel section { margin-bottom: 10px; }
#panel h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--ink-soft); border-bottom: 1px solid var(--paper-dark);
  margin: 8px 0 6px; padding-bottom: 3px;
}

.objectives { list-style: none; margin: 0; padding: 0; }
.objectives li { display: flex; gap: 6px; padding: 2px 0; }
.objectives .tick { width: 14px; color: var(--ink-soft); font-weight: bold; }
.objectives li.done { color: var(--green); }
.objectives li.done .tick { color: var(--green); }

.tote-group { font-size: 11px; color: var(--ink-soft); margin: 6px 0 2px; font-style: italic; }
.tote-row {
  display: grid; grid-template-columns: 12px 64px 1fr auto; gap: 6px; align-items: center;
  padding: 3px 4px; border-radius: 3px; cursor: pointer;
  font-family: "Courier New", Courier, monospace; font-size: 12px;
}
.tote-row:hover { background: var(--paper-dark); }
.tote-row.sel { background: #e2cfa0; outline: 1px solid var(--brass); }
.tote-row .name { font-weight: bold; }
.tote-row .extra { color: var(--ink-soft); text-align: right; }
.tote-empty { color: var(--ink-soft); font-style: italic; padding: 2px 4px; }

.lamp { width: 10px; height: 10px; border-radius: 50%; background: #9c927d; border: 1px solid rgba(0, 0, 0, 0.35); }
.lamp.sq-ready { background: var(--green); }
.lamp.sq-scrambling { background: var(--amber); }
.lamp.sq-airborne { background: var(--raf-blue); }
.lamp.sq-combat { background: var(--raf-red); }
.lamp.sq-returning { background: #6b7fa3; }
.lamp.sq-refuelling { background: #c9b98f; }
.lamp.sq-lost { background: #000; }
.lamp.convoy-inPort, .lamp.convoy-waiting { background: var(--amber); }
.lamp.convoy-atSea { background: var(--raf-blue); }
.lamp.convoy-arrived { background: var(--green); }
.lamp.raid { background: var(--raf-red); border-radius: 1px; }
.lamp.convoy-lost { background: #000; }
.lamp.site-intact { background: var(--green); }
.lamp.site-damaged { background: var(--amber); }
.lamp.site-out { background: var(--raf-red); }
.tote { max-height: 36vh; overflow-y: auto; }
.tote-row.site { grid-template-columns: 12px 118px 1fr auto; }
.status-intact { color: var(--green); }
.status-damaged { color: var(--amber); }
.status-out { color: var(--raf-red); }

#panel h2.with-tabs { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 4px 8px; }
.tabs { display: flex; gap: 2px; text-transform: none; letter-spacing: 0; }
.tabs[hidden] { display: none; }
.tabs button {
  font-size: 12px; padding: 2px 8px; background: transparent; color: var(--ink-soft);
  border: 1px solid var(--paper-dark); border-bottom: none; border-radius: 3px 3px 0 0;
}
.tabs button.active { background: var(--paper-dark); color: var(--ink); font-weight: bold; }

.profile { display: block; width: 100%; height: 140px; margin: 8px 0 2px; border: 1px solid var(--paper-dark); border-radius: 3px; }
.profile[hidden] { display: none; }
.plan .sub { font-size: 12px; color: var(--ink-soft); margin: 8px 0 3px; }
.legs { margin: 0; padding-left: 20px; font-size: 12px; }
.legs li { padding: 2px 0; border-bottom: 1px dotted var(--paper-dark); }
.legs li .leg-text { font-family: "Courier New", Courier, monospace; font-weight: bold; }
.legs li .leg-status { color: var(--ink-soft); font-style: italic; margin-left: 4px; }
.legs li.current .leg-text { color: var(--raf-blue); }
.orders button.icon, .legs button.icon { padding: 0 6px; margin-left: 4px; font-size: 13px; line-height: 16px; background: transparent; border: 1px solid #b9a77f; border-radius: 3px; }
.message { margin: 4px 0; padding: 4px 6px; border-radius: 3px; font-size: 12px; }
.message.warning { background: #f6e3b8; color: #6b4408; border: 1px solid #d9b56a; }
.leg-form { border-top: 1px solid var(--paper-dark); padding-top: 4px; margin-top: 2px; }
.leg-form .sub { font-size: 12px; color: var(--ink-soft); margin: 2px 0 4px; }
.leg-form label { display: flex; align-items: center; gap: 4px; color: var(--ink-soft); }
.leg-form label.grow { flex: 1 1 120px; }
.leg-form label.grow input { flex: 1; min-width: 70px; }
.orders input[type="text"] { font: 14px "Courier New", Courier, monospace; padding: 3px; }
.leg-form input[type="number"] { width: 58px; }
.order-line .alt-value { font: bold 15px "Courier New", Courier, monospace; min-width: 84px; text-align: center; }
.report-line { font-size: 12px; background: #efe4c4; border-left: 3px solid #6e4d8f; padding: 4px 6px; margin: 6px 0 2px; }
.attacks { margin: 2px 0; padding-left: 18px; font-size: 12px; }
.log .log-report { color: #3f2a5c; background: #efe4c4; }
.objectives li.failed { color: var(--raf-red); }
.lamp.escort-inPort, .lamp.escort-refit { background: #9aa6b1; }
.lamp.escort-atSea, .lamp.escort-waiting { background: #4f6070; }
.lamp.escort-escorting { background: var(--green); }
.lamp.stock-ok { background: var(--green); }
.lamp.stock-mid { background: var(--amber); }
.lamp.stock-low { background: var(--raf-red); }
.lamp.stock-none { background: #9c927d; }
.lamp.train-fuel { background: #c47a1d; border-radius: 1px; }
.lamp.train-materiel { background: #6a6a74; border-radius: 1px; }
.lamp.train-mixed { background: linear-gradient(90deg, #c47a1d 50%, #6a6a74 50%); border-radius: 1px; }
.lamp.train-ammo { background: #7a4a2a; border-radius: 1px; }
.tote-row.stock { grid-template-columns: 12px 96px 1fr auto; }
.leg-form select { font: 13px Georgia, serif; max-width: 100%; }
.leg-form label.grow select { flex: 1; min-width: 120px; }
.verdict.won { color: var(--green); }
.verdict.lost { color: var(--raf-red); }
dialog h3 { font-size: 14px; margin: 10px 0 4px; }
.end-objectives { list-style: none; padding-left: 4px; }
.end-objectives li.done { color: var(--green); }
.end-objectives li.failed { color: var(--raf-red); }
.end-clock { font-size: 13px; opacity: 0.8; }
.scenarios { list-style: none; padding: 0; }
.scenarios li { border: 1px solid var(--paper-dark); border-radius: 4px; padding: 8px 10px; margin: 8px 0; }
.scenarios li.current { border-color: var(--brass); background: #efe4c4; }
.scenarios li p { margin: 4px 0 6px; font-size: 13px; }
.scenarios button { background: var(--raf-blue); color: #fff; border: none; border-radius: 3px; padding: 4px 12px; }
.log .log-logistics { color: #5a4a2a; }
.log .log-day { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); background: var(--paper-dark); padding: 2px 4px; margin-top: 4px; }

.sheet h3 { margin: 2px 0 6px; font-size: 15px; }
.sheet h3 small { font-weight: normal; font-style: italic; color: var(--ink-soft); font-size: 12px; }
.sheet .sub { font-size: 12px; color: var(--ink-soft); margin: 4px 0; }
.kv { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; border-bottom: 1px dotted var(--paper-dark); }
.kv span { color: var(--ink-soft); }
.kv b { font-family: "Courier New", Courier, monospace; text-align: right; }

.orders { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.order-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.order-line > span { min-width: 92px; color: var(--ink-soft); }
.orders button {
  background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 3px; padding: 5px 9px;
}
.orders button:hover:not([disabled]):not(.active) { background: #fffaf0; }
.orders button.active { background: var(--raf-blue); color: #fff; border-color: var(--raf-blue); }
.orders button[disabled] { opacity: 0.45; cursor: default; }
.orders input[type="number"] { width: 64px; font: 14px "Courier New", Courier, monospace; padding: 3px; }
.hint { color: var(--ink-soft); font-style: italic; font-size: 12px; margin: 4px 0; }
/* Help folded away (setting « Aides des fiches »): a « ? » by section shows it again. */
.help-folded p.hint:not(.warn):not(.show) { display: none; }
.hint-toggle, #unit-panel .hint-toggle {
  display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
  margin: 0 0 0 6px; width: 18px; height: 18px; min-width: 0; min-height: 0; padding: 0; border-radius: 50%;
  border: 1px solid #8a7350; background: #f7f0dc; color: var(--ink);
  font: bold 11px/1 Georgia, serif; text-transform: none; letter-spacing: 0; cursor: pointer; vertical-align: middle;
}
.hint-toggle.active { background: var(--raf-blue); color: #fff; border-color: var(--raf-blue); }
.hint-top { text-align: right; margin: 0 0 2px; }

.log { list-style: none; margin: 0; padding: 0; font-size: 12px; }
.log li { padding: 3px 0; border-bottom: 1px dotted var(--paper-dark); }
.log time { font-family: "Courier New", Courier, monospace; font-weight: bold; color: var(--ink-soft); margin-right: 4px; }
.log .log-alert { color: #8c1d16; font-weight: bold; }
.log .log-warning { color: #8a5a0b; }
.log .log-success { color: var(--green); }
.log .log-combat { color: #4a2a6e; }

/* ---------- dialogs ---------- */

dialog {
  border: 3px solid var(--wood); border-radius: 6px;
  background: var(--paper); color: var(--ink);
  max-width: min(560px, 94vw); padding: 16px 20px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
}
dialog::backdrop { background: rgba(20, 15, 10, 0.55); }
dialog h2 { margin-top: 0; font-size: 18px; }
dialog ol, dialog ul { padding-left: 20px; line-height: 1.45; }
dialog .keys { font-size: 12px; color: var(--ink-soft); }
.dialog-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.dialog-buttons button[disabled] { opacity: 0.45; cursor: default; }
.dialog-buttons button {
  background: var(--raf-blue); color: #fff; border: none; border-radius: 3px; padding: 6px 14px;
}
.settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0; }
.settings label.check { justify-content: flex-start; }
.settings fieldset { border: 1px solid var(--paper-dark); border-radius: 4px; margin: 10px 0; }
.settings select { font: 13px Georgia, serif; max-width: 60%; }

/* ---------- small screens: the panel becomes a drawer ---------- */

@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; }
  #hud { gap: 6px 8px; padding: 4px 8px; }
  .hud-title { display: none; }
  .hud-date { min-width: 0; }
  #date { font-size: 11px; }
  #time { font-size: 16px; }
  #clock { width: 36px; height: 36px; }
  .only-small { display: inline-block !important; }
  #hud button { font-size: 12px; padding: 3px 6px !important; }
  .speeds button { padding: 3px 4px !important; }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; height: 52vh; z-index: 10;
    border-left: none; border-top: 4px solid #1b150e;
    transform: translateY(100%); transition: transform 0.2s ease-out;
  }
  #panel.open { transform: none; }
}

/* Route editing and leg changes */
.point-block { border: 1px solid var(--paper-dark); background: rgba(255, 252, 240, 0.6); border-radius: 4px; padding: 3px 6px 4px; margin: 4px 0 6px; }
.point-block .sub { margin: 0 0 3px; font-weight: bold; color: var(--raf-blue); }
.legs li.editing .leg-text { color: var(--raf-red, #a8322d); }
.leg-form.editing { background: rgba(168, 50, 45, 0.06); border-radius: 4px; }
.order-line label.grow { display: flex; align-items: center; gap: 4px; flex: 1 1 160px; color: var(--ink-soft); }
.order-line label.grow select { flex: 1; min-width: 140px; font: 13px Georgia, serif; }
.leg-form input#leg-alt { width: 70px; }

/* Journal: days fold under their date, the whole journal folds under its title */
.log li.log-group { border: none; padding: 0; }
.log .log-group > .log-day { cursor: pointer; user-select: none; display: block; }
.log .log-group > .log-day .count { float: right; text-transform: none; letter-spacing: 0; }
.log .fold, h2.foldable .fold { display: inline-block; transition: transform 0.15s; font-size: 10px; }
.log .log-group.collapsed > .log-day .fold { transform: rotate(-90deg); }
.log .log-group.collapsed > .log-entries { display: none; }
.log-entries { list-style: none; margin: 0; padding: 0; }
h2.foldable { cursor: pointer; user-select: none; }
.log-section.collapsed h2.foldable .fold { transform: rotate(-90deg); }
.log-section.collapsed #log { display: none; }
/* The lines of the alerts that were not read: shown when the Journal button opens the journal on them. */
.log li.unread { background: #fbe6c8; box-shadow: inset 3px 0 0 #b3261e; padding-left: 7px; }
.log li.has-report { cursor: pointer; }
.log li.has-report:hover { text-decoration: underline dotted; }

/* Pages over the map (reports, cards) */
dialog.page-dialog { max-width: min(900px, 94vw); width: 900px; max-height: 88vh; overflow: auto; }
.page h2 { position: sticky; top: -16px; background: var(--paper); padding: 4px 0; margin: -4px 0 6px; z-index: 1; }
.report-day h3 { border-bottom: 2px solid var(--paper-dark); padding-bottom: 2px; }
.report-day h3 small { font-weight: normal; color: var(--ink-soft); margin-left: 8px; }
.report { border: 1px solid var(--paper-dark); border-left: 5px solid #9c927d; border-radius: 4px; padding: 6px 10px; margin: 8px 0; background: rgba(255, 252, 240, 0.55); font-size: 13px; }
.report.focus { box-shadow: 0 0 0 2px var(--brass); }
.report header { display: flex; gap: 10px; align-items: baseline; }
.report header .when { color: var(--ink-soft); font-family: "Courier New", Courier, monospace; }
.report header .tag { margin-left: auto; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; padding: 1px 6px; border-radius: 3px; background: var(--paper-dark); }
.report.outcome-destroyed, .report.outcome-repelled { border-left-color: var(--green); }
.report.outcome-destroyed .tag, .report.outcome-repelled .tag { background: var(--green); color: #fff; }
.report.outcome-bombed, .report.outcome-unopposed { border-left-color: var(--raf-red); }
.report.outcome-bombed .tag, .report.outcome-unopposed .tag { background: var(--raf-red); color: #fff; }
.report.outcome-ongoing { border-left-color: var(--brass); }
.report p { margin: 4px 0; }
.report .totals { font-weight: bold; }
.report table.fights { width: 100%; border-collapse: collapse; margin: 4px 0; font-size: 12px; }
.report table.fights th { text-align: left; font-weight: normal; color: var(--ink-soft); border-bottom: 1px solid var(--paper-dark); }
.report table.fights td { padding: 2px 4px; border-bottom: 1px dotted var(--paper-dark); vertical-align: top; }
.report table.fights .n { text-align: right; white-space: nowrap; }
.report table.fights tr.missed td { color: #8a5a0b; }

/* Crews */
.fatigue-fresh { color: var(--green); }
.fatigue-tired { color: #8a5a0b; font-weight: bold; }
.fatigue-exhausted { color: var(--raf-red); font-weight: bold; }
.lamp.alert-rest { box-shadow: inset 0 0 0 2px #9c927d; }
.lamp.alert-cockpit { box-shadow: 0 0 0 2px #e0c27a; }
.lamp.uboat { background: #7a1e18; border-radius: 0; clip-path: polygon(0 60%, 30% 60%, 35% 20%, 60% 20%, 65% 60%, 100% 60%, 85% 100%, 15% 100%); }

/* Technical cards */
.card-section h3 { border-bottom: 2px solid var(--paper-dark); padding-bottom: 2px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.card { border: 1px solid var(--paper-dark); border-radius: 4px; padding: 6px 10px; background: rgba(255, 252, 240, 0.55); font-size: 12.5px; }
.card.focus { box-shadow: 0 0 0 2px var(--brass); }
.card h4 { margin: 0 0 2px; font-size: 14px; }
.card .hint { margin: 2px 0 4px; }
.card-table { width: 100%; border-collapse: collapse; }
.card-table th { text-align: left; font-weight: normal; color: var(--ink-soft); padding: 1px 4px 1px 0; width: 48%; vertical-align: top; }
.card-table td { font-weight: bold; padding: 1px 0; }
button.link { background: none; border: none; padding: 0; font: inherit; color: var(--raf-blue); cursor: pointer; text-decoration: underline dotted; }
.save-buttons { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.save-buttons button, .file-button { background: var(--wood-light); color: #f2e9d2; border: 1px solid #8a7350; border-radius: 3px; padding: 4px 10px; cursor: pointer; font: 13px Georgia, serif; }

/* ---------- unit panel: the sheet of the selected unit, over the right edge of the map ---------- */

.unit-panel {
  position: absolute; top: 0; right: 0; bottom: 0; z-index: 3;
  width: min(var(--sheet-w, 400px), 92%);
  display: flex; flex-direction: column;
  background: var(--paper); color: var(--ink);
  border-left: 3px solid #1b150e;
  box-shadow: -6px 0 18px rgba(0, 0, 0, 0.28);
  font-size: 13px;
}
.unit-panel[hidden] { display: none; }
/* The units of a stack: vertical tabs on the edge of the sheet that faces the map. */
.unit-stack {
  position: absolute; top: 58px; right: 100%; z-index: 4; display: flex; flex-direction: column; gap: 3px; align-items: flex-end;
  max-height: calc(100% - 70px); overflow-y: auto;
}
.unit-stack[hidden] { display: none; }
.unit-stack button {
  max-width: 150px; padding: 7px 10px; border: 2px solid #1b150e; border-right: none; border-radius: 5px 0 0 5px;
  background: #d9ccac; color: var(--ink); font: 13px Georgia, serif; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer; box-shadow: -3px 2px 8px rgba(0, 0, 0, 0.25);
}
.unit-stack button.active { background: var(--paper); font-weight: bold; padding-right: 14px; }
#table.sheet-left .unit-stack { right: auto; left: 100%; align-items: flex-start; }
#table.sheet-left .unit-stack button { border: 2px solid #1b150e; border-left: none; border-radius: 0 5px 5px 0; box-shadow: 3px 2px 8px rgba(0, 0, 0, 0.25); }
#table.sheet-bottom .unit-stack { top: auto; bottom: 100%; right: auto; left: 12px; flex-direction: row; align-items: flex-end; max-height: none; }
#table.sheet-bottom .unit-stack button { border: 2px solid #1b150e; border-bottom: none; border-radius: 5px 5px 0 0; }
.unit-head { display: flex; align-items: flex-start; gap: 6px; padding: 8px 10px 0; }
.unit-head h2 { flex: 1 1 auto; margin: 0; font-size: 15px; line-height: 1.25; }
.unit-head h2 small { font-weight: normal; font-style: italic; color: var(--ink-soft); font-size: 12px; }
.unit-head-buttons { display: flex; gap: 4px; flex: none; }
.icon-button {
  width: 26px; height: 26px; padding: 0; line-height: 22px; font-size: 16px;
  background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 3px; cursor: pointer;
}
.icon-button:hover { background: #fffaf0; }
.icon-button.close { font-size: 19px; }
.unit-summary { margin: 3px 10px 6px; font-size: 12px; color: var(--ink-soft); font-family: "Courier New", Courier, monospace; }
.unit-summary:empty { display: none; }
.unit-tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--paper-dark); }
.unit-tabs[hidden] { display: none; }
.unit-tabs button {
  flex: 1 1 auto; white-space: nowrap; font: 12.5px Georgia, serif; padding: 4px 6px; cursor: pointer;
  background: transparent; color: var(--ink-soft);
  border: 1px solid var(--paper-dark); border-bottom: none; border-radius: 3px 3px 0 0;
}
.unit-tabs button.active { background: var(--paper-dark); color: var(--ink); font-weight: bold; }
.unit-body { flex: 1 1 auto; overflow-y: auto; padding: 4px 10px 16px; }
.unit-body .sub { font-size: 12px; color: var(--ink-soft); margin: 8px 0 3px; }
.unit-body .cards.one { grid-template-columns: 1fr; margin-top: 6px; }
.formation-line { border: 1px solid var(--paper-dark); border-radius: 4px; padding: 4px 6px; background: rgba(255, 252, 240, 0.6); }
.formation-line p { margin: 2px 0 4px; }
.members { list-style: none; margin: 6px 0; padding: 0; }
.members li { display: grid; grid-template-columns: 1fr auto; gap: 1px 6px; padding: 4px 0; border-bottom: 1px dotted var(--paper-dark); }
.members li.leader .member-name { color: var(--raf-blue); }
.members .member-name { font-weight: bold; }
.members .member-state { grid-column: 1; color: var(--ink-soft); font-size: 12px; }
.members .member-extra { grid-column: 1; font: 11.5px "Courier New", Courier, monospace; color: var(--ink-soft); }
.members .member-buttons { grid-column: 2; grid-row: 1 / 4; display: flex; flex-direction: column; gap: 3px; justify-content: center; }
.members button {
  background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 3px; padding: 3px 8px; cursor: pointer;
}
.members button:hover { background: #fffaf0; }

/* Formations in the tote board: one line, its members in small below. */
/* The formation's name on its own line, its state and size below. */
.tote-row.formation { grid-template-columns: 12px 1fr auto; row-gap: 0; }
.tote-row.formation .name { grid-column: 2 / 4; color: var(--raf-blue); }
.tote-row.formation .state { grid-column: 2; }
.tote-row.formation .extra { grid-column: 3; }
.tote-row.member { padding-left: 18px; font-size: 11px; opacity: 0.85; grid-template-columns: 8px 58px 1fr auto; }
.tote-row.member .lamp { width: 7px; height: 7px; }

/* The formations page: two columns, like choosing the columns of a table. */
.formations-page .fm-kinds, .formations-page .fm-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.formations-page .fm-kinds button, .formations-page .fm-chip {
  background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 14px; padding: 3px 12px; cursor: pointer; font: 13px Georgia, serif;
}
.formations-page .fm-kinds button.active, .formations-page .fm-chip.active { background: var(--raf-blue); color: #fff; border-color: var(--raf-blue); }
.formations-page .fm-chip small { opacity: 0.75; margin-left: 4px; }
.formations-page .fm-chip.new { border-style: dashed; }
.fm-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fm-col { border: 1px solid var(--paper-dark); border-radius: 4px; padding: 6px 8px; background: rgba(255, 252, 240, 0.55); min-height: 240px; }
.fm-col h3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 14px; }
.fm-col h3 select { font: 12.5px Georgia, serif; max-width: 55%; }
.fm-list, .fm-members { list-style: none; margin: 0; padding: 0; max-height: 46vh; overflow-y: auto; }
.fm-row { display: grid; grid-template-columns: auto 1fr auto; gap: 1px 8px; align-items: center; padding: 4px 2px; border-bottom: 1px dotted var(--paper-dark); }
.fm-list .fm-row { grid-template-columns: 1fr auto; }
.fm-row .fm-name { font-weight: bold; }
.fm-row .fm-meta { grid-column: 1 / 2; font-size: 11.5px; color: var(--ink-soft); }
.fm-members .fm-row .fm-meta { grid-column: 2 / 3; }
.fm-list .fm-row > button { grid-row: 1 / 3; grid-column: 2; }
.fm-members .fm-row .fm-move { grid-row: 1 / 3; grid-column: 3; display: flex; gap: 3px; }
.fm-members .fm-row .fm-star { grid-row: 1 / 3; }
.fm-row.leader .fm-name { color: var(--raf-blue); }
.fm-row.off { opacity: 0.55; }
.fm-row button {
  background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 3px; padding: 2px 8px; cursor: pointer; font-size: 14px;
}
.fm-row button[disabled] { opacity: 0.4; cursor: default; }
.fm-row .fm-star { border: none; background: none; font-size: 18px; color: var(--brass); padding: 0 2px; }
.fm-empty { color: var(--ink-soft); font-style: italic; padding: 6px 2px; }
.fm-label { display: flex; align-items: center; gap: 8px; margin: 2px 0 4px; }
.fm-label input { flex: 1 1 auto; font: 14px Georgia, serif; padding: 3px 6px; }
.fm-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
.fm-actions button { background: #f7f0dc; border: 1px solid #8a7350; border-radius: 3px; padding: 4px 10px; cursor: pointer; }
.fm-actions button.danger { color: var(--raf-red); border-color: var(--raf-red); }

@media (max-width: 820px) {
  .unit-panel { top: auto; left: 0; width: auto; height: 58%; border-left: none; border-top: 3px solid #1b150e; }
  .fm-columns { grid-template-columns: 1fr; }
}

/* With the unit panel open, the alert stays over the part of the map that can be seen. */
#table.with-unit .alert { left: calc((100% - min(var(--sheet-w, 400px), 92%)) / 2); max-width: calc(100% - min(var(--sheet-w, 400px), 92%) - 24px); }
#table.with-unit.sheet-left .alert { left: calc(min(var(--sheet-w, 400px), 92%) + (100% - min(var(--sheet-w, 400px), 92%)) / 2); }
#table.with-unit.sheet-bottom .alert { left: 50%; max-width: calc(100% - 24px); }
@media (max-width: 820px) {
  #table.with-unit .alert { left: 50%; max-width: calc(100% - 24px); }
}


/* Questions from the squadrons: leave to engage, to pursue, to go on beyond mid-Channel. */
.question {
  position: absolute; top: 46px; left: 50%; transform: translateX(-50%); z-index: 6;
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px;
  max-width: calc(100% - 24px);
  background: #1f3557; color: #f2ecd8;
  border: 2px solid #9fb6d9; border-radius: 4px;
  padding: 8px 12px; font-size: 14px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  animation: flash-question 0.6s ease-in-out 3;
}
.question[hidden] { display: none; }
.question strong { letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
#question-text { flex: 1 1 260px; min-width: 0; }
.question-left { font: bold 13px "Courier New", Courier, monospace; color: #ffd98a; white-space: nowrap; }
.question-buttons { display: flex; gap: 6px; white-space: nowrap; }
.question button { background: #f2ecd8; color: #1f3557; border: none; border-radius: 3px; padding: 4px 10px; font-weight: bold; cursor: pointer; }
.question button.secondary { background: transparent; color: #f2ecd8; border: 1px solid #9fb6d9; font-weight: normal; }
.question-more { font-size: 12px; opacity: 0.85; white-space: nowrap; }
@keyframes flash-question { 50% { background: #2c4a7c; } }
/* With a question shown, the alert banner moves below it. */
#table.has-question .alert { top: 110px; }
#table.with-unit .question { left: calc((100% - min(var(--sheet-w, 400px), 92%)) / 2); max-width: calc(100% - min(var(--sheet-w, 400px), 92%) - 24px); }
#table.with-unit.sheet-left .question { left: calc(min(var(--sheet-w, 400px), 92%) + (100% - min(var(--sheet-w, 400px), 92%)) / 2); }
#table.with-unit.sheet-bottom .question { left: 50%; max-width: calc(100% - 24px); }
@media (max-width: 820px) {
  #table.with-unit .question { left: 50%; max-width: calc(100% - 24px); }
}
.question button.default { outline: 2px solid #ffd98a; }

/* Alert states, duty roster, timetable, rendezvous */
.alert-line button { padding: 4px 6px; font-size: 12.5px; }
.unit-body .order-line .at { min-width: 0; color: var(--ink-soft); }
.unit-body .check { display: inline-flex; align-items: center; gap: 3px; color: var(--ink-soft); font-size: 12px; }
.unit-body .small { display: inline-flex; align-items: center; gap: 3px; color: var(--ink-soft); font-size: 12px; }
.unit-body .small input { width: 52px; }
.time-input { font: 14px "Courier New", Courier, monospace; padding: 2px 3px; width: 58px; }
.day-select { font: 12.5px Georgia, serif; min-width: 96px; max-width: 130px; }
.order-line.scheduled { background: #e6ecf5; border: 1px solid #b8c6dc; border-radius: 4px; padding: 3px 6px; }
.order-line.scheduled .grow { flex: 1 1 auto; min-width: 0; }
.roster-list { list-style: none; margin: 2px 0 4px; padding: 0; font-size: 12px; }
.roster-list li { display: flex; justify-content: space-between; align-items: center; padding: 1px 0; border-bottom: 1px dotted var(--paper-dark); }
.confirm-box { border: 1px solid #c9a24a; background: #f6e3b8; border-radius: 4px; padding: 4px 8px; }
.confirm-box p { margin: 2px 0 4px; font-size: 12.5px; }
.first-hint { border: 2px solid var(--brass); background: #fff6dc; border-radius: 4px; padding: 6px 8px; font-size: 12.5px; }
.first-hint p { margin: 0 0 6px; }
.rally-status { margin: 2px 0; font-weight: bold; color: var(--raf-blue); }
.rally-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.rally-table td { padding: 3px 2px; border-bottom: 1px dotted var(--paper-dark); vertical-align: middle; }
.rally-table td small { color: var(--ink-soft); }
.rally-table .time-input { width: 58px; }
.roster-tab .roster-squadron { border: 1px solid var(--paper-dark); border-radius: 4px; padding: 4px 6px; margin: 4px 0; background: rgba(255, 252, 240, 0.55); }
.roster-head { display: flex; justify-content: space-between; font-size: 12.5px; }
.roster-head span { color: var(--ink-soft); }
.timeline { display: flex; height: 12px; border: 1px solid #8a7350; border-radius: 2px; overflow: hidden; margin: 4px 0 0; }
.timeline .seg { display: block; height: 100%; }
.timeline-ticks { position: relative; height: 13px; font: 10px "Courier New", Courier, monospace; color: var(--ink-soft); margin-bottom: 2px; }
.timeline-ticks span { position: absolute; transform: translateX(-50%); }
.timeline-ticks span:first-child { transform: none; }
.timeline-ticks span:last-child { transform: translateX(-100%); }
.seg.alert-rest { background: #b9b2a2; }
.seg.alert-thirty { background: #9fb6d9; }
.seg.alert-available { background: #5f9b6a; }
.seg.alert-cockpit { background: #d39a3a; }
.seg.recall { background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.55) 0 3px, transparent 3px 7px); }
.legend-line { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px; color: var(--ink-soft); margin: 2px 0 4px; }
.legend { display: inline-flex; align-items: center; gap: 4px; }
.legend .seg { display: inline-block; width: 14px; height: 9px; border: 1px solid #8a7350; }
.lamp.alert-thirty { box-shadow: inset 0 0 0 2px #9fb6d9; }

/* Developer mode box in the settings */
.dev-settings .dev-password { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 2px 22px; }
.dev-settings .dev-password[hidden] { display: none; }
.dev-settings .dev-password input { font: 14px Georgia, serif; padding: 3px 5px; width: 170px; }
.dev-settings .dev-error { flex-basis: 100%; color: #8b1a1a; font-size: 12.5px; }

.timeline-override { height: 3px; margin-top: 1px; background: repeating-linear-gradient(90deg, #8b1a1a 0 6px, transparent 6px 9px); }
.roster-mode { margin: 2px 0; }
.roster-list.override li span { color: #8b1a1a; }
.offset-input { width: 48px; font: 14px "Courier New", Courier, monospace; padding: 2px 3px; }
.roster-list li.past { opacity: 0.5; }
.roster-list small { color: var(--ink-soft); font-size: 11px; }

/* Depth-charge attacks in the reports */
.report.naval { border-left: 4px solid #4f6070; }
.report.naval.outcome-sunk { border-left-color: #2e7d32; }
.report.naval.outcome-damaged { border-left-color: #c9a24a; }
.report.naval .passes { margin: 4px 0 2px 18px; padding: 0; font-size: 12.5px; }
.report.naval .passes .when { font-family: "Courier New", Courier, monospace; color: var(--ink-soft); }
.orders .order-line.hunting { background: #f6e3b8; border: 1px solid #c9a24a; border-radius: 4px; padding: 3px 6px; }

/* Settings in tabs */
.settings-tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--paper-dark); margin: 4px 0 8px; }
.settings-tabs button { border: 1px solid var(--paper-dark); border-bottom: none; border-radius: 4px 4px 0 0; background: rgba(255, 252, 240, 0.4); padding: 4px 10px; font: 13px Georgia, serif; cursor: pointer; }
.settings-tabs button.active { background: #fffaf0; font-weight: bold; }
.settings-pane[hidden] { display: none; }
.alert-speeds { border-collapse: collapse; width: 100%; font-size: 13px; }
.alert-speeds td { padding: 2px 4px; border-bottom: 1px dotted var(--paper-dark); }
.alert-speeds tr.group th { text-align: left; padding: 8px 4px 2px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
.alert-speeds select { font: 12.5px Georgia, serif; }
.settings input[type="range"] { vertical-align: middle; width: 180px; }
.report .dev-truth { margin: 4px 0 0; font-size: 11.5px; color: #8a1468; border-left: 2px solid #c0178f; padding-left: 6px; }

/* ---------- the unit sheet: where it stands, its grip, its command bar and its sections ---------- */
#table.sheet-left .unit-panel { right: auto; left: 0; border-left: none; border-right: 3px solid #1b150e; box-shadow: 6px 0 18px rgba(0, 0, 0, 0.28); }
#table.sheet-bottom .unit-panel {
  top: auto; left: 0; right: 0; width: auto; height: min(var(--sheet-h, 300px), 80%);
  border-left: none; border-top: 3px solid #1b150e; box-shadow: 0 -6px 18px rgba(0, 0, 0, 0.28);
}
/* At the bottom, the sections of the Commandes tab stand side by side. */
#table.sheet-bottom #unit-keyed { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 0 22px; align-items: start; }
#table.sheet-bottom #unit-keyed > p.hint { grid-column: 1 / -1; }
.sheet-grip { position: absolute; top: 0; bottom: 0; left: -5px; width: 9px; cursor: ew-resize; z-index: 4; }
#table.sheet-left .sheet-grip { left: auto; right: -5px; }
#table.sheet-bottom .sheet-grip { top: -5px; bottom: auto; left: 0; right: 0; width: auto; height: 9px; cursor: ns-resize; }
.sheet-grip:hover { background: rgba(43, 36, 26, 0.18); }

.unit-bar { padding: 4px 8px 6px; border-bottom: 1px solid var(--paper-dark); background: rgba(255, 252, 240, 0.35); }
.unit-bar[hidden] { display: none; }
.cmd-bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: flex-end; }
.cmd-group { display: flex; flex-direction: column; gap: 2px; }
.cmd-caption { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
.cmd-row { display: flex; gap: 3px; align-items: center; }
button.cmd {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-width: 50px; height: 46px; padding: 3px 4px; cursor: pointer;
  background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 4px; font: 10.5px Georgia, serif; line-height: 1.1;
}
button.cmd svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
button.cmd span { white-space: nowrap; }
button.cmd:hover:not([disabled]):not(.active) { background: #fffaf0; }
button.cmd.active { background: var(--raf-blue); color: #fff; border-color: var(--raf-blue); }
button.cmd.danger { color: var(--raf-red); border-color: var(--raf-red); }
button.cmd[disabled] { opacity: 0.4; cursor: default; }
button.cmd.small { min-width: 30px; height: 30px; flex-direction: row; gap: 3px; padding: 2px 6px; }
button.cmd.small svg { width: 17px; height: 17px; }
.cmd-group.alt .alt-value { min-width: 62px; text-align: center; font: bold 13px "Courier New", Courier, monospace; }
.cmd-group.speed input[type="range"] { width: 104px; }
.cmd-group.speed input[type="range"].off { opacity: 0.45; }
.cmd-group.speed .speed-value { min-width: 44px; font: bold 12.5px "Courier New", Courier, monospace; }
.cmd-group.speed .speed-text { font-size: 11px; color: var(--ink-soft); font-family: "Courier New", Courier, monospace; }

details.sec { border-top: 1px dotted var(--paper-dark); padding: 2px 0; }
details.sec > summary {
  cursor: pointer; list-style: none; padding: 5px 0 3px; font-weight: bold; font-size: 12.5px; color: var(--ink);
  display: flex; align-items: center; gap: 6px;
}
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: '▸'; color: var(--ink-soft); font-size: 11px; width: 10px; }
details.sec[open] > summary::before { content: '▾'; }
details.sec > .sec-body { padding: 0 0 6px 2px; }
.profile-slot canvas { display: block; margin: 4px 0; }

/* The Effectifs page: aerodromes on the left, their squadrons and plans on the right. */
.roster-page .rp-columns { display: grid; grid-template-columns: minmax(180px, 230px) 1fr; gap: 14px; }
.roster-page .rp-col { border: 1px solid var(--paper-dark); border-radius: 4px; padding: 6px 8px; background: rgba(255, 252, 240, 0.55); max-height: 62vh; overflow-y: auto; }
.roster-page .rp-list { list-style: none; margin: 0; padding: 0; }
.roster-page .rp-field { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 1px; margin: 2px 0; padding: 4px 8px; cursor: pointer;
  background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 3px; font: 13px Georgia, serif; }
.roster-page .rp-field small { color: var(--ink-soft); font-size: 11.5px; }
.roster-page .rp-field.active { background: var(--raf-blue); color: #fff; border-color: var(--raf-blue); }
.roster-page .rp-field.active small { color: #dfe7f3; }
.roster-page .roster-squadron { border-bottom: 1px dotted var(--paper-dark); padding: 6px 0 8px; }
.roster-page .roster-squadron.focus { background: rgba(255, 238, 190, 0.45); }
@media (max-width: 820px) { .roster-page .rp-columns { grid-template-columns: 1fr; } }
.roster-page .sub { font-size: 12px; color: var(--ink-soft); margin: 8px 0 3px; }
.roster-page label.check { font-size: 13px; }

/* The main menu, over the map. */
dialog.menu-dialog { padding: 0; border: 3px solid #1b150e; border-radius: 6px; background: var(--paper); width: min(560px, 94vw); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
dialog.menu-dialog::backdrop { background: rgba(27, 21, 14, 0.62); }
.main-menu { padding: 0 0 14px; }
.main-menu .mm-title { background: #2b241a; color: #f2e9d2; padding: 18px 24px 14px; border-bottom: 3px solid var(--brass); }
.main-menu .mm-title h1 { margin: 0; font: bold 26px Georgia, serif; letter-spacing: 0.02em; }
.main-menu .mm-title p { margin: 2px 0 0; font-style: italic; color: #d9c9a3; }
.main-menu .mm-buttons { display: flex; flex-direction: column; gap: 8px; padding: 16px 24px 4px; }
.main-menu .mm-buttons > button, .main-menu .mm-file {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; cursor: pointer;
  background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 4px; padding: 9px 14px; font: bold 16px Georgia, serif;
}
.main-menu .mm-buttons small { font: normal 12.5px Georgia, serif; color: var(--ink-soft); }
.main-menu .mm-buttons > button:hover, .main-menu .mm-file:hover { background: #fffaf0; }
.main-menu .mm-buttons > .mm-main { background: var(--raf-blue); color: #fff; border-color: var(--raf-blue); }
.main-menu .mm-buttons > .mm-main small { color: #dfe7f3; }
.main-menu .mm-row { display: flex; gap: 8px; }
.main-menu .mm-row button { flex: 1 1 0; background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 4px; padding: 7px 12px; font: 14px Georgia, serif; cursor: pointer; }
.main-menu .mm-note { margin: 10px 24px 0; }
.main-menu .message { margin: 6px 24px 0; }

/* The help, in tabs, with pictures from the test bench. */
.help-page .help-pane[hidden] { display: none; }
.help-page .help-pane ol { padding-left: 20px; }
.help-page .help-pane li { margin: 0 0 8px; }
.help-image { margin: 4px 0 10px; text-align: center; }
.help-image img { max-width: 100%; border: 1px solid var(--paper-dark); border-radius: 3px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2); }
.help-image figcaption { font-size: 12px; color: var(--ink-soft); font-style: italic; margin-top: 3px; }

/* The guard of the frame loop (crash.js). */
#dlg-crash { max-width: 560px; }
.crash-detail { font-size: 12px; line-height: 1.5; padding: 8px 10px; border: 1px solid var(--line, #b9ab8a); border-radius: 4px; overflow-wrap: anywhere; }
.crash-detail code { font-family: ui-monospace, Menlo, Consolas, monospace; }
.dialog-note:empty { display: none; }
.dialog-note { font-size: 13px; font-style: italic; }

/* ---- Watch reports: the « Signaux » tab of the journal and the page of a relief ---- */
.log-section h2.with-tabs > span[data-log-section] { cursor: pointer; user-select: none; }
.tabs .badge { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--raf-red); color: #fff; font-size: 10px; font-weight: bold; text-align: center; }
.tabs .badge[hidden] { display: none; }
.log-section.collapsed #signals { display: none; }
.signals { font-size: 12px; }
.signal-filters { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
.signal-filters button { font-size: 11px; padding: 1px 6px; background: transparent; color: var(--ink-soft); border: 1px solid var(--paper-dark); border-radius: 3px; }
.signal-filters button.active { background: var(--raf-blue); color: #fff; border-color: var(--raf-blue); }
.signal-filters select { font-size: 11px; max-width: 150px; }
.signal-tools { margin: 2px 0; text-align: right; }
.signals-list .log-day { cursor: default; }
.watch-lines { list-style: none; margin: 0; padding: 0; }
.watch-line { border-bottom: 1px dotted var(--paper-dark); }
.watch-head { cursor: pointer; padding: 3px 0 3px 2px; }
.watch-head:hover { background: rgba(0, 0, 0, 0.04); }
.watch-head .fold { display: inline-block; font-size: 10px; transform: rotate(-90deg); transition: transform 0.15s; margin-right: 3px; }
.watch-line.open > .watch-head .fold { transform: none; }
.watch-head .when { font-family: "Courier New", Courier, monospace; font-weight: bold; color: var(--ink-soft); margin-right: 4px; }
.watch-line.unread > .watch-head { font-weight: bold; }
.watch-line.unread > .watch-head::after { content: "●"; color: var(--raf-blue); font-size: 9px; margin-left: 5px; vertical-align: 1px; }
.watch-line.attack > .watch-head { color: #8c1d16; }
.watch-line.stopped > .watch-head .when { color: var(--ink); text-decoration: underline; }
.watch-body { padding: 2px 4px 8px 12px; }
.watch-body h4 { margin: 8px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
.watch-body h4.decide { color: #8c1d16; }
.watch-body p { margin: 2px 0; }
.watch-body ul.rows, .watch-body ul.decisions { list-style: none; margin: 0; padding: 0; }
.watch-body ul.rows li { padding: 2px 0; }
.watch-body ul.rows li.hit { color: #8c1d16; }
.watch-body .decision { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 4px 6px; margin: 3px 0; background: #f6e3b8; border: 1px solid #d9b56a; border-radius: 3px; }
.watch-body .decision.settled { background: transparent; border-color: var(--paper-dark); color: var(--ink-soft); }
.watch-body .decision .grow { flex: 1 1 200px; }
.watch-body .decision-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
.watch-body .decision-buttons button { font-size: 12px; padding: 2px 8px; }
.watch-body .watch-signals li { padding: 2px 0; }
.watch-page .watch-why { margin: 4px 0 8px; padding: 6px 8px; background: #f6e3b8; border: 1px solid #d9b56a; border-radius: 3px; }
.watch-page .watch-body { padding: 0; font-size: 14px; }
.watch-page .page-head .when { color: var(--ink-soft); font-size: 13px; }
dialog#dlg-watch { width: 760px; }

/* ---- Radio silence: the comms block of a ship's sheet ---- */
.comms .pending-orders { list-style: none; margin: 2px 0 6px; padding: 0; }
.comms .pending-orders li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 3px 0; border-bottom: 1px dotted var(--paper-dark); }
.comms .pending-orders .grow { flex: 1 1 140px; }
.comms .pending-orders small { color: var(--ink-soft); }
.comms .hint.warn { color: #8a3b1c; font-style: normal; }

/* ---- main menu: a full page, outside the map (M2.9) ---- */
.menu-page { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: #2b241a; color: var(--ink); display: flex; justify-content: center; padding: 28px 16px; }
.menu-page[hidden] { display: none; }
body.on-menu #app { visibility: hidden; }
.mm-page { width: min(760px, 100%); background: var(--paper); border: 3px solid #1b150e; border-radius: 6px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); align-self: flex-start; }
.mm-page.mm-scenarios, .mm-page.mm-load, .mm-page.mm-campaign { width: min(900px, 100%); }
.mm-page .mm-title { background: #2b241a; color: #f2e9d2; padding: 20px 28px 16px; border-bottom: 3px solid var(--brass); }
.mm-page .mm-title h1 { margin: 0; font: bold 30px Georgia, serif; letter-spacing: 0.02em; }
.mm-page .mm-title p { margin: 2px 0 0; font-style: italic; color: #d9c9a3; }
.mm-body { padding: 18px 28px 8px; }
.mm-body h2 { margin: 4px 0 6px; font: bold 20px Georgia, serif; }
.mm-back { display: inline-block; margin: 0 0 8px; padding: 2px 0; font: 14px Georgia, serif; }
.mm-list { display: flex; flex-direction: column; gap: 8px; }
.mm-entry { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 4px; padding: 10px 14px; font: 17px Georgia, serif; cursor: pointer; }
.mm-entry small { font: normal 13px Georgia, serif; color: var(--ink-soft); }
.mm-entry:hover { background: #fffaf0; }
.mm-entry.mm-main, .gm-buttons .mm-main { background: var(--raf-blue); color: #fff; border-color: var(--raf-blue); }
.mm-entry.mm-main small { color: #dfe7f3; }
.mm-row { display: flex; gap: 8px; margin-top: 10px; }
.mm-row > button, .mm-row > .file-button { flex: 1 1 0; text-align: center; background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 4px; padding: 8px 12px; font: 14px Georgia, serif; cursor: pointer; }
.mm-note { margin: 12px 0 0; }
.mm-preset { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; font: 14px Georgia, serif; }
.mm-preset button { background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 4px; padding: 5px 12px; font: 14px Georgia, serif; cursor: pointer; }
.mm-preset button.active { background: var(--raf-blue); color: #fff; border-color: var(--raf-blue); }
.mm-preset-text { margin: 0 0 8px; }
.mm-body .message { margin: 10px 0 0; }
.mm-foot { padding: 6px 28px 12px; text-align: right; font: italic 12px Georgia, serif; color: var(--ink-soft); }
.mm-chain, .mm-cards, .mm-saves { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mm-step, .mm-save { display: flex; align-items: center; gap: 12px; background: #f7f0dc; border: 1px solid #b9a67e; border-radius: 4px; padding: 9px 12px; }
.mm-step.locked, .mm-card.locked { opacity: 0.6; }
.mm-num { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: #2b241a; color: #f2e9d2; display: flex; align-items: center; justify-content: center; font: bold 15px Georgia, serif; }
.mm-step.won .mm-num { background: #2f6b3a; }
.mm-step-body, .mm-save-body { flex: 1 1 auto; min-width: 0; }
.mm-step-body p, .mm-save-body p { margin: 2px 0 0; font-size: 13.5px; }
.mm-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 10px; }
.mm-card { background: #f7f0dc; border: 1px solid #b9a67e; border-radius: 4px; padding: 10px 14px; display: flex; flex-direction: column; }
.mm-card h3 { margin: 0; font: bold 17px Georgia, serif; }
.mm-card p { margin: 4px 0 0; font-size: 13.5px; }
.mm-card .mm-dates { color: var(--ink-soft); font-style: italic; }
.mm-card .mm-stake { font-weight: bold; }
.mm-card .mm-text { flex: 1 1 auto; }
.mm-card-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.mm-save-buttons { display: flex; gap: 6px; flex: 0 0 auto; }
.mm-save.current { border-color: var(--raf-blue); }
.badge.current { background: var(--raf-blue); color: #fff; }
.badge.auto { background: #e7dcc0; }
.badge.manual { background: #d8e6d0; }
/* ---- the ☰ menu of a game, the confirmations ---- */
dialog.menu-dialog { width: min(380px, 94vw); }
.game-menu { padding: 16px 22px 14px; }
.game-menu h2 { margin: 0 0 2px; font: bold 19px Georgia, serif; }
.gm-buttons { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.gm-buttons button { text-align: left; background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 4px; padding: 8px 12px; font: 15px Georgia, serif; cursor: pointer; }
.gm-buttons button:hover:not(:disabled) { background: #fffaf0; }
.gm-buttons .mm-main:hover { background: var(--raf-blue); filter: brightness(1.08); }
.game-menu .message { margin: 10px 0 0; }
dialog.confirm-dialog { width: min(460px, 94vw); }
.confirm h2 { margin-top: 0; }
button.danger { background: #8b1a1a; color: #fff; border-color: #8b1a1a; }
.menu-button { font-size: 17px; line-height: 1; padding: 3px 9px; }
.save-problem { background: #8b1a1a; color: #fff; border-color: #8b1a1a; }
.settings-scope { margin: 0 0 8px; }
.end-preset { font-style: italic; color: var(--ink-soft); margin: 6px 0 0; }
.mm-page .badge { display: inline-block; font: normal 11px Georgia, serif; padding: 1px 7px; border-radius: 8px; margin-left: 6px; background: var(--paper-dark); color: var(--ink-soft); vertical-align: middle; }
.mm-page .badge.won { background: var(--green); color: #fff; }
.mm-page .badge.open, .mm-page .badge.current { background: var(--raf-blue); color: #fff; }
.mm-body .check { display: block; margin-top: 8px; }
</style>
</head>
<body>
  <div id="menu" class="menu-page" hidden></div>
  <div id="app">
    <header id="hud">
      <div class="hud-title">
        <strong data-i18n="app.title"></strong>
        <span id="hud-subtitle" data-i18n="app.subtitle"></span>
        <span id="dev-badge" class="dev-badge" data-i18n="dev.badge" data-i18n-title="dev.badgeTitle" hidden></span>
      </div>
      <canvas id="clock" aria-hidden="true"></canvas>
      <div class="hud-date"><div id="date"></div><div id="time"></div></div>
      <div class="hud-group speed-group">
        <button type="button" id="btn-pause"></button>
        <div id="speeds" class="speeds" data-i18n-title="hud.speedTitle"></div>
        <div id="speed-confirm" class="speed-confirm" hidden role="alertdialog"></div>
      </div>
      <!-- The tools: a pictogram each, its name and its key in the tooltip, a short word under
           it when there is room (hud.js fills them). -->
      <div class="hud-group tools" id="hud-tools">
        <span class="hud-pop">
          <button type="button" id="btn-view" class="tool" aria-haspopup="true" aria-expanded="false"></button>
          <span id="view-menu" class="pop-menu" role="menu" hidden></span>
        </span>
        <button type="button" id="btn-ruler" class="tool"></button>
        <button type="button" id="btn-radar" class="tool"></button>
        <button type="button" id="btn-formations" class="tool"></button>
        <button type="button" id="btn-roster" class="tool"></button>
