<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table de traçage</title>
  <link rel="icon" href="data:,">
  <style>
/* Plotting table, 1940: dark wood around the map, paper cards, typewritten plaques. */

:root {
  --wood: #2e261c;
  --wood-light: #4a3c2a;
  --brass: #b8902f;
  --paper: #ede3c8;
  --paper-dark: #ddd0ae;
  --ink: #2b241a;
  --ink-soft: #5d513e;
  --raf-blue: #2c4a7c;
  --raf-red: #a8322d;
  --green: #2e6b3a;
  --amber: #b07a12;
  --panel-width: 340px;
  font-family: Georgia, "Times New Roman", serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--wood);
  color: var(--ink);
}

#app {
  display: grid;
  grid-template-rows: auto 1fr;
  grid-template-columns: 1fr var(--panel-width);
  height: 100vh;
  height: 100dvh;
}

/* ---------- top bar ---------- */

#hud {
  grid-column: 1 / 3;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  padding: 6px 12px;
  background: linear-gradient(#3a2f22, var(--wood));
  color: var(--paper);
  border-bottom: 3px solid #1b150e;
}

.hud-title { display: flex; flex-direction: column; line-height: 1.1; min-width: 150px; }
.hud-title strong { font-size: 15px; letter-spacing: 0.04em; }
.hud-title span { font-size: 12px; opacity: 0.75; font-style: italic; }

#clock { width: 46px; height: 46px; }

.hud-date { line-height: 1.15; min-width: 170px; }
#date { font-size: 13px; }
#time { font: bold 20px "Courier New", Courier, monospace; letter-spacing: 0.05em; }

.hud-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.speeds { display: flex; gap: 2px; }
.speed-group { position: relative; }
.speed-confirm {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: max-content; max-width: 420px;
  background: #6b4a12; color: #fff3e0; border: 2px solid #e8c27a; border-radius: 4px;
  padding: 6px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}
.speed-confirm[hidden] { display: none; }
.speed-confirm span { flex: 1 1 100%; }
#hud .speed-confirm button { background: #fff3e0; color: #6b4a12; border: none; font-weight: bold; }
#hud .speed-confirm button[data-confirm='no'] { background: transparent; color: #fff3e0; border: 1px solid #e8c27a; }

button {
  font: 13px Georgia, "Times New Roman", serif;
  cursor: pointer;
}

#hud button {
  background: var(--wood-light);
  color: #f2e9d2;
  border: 1px solid #8a7350;
  border-radius: 3px;
  padding: 4px 8px;
}
#hud button:hover { background: #5c4b34; }
#hud button.active { background: var(--brass); color: #1c160e; border-color: #e0c27a; }
.speeds button { font-family: "Courier New", Courier, monospace !important; padding: 4px 6px !important; }

.only-small { display: none !important; }

/* Laptop widths: the top bar stays on one line. */
@media (max-width: 1700px) {
  #hud { gap: 6px 10px; padding: 5px 10px; }
  .hud-title { min-width: 0; }
  .hud-title strong { font-size: 14px; }
  .hud-title span { font-size: 11px; }
  .hud-date { min-width: 148px; }
  #date { font-size: 12px; }
  #hud button { padding: 3px 6px; font-size: 12.5px; }
  .speeds button { padding: 3px 4px !important; }
}

/* ---------- map ---------- */

#table { position: relative; grid-row: 2; grid-column: 1; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }

.loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--paper); font-size: 16px; padding: 20px; text-align: center;
}
.loading.error { color: var(--raf-red); }
.loading[hidden] { display: none; }
.spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 4px solid var(--paper-dark); border-top-color: var(--raf-blue);
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.alert {
  position: absolute; top: 46px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px;
  max-width: calc(100% - 24px);
  background: #7c1f18; color: #fff3e0;
  border: 2px solid #f0b8a0; border-radius: 4px;
  padding: 8px 12px; font-size: 14px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  z-index: 5;
}
.alert[hidden] { display: none; }
.alert strong { letter-spacing: 0.12em; white-space: nowrap; }
#alert-text { flex: 1 1 auto; min-width: 0; }
.alert-buttons { display: flex; gap: 6px; white-space: nowrap; }
.alert button {
  background: #fff3e0; color: #7c1f18; border: none; border-radius: 3px; padding: 3px 10px; font-weight: bold;
}
.alert button.close { background: transparent; color: #fff3e0; font-size: 18px; padding: 0 4px; }
.alert.flash { animation: flash 0.5s ease-in-out 4; }
@keyframes flash { 50% { background: #b5291e; } }
.alert-more { font-size: 12px; opacity: 0.85; white-space: nowrap; }
.alert button[hidden] { display: none; }
/* A decision to take (escort, fuel, a convoy waiting): amber, no flashing red. */
.alert[data-level='warning'] { background: #6b4a12; border-color: #e8c27a; }
.alert[data-level='warning'] button:not(.close) { color: #6b4a12; }
.alert[data-level='warning'].flash { animation: flash-warning 0.5s ease-in-out 3; }
@keyframes flash-warning { 50% { background: #94661a; } }

/* ---------- developer mode ---------- */

.dev-badge {
  align-self: flex-start; display: inline-block; margin-top: 2px; padding: 0 6px; border-radius: 3px;
  background: #c0178f; color: #fff; font: bold 11px "Courier New", Courier, monospace; letter-spacing: 0.1em;
}
.dev-badge[hidden] { display: none; }
.tabs .dev-tab { color: #c0178f; }
.tabs .dev-tab[hidden] { display: none; }
.tote-row.dev-row { display: flex; align-items: center; gap: 6px; cursor: default; }
.dev-row .name { flex: 1 1 auto; min-width: 0; white-space: normal; font-weight: normal; font-size: 11.5px; color: #8a1468; }
.dev-row.active .name { font-weight: bold; }
.dev-row:not(.active) .name { opacity: 0.75; }
.dev-row button { flex: none; font-size: 11px; padding: 1px 6px; }

/* ---------- tutorial ---------- */

.coach {
  position: absolute; left: 12px; bottom: 12px; z-index: 4;
  width: min(360px, calc(100% - 24px));
  background: var(--paper); color: var(--ink);
  border: 2px solid var(--brass); border-radius: 4px;
  padding: 10px 12px; font-size: 13.5px; line-height: 1.4;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}
.coach[hidden] { display: none; }
.coach-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.coach-head small { color: var(--ink-soft); white-space: nowrap; }
.coach p { margin: 6px 0 8px; }
.coach-buttons { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.coach-buttons button:not(.link) {
  margin-left: auto; background: var(--raf-blue); color: #fff; border: none; border-radius: 3px; padding: 4px 12px; font: inherit;
}
.coach-wait { margin-left: auto; color: var(--ink-soft); font-style: italic; }

/* ---------- campaign, purchases ---------- */

.scenarios .badge { font-size: 11px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; background: var(--paper-dark); color: var(--ink-soft); }
.scenarios .badge.won { background: var(--green); color: #fff; }
.scenarios .badge.open { background: var(--raf-blue); color: #fff; }
.scenarios li.locked p, .scenarios li.locked b { color: var(--ink-soft); }
.scenario-buttons { display: flex; gap: 8px; }
.unlocked { color: var(--green); font-weight: bold; }
.currency { padding: 4px 8px 8px; font-size: 13px; }
.currency p { margin: 4px 0; }
.currency .order-line { flex-wrap: wrap; }
.currency button {
  background: var(--paper); border: 1px solid var(--ink-soft); border-radius: 3px; padding: 2px 8px; font: inherit; color: var(--ink);
}
.currency button.active { background: var(--raf-blue); color: #fff; border-color: var(--raf-blue); }
.currency button:disabled { opacity: 0.55; }
.currency .offer { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.currency .offer .grow { flex: 1 1 auto; }
.currency .offer small { color: var(--ink-soft); }
.currency .offer button { white-space: nowrap; }
.next-sailings { margin: 2px 0 6px; padding-left: 18px; }

/* ---------- side panel ---------- */

#panel {
  grid-row: 2; grid-column: 2;
  overflow-y: auto;
  background: var(--paper);
  border-left: 4px solid #1b150e;
  padding: 6px 10px 20px;
  font-size: 13px;
}

#panel section { margin-bottom: 10px; }
#panel h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--ink-soft); border-bottom: 1px solid var(--paper-dark);
  margin: 8px 0 6px; padding-bottom: 3px;
}

.objectives { list-style: none; margin: 0; padding: 0; }
.objectives li { display: flex; gap: 6px; padding: 2px 0; }
.objectives .tick { width: 14px; color: var(--ink-soft); font-weight: bold; }
.objectives li.done { color: var(--green); }
.objectives li.done .tick { color: var(--green); }

.tote-group { font-size: 11px; color: var(--ink-soft); margin: 6px 0 2px; font-style: italic; }
.tote-row {
  display: grid; grid-template-columns: 12px 64px 1fr auto; gap: 6px; align-items: center;
  padding: 3px 4px; border-radius: 3px; cursor: pointer;
  font-family: "Courier New", Courier, monospace; font-size: 12px;
}
.tote-row:hover { background: var(--paper-dark); }
.tote-row.sel { background: #e2cfa0; outline: 1px solid var(--brass); }
.tote-row .name { font-weight: bold; }
.tote-row .extra { color: var(--ink-soft); text-align: right; }
.tote-empty { color: var(--ink-soft); font-style: italic; padding: 2px 4px; }

.lamp { width: 10px; height: 10px; border-radius: 50%; background: #9c927d; border: 1px solid rgba(0, 0, 0, 0.35); }
.lamp.sq-ready { background: var(--green); }
.lamp.sq-scrambling { background: var(--amber); }
.lamp.sq-airborne { background: var(--raf-blue); }
.lamp.sq-combat { background: var(--raf-red); }
.lamp.sq-returning { background: #6b7fa3; }
.lamp.sq-refuelling { background: #c9b98f; }
.lamp.sq-lost { background: #000; }
.lamp.convoy-inPort, .lamp.convoy-waiting { background: var(--amber); }
.lamp.convoy-atSea { background: var(--raf-blue); }
.lamp.convoy-arrived { background: var(--green); }
.lamp.raid { background: var(--raf-red); border-radius: 1px; }
.lamp.convoy-lost { background: #000; }
.lamp.site-intact { background: var(--green); }
.lamp.site-damaged { background: var(--amber); }
.lamp.site-out { background: var(--raf-red); }
.tote { max-height: 36vh; overflow-y: auto; }
.tote-row.site { grid-template-columns: 12px 118px 1fr auto; }
.status-intact { color: var(--green); }
.status-damaged { color: var(--amber); }
.status-out { color: var(--raf-red); }

#panel h2.with-tabs { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 4px 8px; }
.tabs { display: flex; gap: 2px; text-transform: none; letter-spacing: 0; }
.tabs button {
  font-size: 12px; padding: 2px 8px; background: transparent; color: var(--ink-soft);
  border: 1px solid var(--paper-dark); border-bottom: none; border-radius: 3px 3px 0 0;
}
.tabs button.active { background: var(--paper-dark); color: var(--ink); font-weight: bold; }

.profile { display: block; width: 100%; height: 140px; margin: 8px 0 2px; border: 1px solid var(--paper-dark); border-radius: 3px; }
.profile[hidden] { display: none; }
.plan .sub { font-size: 12px; color: var(--ink-soft); margin: 8px 0 3px; }
.legs { margin: 0; padding-left: 20px; font-size: 12px; }
.legs li { padding: 2px 0; border-bottom: 1px dotted var(--paper-dark); }
.legs li .leg-text { font-family: "Courier New", Courier, monospace; font-weight: bold; }
.legs li .leg-status { color: var(--ink-soft); font-style: italic; margin-left: 4px; }
.legs li.current .leg-text { color: var(--raf-blue); }
.orders button.icon, .legs button.icon { padding: 0 6px; margin-left: 4px; font-size: 13px; line-height: 16px; background: transparent; border: 1px solid #b9a77f; border-radius: 3px; }
.message { margin: 4px 0; padding: 4px 6px; border-radius: 3px; font-size: 12px; }
.message.warning { background: #f6e3b8; color: #6b4408; border: 1px solid #d9b56a; }
.leg-form { border-top: 1px solid var(--paper-dark); padding-top: 4px; margin-top: 2px; }
.leg-form .sub { font-size: 12px; color: var(--ink-soft); margin: 2px 0 4px; }
.leg-form label { display: flex; align-items: center; gap: 4px; color: var(--ink-soft); }
.leg-form label.grow { flex: 1 1 120px; }
.leg-form label.grow input { flex: 1; min-width: 70px; }
.orders input[type="text"] { font: 14px "Courier New", Courier, monospace; padding: 3px; }
.leg-form input[type="number"] { width: 58px; }
.order-line .alt-value { font: bold 15px "Courier New", Courier, monospace; min-width: 84px; text-align: center; }
.report-line { font-size: 12px; background: #efe4c4; border-left: 3px solid #6e4d8f; padding: 4px 6px; margin: 6px 0 2px; }
.attacks { margin: 2px 0; padding-left: 18px; font-size: 12px; }
.log .log-report { color: #3f2a5c; background: #efe4c4; }
.objectives li.failed { color: var(--raf-red); }
.lamp.escort-inPort, .lamp.escort-refit { background: #9aa6b1; }
.lamp.escort-atSea, .lamp.escort-waiting { background: #4f6070; }
.lamp.escort-escorting { background: var(--green); }
.lamp.stock-ok { background: var(--green); }
.lamp.stock-mid { background: var(--amber); }
.lamp.stock-low { background: var(--raf-red); }
.lamp.stock-none { background: #9c927d; }
.lamp.train-fuel { background: #c47a1d; border-radius: 1px; }
.lamp.train-materiel { background: #6a6a74; border-radius: 1px; }
.lamp.train-mixed { background: linear-gradient(90deg, #c47a1d 50%, #6a6a74 50%); border-radius: 1px; }
.lamp.train-ammo { background: #7a4a2a; border-radius: 1px; }
.tote-row.stock { grid-template-columns: 12px 96px 1fr auto; }
.leg-form select { font: 13px Georgia, serif; max-width: 100%; }
.leg-form label.grow select { flex: 1; min-width: 120px; }
.verdict.won { color: var(--green); }
.verdict.lost { color: var(--raf-red); }
dialog h3 { font-size: 14px; margin: 10px 0 4px; }
.end-objectives { list-style: none; padding-left: 4px; }
.end-objectives li.done { color: var(--green); }
.end-objectives li.failed { color: var(--raf-red); }
.scenarios { list-style: none; padding: 0; }
.scenarios li { border: 1px solid var(--paper-dark); border-radius: 4px; padding: 8px 10px; margin: 8px 0; }
.scenarios li.current { border-color: var(--brass); background: #efe4c4; }
.scenarios li p { margin: 4px 0 6px; font-size: 13px; }
.scenarios button { background: var(--raf-blue); color: #fff; border: none; border-radius: 3px; padding: 4px 12px; }
.log .log-logistics { color: #5a4a2a; }
.log .log-day { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); background: var(--paper-dark); padding: 2px 4px; margin-top: 4px; }

.sheet h3 { margin: 2px 0 6px; font-size: 15px; }
.sheet h3 small { font-weight: normal; font-style: italic; color: var(--ink-soft); font-size: 12px; }
.sheet .sub { font-size: 12px; color: var(--ink-soft); margin: 4px 0; }
.kv { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; border-bottom: 1px dotted var(--paper-dark); }
.kv span { color: var(--ink-soft); }
.kv b { font-family: "Courier New", Courier, monospace; text-align: right; }

.orders { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.order-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.order-line > span { min-width: 92px; color: var(--ink-soft); }
.orders button {
  background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 3px; padding: 5px 9px;
}
.orders button:hover:not([disabled]):not(.active) { background: #fffaf0; }
.orders button.active { background: var(--raf-blue); color: #fff; border-color: var(--raf-blue); }
.orders button[disabled] { opacity: 0.45; cursor: default; }
.orders input[type="number"] { width: 64px; font: 14px "Courier New", Courier, monospace; padding: 3px; }
.hint { color: var(--ink-soft); font-style: italic; font-size: 12px; margin: 4px 0; }

.log { list-style: none; margin: 0; padding: 0; font-size: 12px; }
.log li { padding: 3px 0; border-bottom: 1px dotted var(--paper-dark); }
.log time { font-family: "Courier New", Courier, monospace; font-weight: bold; color: var(--ink-soft); margin-right: 4px; }
.log .log-alert { color: #8c1d16; font-weight: bold; }
.log .log-warning { color: #8a5a0b; }
.log .log-success { color: var(--green); }
.log .log-combat { color: #4a2a6e; }

/* ---------- dialogs ---------- */

dialog {
  border: 3px solid var(--wood); border-radius: 6px;
  background: var(--paper); color: var(--ink);
  max-width: min(560px, 94vw); padding: 16px 20px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
}
dialog::backdrop { background: rgba(20, 15, 10, 0.55); }
dialog h2 { margin-top: 0; font-size: 18px; }
dialog ol, dialog ul { padding-left: 20px; line-height: 1.45; }
dialog .keys { font-size: 12px; color: var(--ink-soft); }
.dialog-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.dialog-buttons button {
  background: var(--raf-blue); color: #fff; border: none; border-radius: 3px; padding: 6px 14px;
}
.settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0; }
.settings label.check { justify-content: flex-start; }
.settings fieldset { border: 1px solid var(--paper-dark); border-radius: 4px; margin: 10px 0; }
.settings select { font: 13px Georgia, serif; max-width: 60%; }

/* ---------- small screens: the panel becomes a drawer ---------- */

@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; }
  #hud { gap: 6px 8px; padding: 4px 8px; }
  .hud-title { display: none; }
  .hud-date { min-width: 0; }
  #date { font-size: 11px; }
  #time { font-size: 16px; }
  #clock { width: 36px; height: 36px; }
  .only-small { display: inline-block !important; }
  #hud button { font-size: 12px; padding: 3px 6px !important; }
  .speeds button { padding: 3px 4px !important; }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; height: 52vh; z-index: 10;
    border-left: none; border-top: 4px solid #1b150e;
    transform: translateY(100%); transition: transform 0.2s ease-out;
  }
  #panel.open { transform: none; }
}

/* Route editing and leg changes */
.point-block { border: 1px solid var(--paper-dark); background: rgba(255, 252, 240, 0.6); border-radius: 4px; padding: 3px 6px 4px; margin: 4px 0 6px; }
.point-block .sub { margin: 0 0 3px; font-weight: bold; color: var(--raf-blue); }
.legs li.editing .leg-text { color: var(--raf-red, #a8322d); }
.leg-form.editing { background: rgba(168, 50, 45, 0.06); border-radius: 4px; }
.order-line label.grow { display: flex; align-items: center; gap: 4px; flex: 1 1 160px; color: var(--ink-soft); }
.order-line label.grow select { flex: 1; min-width: 140px; font: 13px Georgia, serif; }
.leg-form input#leg-alt { width: 70px; }

/* Journal: days fold under their date, the whole journal folds under its title */
.log li.log-group { border: none; padding: 0; }
.log .log-group > .log-day { cursor: pointer; user-select: none; display: block; }
.log .log-group > .log-day .count { float: right; text-transform: none; letter-spacing: 0; }
.log .fold, h2.foldable .fold { display: inline-block; transition: transform 0.15s; font-size: 10px; }
.log .log-group.collapsed > .log-day .fold { transform: rotate(-90deg); }
.log .log-group.collapsed > .log-entries { display: none; }
.log-entries { list-style: none; margin: 0; padding: 0; }
h2.foldable { cursor: pointer; user-select: none; }
.log-section.collapsed h2.foldable .fold { transform: rotate(-90deg); }
.log-section.collapsed #log { display: none; }
.log li.has-report { cursor: pointer; }
.log li.has-report:hover { text-decoration: underline dotted; }

/* Pages over the map (reports, cards) */
dialog.page-dialog { max-width: min(900px, 94vw); width: 900px; max-height: 88vh; overflow: auto; }
.page h2 { position: sticky; top: -16px; background: var(--paper); padding: 4px 0; margin: -4px 0 6px; z-index: 1; }
.report-day h3 { border-bottom: 2px solid var(--paper-dark); padding-bottom: 2px; }
.report-day h3 small { font-weight: normal; color: var(--ink-soft); margin-left: 8px; }
.report { border: 1px solid var(--paper-dark); border-left: 5px solid #9c927d; border-radius: 4px; padding: 6px 10px; margin: 8px 0; background: rgba(255, 252, 240, 0.55); font-size: 13px; }
.report.focus { box-shadow: 0 0 0 2px var(--brass); }
.report header { display: flex; gap: 10px; align-items: baseline; }
.report header .when { color: var(--ink-soft); font-family: "Courier New", Courier, monospace; }
.report header .tag { margin-left: auto; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; padding: 1px 6px; border-radius: 3px; background: var(--paper-dark); }
.report.outcome-destroyed, .report.outcome-repelled { border-left-color: var(--green); }
.report.outcome-destroyed .tag, .report.outcome-repelled .tag { background: var(--green); color: #fff; }
.report.outcome-bombed, .report.outcome-unopposed { border-left-color: var(--raf-red); }
.report.outcome-bombed .tag, .report.outcome-unopposed .tag { background: var(--raf-red); color: #fff; }
.report.outcome-ongoing { border-left-color: var(--brass); }
.report p { margin: 4px 0; }
.report .totals { font-weight: bold; }
.report table.fights { width: 100%; border-collapse: collapse; margin: 4px 0; font-size: 12px; }
.report table.fights th { text-align: left; font-weight: normal; color: var(--ink-soft); border-bottom: 1px solid var(--paper-dark); }
.report table.fights td { padding: 2px 4px; border-bottom: 1px dotted var(--paper-dark); vertical-align: top; }
.report table.fights .n { text-align: right; white-space: nowrap; }
.report table.fights tr.missed td { color: #8a5a0b; }

/* Crews */
.fatigue-fresh { color: var(--green); }
.fatigue-tired { color: #8a5a0b; font-weight: bold; }
.fatigue-exhausted { color: var(--raf-red); font-weight: bold; }
.lamp.alert-rest { box-shadow: inset 0 0 0 2px #9c927d; }
.lamp.alert-cockpit { box-shadow: 0 0 0 2px #e0c27a; }
.lamp.uboat { background: #7a1e18; border-radius: 0; clip-path: polygon(0 60%, 30% 60%, 35% 20%, 60% 20%, 65% 60%, 100% 60%, 85% 100%, 15% 100%); }

/* Technical cards */
.card-section h3 { border-bottom: 2px solid var(--paper-dark); padding-bottom: 2px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.card { border: 1px solid var(--paper-dark); border-radius: 4px; padding: 6px 10px; background: rgba(255, 252, 240, 0.55); font-size: 12.5px; }
.card.focus { box-shadow: 0 0 0 2px var(--brass); }
.card h4 { margin: 0 0 2px; font-size: 14px; }
.card .hint { margin: 2px 0 4px; }
.card-table { width: 100%; border-collapse: collapse; }
.card-table th { text-align: left; font-weight: normal; color: var(--ink-soft); padding: 1px 4px 1px 0; width: 48%; vertical-align: top; }
.card-table td { font-weight: bold; padding: 1px 0; }
button.link { background: none; border: none; padding: 0; font: inherit; color: var(--raf-blue); cursor: pointer; text-decoration: underline dotted; }
.save-buttons { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.save-buttons button, .file-button { background: var(--wood-light); color: #f2e9d2; border: 1px solid #8a7350; border-radius: 3px; padding: 4px 10px; cursor: pointer; font: 13px Georgia, serif; }

/* ---------- unit panel: the sheet of the selected unit, over the right edge of the map ---------- */

.unit-panel {
  position: absolute; top: 0; right: 0; bottom: 0; z-index: 3;
  width: min(340px, 92%);
  display: flex; flex-direction: column;
  background: var(--paper); color: var(--ink);
  border-left: 3px solid #1b150e;
  box-shadow: -6px 0 18px rgba(0, 0, 0, 0.28);
  font-size: 13px;
}
.unit-panel[hidden] { display: none; }
.unit-head { display: flex; align-items: flex-start; gap: 6px; padding: 8px 10px 0; }
.unit-head h2 { flex: 1 1 auto; margin: 0; font-size: 15px; line-height: 1.25; }
.unit-head h2 small { font-weight: normal; font-style: italic; color: var(--ink-soft); font-size: 12px; }
.unit-head-buttons { display: flex; gap: 4px; flex: none; }
.icon-button {
  width: 26px; height: 26px; padding: 0; line-height: 22px; font-size: 16px;
  background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 3px; cursor: pointer;
}
.icon-button:hover { background: #fffaf0; }
.icon-button.close { font-size: 19px; }
.unit-summary { margin: 3px 10px 6px; font-size: 12px; color: var(--ink-soft); font-family: "Courier New", Courier, monospace; }
.unit-summary:empty { display: none; }
.unit-tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--paper-dark); }
.unit-tabs[hidden] { display: none; }
.unit-tabs button {
  flex: 1 1 auto; white-space: nowrap; font: 12.5px Georgia, serif; padding: 4px 6px; cursor: pointer;
  background: transparent; color: var(--ink-soft);
  border: 1px solid var(--paper-dark); border-bottom: none; border-radius: 3px 3px 0 0;
}
.unit-tabs button.active { background: var(--paper-dark); color: var(--ink); font-weight: bold; }
.unit-body { flex: 1 1 auto; overflow-y: auto; padding: 4px 10px 16px; }
.unit-body .sub { font-size: 12px; color: var(--ink-soft); margin: 8px 0 3px; }
.unit-body .cards.one { grid-template-columns: 1fr; margin-top: 6px; }
.formation-line { border: 1px solid var(--paper-dark); border-radius: 4px; padding: 4px 6px; background: rgba(255, 252, 240, 0.6); }
.formation-line p { margin: 2px 0 4px; }
.members { list-style: none; margin: 6px 0; padding: 0; }
.members li { display: grid; grid-template-columns: 1fr auto; gap: 1px 6px; padding: 4px 0; border-bottom: 1px dotted var(--paper-dark); }
.members li.leader .member-name { color: var(--raf-blue); }
.members .member-name { font-weight: bold; }
.members .member-state { grid-column: 1; color: var(--ink-soft); font-size: 12px; }
.members .member-extra { grid-column: 1; font: 11.5px "Courier New", Courier, monospace; color: var(--ink-soft); }
.members .member-buttons { grid-column: 2; grid-row: 1 / 4; display: flex; flex-direction: column; gap: 3px; justify-content: center; }
.members button {
  background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 3px; padding: 3px 8px; cursor: pointer;
}
.members button:hover { background: #fffaf0; }

/* Formations in the tote board: one line, its members in small below. */
/* The formation's name on its own line, its state and size below. */
.tote-row.formation { grid-template-columns: 12px 1fr auto; row-gap: 0; }
.tote-row.formation .name { grid-column: 2 / 4; color: var(--raf-blue); }
.tote-row.formation .state { grid-column: 2; }
.tote-row.formation .extra { grid-column: 3; }
.tote-row.member { padding-left: 18px; font-size: 11px; opacity: 0.85; grid-template-columns: 8px 58px 1fr auto; }
.tote-row.member .lamp { width: 7px; height: 7px; }

/* The formations page: two columns, like choosing the columns of a table. */
.formations-page .fm-kinds, .formations-page .fm-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.formations-page .fm-kinds button, .formations-page .fm-chip {
  background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 14px; padding: 3px 12px; cursor: pointer; font: 13px Georgia, serif;
}
.formations-page .fm-kinds button.active, .formations-page .fm-chip.active { background: var(--raf-blue); color: #fff; border-color: var(--raf-blue); }
.formations-page .fm-chip small { opacity: 0.75; margin-left: 4px; }
.formations-page .fm-chip.new { border-style: dashed; }
.fm-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fm-col { border: 1px solid var(--paper-dark); border-radius: 4px; padding: 6px 8px; background: rgba(255, 252, 240, 0.55); min-height: 240px; }
.fm-col h3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 14px; }
.fm-col h3 select { font: 12.5px Georgia, serif; max-width: 55%; }
.fm-list, .fm-members { list-style: none; margin: 0; padding: 0; max-height: 46vh; overflow-y: auto; }
.fm-row { display: grid; grid-template-columns: auto 1fr auto; gap: 1px 8px; align-items: center; padding: 4px 2px; border-bottom: 1px dotted var(--paper-dark); }
.fm-list .fm-row { grid-template-columns: 1fr auto; }
.fm-row .fm-name { font-weight: bold; }
.fm-row .fm-meta { grid-column: 1 / 2; font-size: 11.5px; color: var(--ink-soft); }
.fm-members .fm-row .fm-meta { grid-column: 2 / 3; }
.fm-list .fm-row > button { grid-row: 1 / 3; grid-column: 2; }
.fm-members .fm-row .fm-move { grid-row: 1 / 3; grid-column: 3; display: flex; gap: 3px; }
.fm-members .fm-row .fm-star { grid-row: 1 / 3; }
.fm-row.leader .fm-name { color: var(--raf-blue); }
.fm-row.off { opacity: 0.55; }
.fm-row button {
  background: #f7f0dc; color: var(--ink); border: 1px solid #8a7350; border-radius: 3px; padding: 2px 8px; cursor: pointer; font-size: 14px;
}
.fm-row button[disabled] { opacity: 0.4; cursor: default; }
.fm-row .fm-star { border: none; background: none; font-size: 18px; color: var(--brass); padding: 0 2px; }
.fm-empty { color: var(--ink-soft); font-style: italic; padding: 6px 2px; }
.fm-label { display: flex; align-items: center; gap: 8px; margin: 2px 0 4px; }
.fm-label input { flex: 1 1 auto; font: 14px Georgia, serif; padding: 3px 6px; }
.fm-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
.fm-actions button { background: #f7f0dc; border: 1px solid #8a7350; border-radius: 3px; padding: 4px 10px; cursor: pointer; }
.fm-actions button.danger { color: var(--raf-red); border-color: var(--raf-red); }

@media (max-width: 820px) {
  .unit-panel { top: auto; left: 0; width: auto; height: 58%; border-left: none; border-top: 3px solid #1b150e; }
  .fm-columns { grid-template-columns: 1fr; }
}

/* With the unit panel open, the alert stays over the part of the map that can be seen. */
#table.with-unit .alert { left: calc((100% - min(340px, 92%)) / 2); max-width: calc(100% - min(340px, 92%) - 24px); }
@media (max-width: 820px) {
  #table.with-unit .alert { left: 50%; max-width: calc(100% - 24px); }
}


/* Questions from the squadrons: leave to engage, to pursue, to go on beyond mid-Channel. */
.question {
  position: absolute; top: 46px; left: 50%; transform: translateX(-50%); z-index: 6;
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px;
  max-width: calc(100% - 24px);
  background: #1f3557; color: #f2ecd8;
  border: 2px solid #9fb6d9; border-radius: 4px;
  padding: 8px 12px; font-size: 14px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  animation: flash-question 0.6s ease-in-out 3;
}
.question[hidden] { display: none; }
.question strong { letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
#question-text { flex: 1 1 260px; min-width: 0; }
.question-left { font: bold 13px "Courier New", Courier, monospace; color: #ffd98a; white-space: nowrap; }
.question-buttons { display: flex; gap: 6px; white-space: nowrap; }
.question button { background: #f2ecd8; color: #1f3557; border: none; border-radius: 3px; padding: 4px 10px; font-weight: bold; cursor: pointer; }
.question button.secondary { background: transparent; color: #f2ecd8; border: 1px solid #9fb6d9; font-weight: normal; }
.question-more { font-size: 12px; opacity: 0.85; white-space: nowrap; }
@keyframes flash-question { 50% { background: #2c4a7c; } }
/* With a question shown, the alert banner moves below it. */
#table.has-question .alert { top: 110px; }
#table.with-unit .question { left: calc((100% - min(340px, 92%)) / 2); max-width: calc(100% - min(340px, 92%) - 24px); }
@media (max-width: 820px) {
  #table.with-unit .question { left: 50%; max-width: calc(100% - 24px); }
}
.question button.default { outline: 2px solid #ffd98a; }

/* Alert states, duty roster, timetable, rendezvous */
.alert-line button { padding: 4px 6px; font-size: 12.5px; }
.unit-body .order-line .at { min-width: 0; color: var(--ink-soft); }
.unit-body .check { display: inline-flex; align-items: center; gap: 3px; color: var(--ink-soft); font-size: 12px; }
.unit-body .small { display: inline-flex; align-items: center; gap: 3px; color: var(--ink-soft); font-size: 12px; }
.unit-body .small input { width: 52px; }
.time-input { font: 14px "Courier New", Courier, monospace; padding: 2px 3px; width: 58px; }
.day-select { font: 12.5px Georgia, serif; min-width: 96px; max-width: 130px; }
.order-line.scheduled { background: #e6ecf5; border: 1px solid #b8c6dc; border-radius: 4px; padding: 3px 6px; }
.order-line.scheduled .grow { flex: 1 1 auto; min-width: 0; }
.roster-list { list-style: none; margin: 2px 0 4px; padding: 0; font-size: 12px; }
.roster-list li { display: flex; justify-content: space-between; align-items: center; padding: 1px 0; border-bottom: 1px dotted var(--paper-dark); }
.confirm-box { border: 1px solid #c9a24a; background: #f6e3b8; border-radius: 4px; padding: 4px 8px; }
.confirm-box p { margin: 2px 0 4px; font-size: 12.5px; }
.first-hint { border: 2px solid var(--brass); background: #fff6dc; border-radius: 4px; padding: 6px 8px; font-size: 12.5px; }
.first-hint p { margin: 0 0 6px; }
.rally-status { margin: 2px 0; font-weight: bold; color: var(--raf-blue); }
.rally-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.rally-table td { padding: 3px 2px; border-bottom: 1px dotted var(--paper-dark); vertical-align: middle; }
.rally-table td small { color: var(--ink-soft); }
.rally-table .time-input { width: 58px; }
.roster-tab .roster-squadron { border: 1px solid var(--paper-dark); border-radius: 4px; padding: 4px 6px; margin: 4px 0; background: rgba(255, 252, 240, 0.55); }
.roster-head { display: flex; justify-content: space-between; font-size: 12.5px; }
.roster-head span { color: var(--ink-soft); }
.timeline { display: flex; height: 12px; border: 1px solid #8a7350; border-radius: 2px; overflow: hidden; margin: 4px 0 0; }
.timeline .seg { display: block; height: 100%; }
.timeline-ticks { position: relative; height: 13px; font: 10px "Courier New", Courier, monospace; color: var(--ink-soft); margin-bottom: 2px; }
.timeline-ticks span { position: absolute; transform: translateX(-50%); }
.timeline-ticks span:first-child { transform: none; }
.timeline-ticks span:last-child { transform: translateX(-100%); }
.seg.alert-rest { background: #b9b2a2; }
.seg.alert-thirty { background: #9fb6d9; }
.seg.alert-available { background: #5f9b6a; }
.seg.alert-cockpit { background: #d39a3a; }
.seg.recall { background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.55) 0 3px, transparent 3px 7px); }
.legend-line { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px; color: var(--ink-soft); margin: 2px 0 4px; }
.legend { display: inline-flex; align-items: center; gap: 4px; }
.legend .seg { display: inline-block; width: 14px; height: 9px; border: 1px solid #8a7350; }
.lamp.alert-thirty { box-shadow: inset 0 0 0 2px #9fb6d9; }

/* Developer mode box in the settings */
.dev-settings .dev-password { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 2px 22px; }
.dev-settings .dev-password[hidden] { display: none; }
.dev-settings .dev-password input { font: 14px Georgia, serif; padding: 3px 5px; width: 170px; }
.dev-settings .dev-error { flex-basis: 100%; color: #8b1a1a; font-size: 12.5px; }

.timeline-override { height: 3px; margin-top: 1px; background: repeating-linear-gradient(90deg, #8b1a1a 0 6px, transparent 6px 9px); }
.roster-mode { margin: 2px 0; }
.roster-list.override li span { color: #8b1a1a; }
.offset-input { width: 48px; font: 14px "Courier New", Courier, monospace; padding: 2px 3px; }
.roster-list li.past { opacity: 0.5; }
.roster-list small { color: var(--ink-soft); font-size: 11px; }

/* Depth-charge attacks in the reports */
.report.naval { border-left: 4px solid #4f6070; }
.report.naval.outcome-sunk { border-left-color: #2e7d32; }
.report.naval.outcome-damaged { border-left-color: #c9a24a; }
.report.naval .passes { margin: 4px 0 2px 18px; padding: 0; font-size: 12.5px; }
.report.naval .passes .when { font-family: "Courier New", Courier, monospace; color: var(--ink-soft); }
.orders .order-line.hunting { background: #f6e3b8; border: 1px solid #c9a24a; border-radius: 4px; padding: 3px 6px; }

/* Settings in tabs */
.settings-tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--paper-dark); margin: 4px 0 8px; }
.settings-tabs button { border: 1px solid var(--paper-dark); border-bottom: none; border-radius: 4px 4px 0 0; background: rgba(255, 252, 240, 0.4); padding: 4px 10px; font: 13px Georgia, serif; cursor: pointer; }
.settings-tabs button.active { background: #fffaf0; font-weight: bold; }
.settings-pane[hidden] { display: none; }
.alert-speeds { border-collapse: collapse; width: 100%; font-size: 13px; }
.alert-speeds td { padding: 2px 4px; border-bottom: 1px dotted var(--paper-dark); }
.alert-speeds tr.group th { text-align: left; padding: 8px 4px 2px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
.alert-speeds select { font: 12.5px Georgia, serif; }
.settings input[type="range"] { vertical-align: middle; width: 180px; }
.report .dev-truth { margin: 4px 0 0; font-size: 11.5px; color: #8a1468; border-left: 2px solid #c0178f; padding-left: 6px; }
</style>
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-title">
        <strong data-i18n="app.title"></strong>
        <span id="hud-subtitle" data-i18n="app.subtitle"></span>
        <span id="dev-badge" class="dev-badge" data-i18n="dev.badge" data-i18n-title="dev.badgeTitle" hidden></span>
      </div>
      <canvas id="clock" aria-hidden="true"></canvas>
      <div class="hud-date"><div id="date"></div><div id="time"></div></div>
      <div class="hud-group speed-group">
        <button type="button" id="btn-pause"></button>
        <div id="speeds" class="speeds" data-i18n-title="hud.speedTitle"></div>
        <div id="speed-confirm" class="speed-confirm" hidden role="alertdialog"></div>
      </div>
      <div class="hud-group">
        <button type="button" id="btn-atlantic" data-i18n="hud.atlantic"></button>
        <button type="button" id="btn-britain" data-i18n="hud.britain"></button>
        <button type="button" id="btn-england" data-i18n="hud.england"></button>
      </div>
      <div class="hud-group">
        <button type="button" id="btn-ruler" data-i18n="hud.ruler"></button>
        <button type="button" id="btn-radar" data-i18n="hud.radarShort" data-i18n-title="hud.radarCover"></button>
        <button type="button" id="btn-reports" data-i18n="hud.reports"></button>
        <button type="button" id="btn-formations" data-i18n="hud.formations" data-i18n-title="hud.formationsTitle"></button>
        <button type="button" id="btn-cards" data-i18n="hud.cards"></button>
        <button type="button" id="btn-scenario" data-i18n="hud.scenario"></button>
        <button type="button" id="btn-settings" data-i18n="hud.settings"></button>
        <button type="button" id="btn-help" data-i18n="hud.help"></button>
        <button type="button" id="btn-panel" class="only-small" data-i18n="hud.panel"></button>
      </div>
    </header>

    <main id="table">
      <canvas id="map"></canvas>
      <div id="alert" class="alert" hidden role="alert">
        <strong id="alert-title" data-i18n="alert.title"></strong>
        <span id="alert-text"></span>
        <span id="alert-more" class="alert-more" hidden></span>
        <span class="alert-buttons">
          <button type="button" id="alert-show" data-i18n="alert.show"></button>
          <button type="button" id="alert-close" class="close" data-i18n-label="alert.close">×</button>
        </span>
      </div>
      <div id="question" class="question" hidden role="alertdialog" aria-live="assertive">
        <strong id="question-title"></strong>
        <span id="question-text"></span>
        <span id="question-left" class="question-left"></span>
        <span class="question-buttons">
          <span id="question-yesno" class="question-buttons">
            <button type="button" id="question-yes" data-i18n="question.yes"></button>
            <button type="button" id="question-no" data-i18n="question.no"></button>
          </span>
          <span id="question-options" class="question-buttons" hidden></span>
          <button type="button" id="question-show" class="secondary" data-i18n="question.show"></button>
        </span>
        <span id="question-more" class="question-more" hidden></span>
      </div>
      <div id="coach" class="coach" hidden role="status" aria-live="polite"></div>
      <aside id="unit-panel" class="unit-panel" hidden aria-labelledby="unit-title">
        <header class="unit-head">
          <h2 id="unit-title"></h2>
          <span class="unit-head-buttons">
            <button type="button" data-action="centre-selection" class="icon-button" data-i18n-title="unit.centre" data-i18n-label="unit.centre">⌖</button>
            <button type="button" data-action="close-unit" class="icon-button close" data-i18n-title="unit.close" data-i18n-label="unit.close">×</button>
          </span>
        </header>
        <p id="unit-summary" class="unit-summary"></p>
        <nav id="unit-tabs" class="unit-tabs" role="tablist"></nav>
        <div class="unit-body">
          <div id="unit-message"></div>
          <div id="unit-pre"></div>
          <canvas id="unit-profile" class="profile" hidden></canvas>
          <div id="unit-keyed"></div>
          <div id="unit-post"></div>
        </div>
      </aside>
      <div id="loading" class="loading"><span class="spinner"></span></div>
    </main>

    <aside id="panel">
      <section>
        <h2 data-i18n="panel.objectives"></h2>
        <ul id="objectives" class="objectives"></ul>
      </section>
      <section>
        <h2 class="with-tabs"><span data-i18n="panel.tote"></span>
          <span class="tabs" role="tablist">
            <button type="button" id="tab-units" role="tab" data-tab="units" data-i18n="panel.units"></button>
            <button type="button" id="tab-sites" role="tab" data-tab="sites" data-i18n="panel.sites"></button>

e chances","patrolTag":"vu","zigzag":"zigzag","uplot":"U ? {time} · {source}","uSource":{"seen":"vu en surface","periscope":"périscope","asdic":"ASDIC","radar":"radar","aircraft":"vu d'avion","asv":"radar ASV","df":"radiogoniométrie"},"seenTag":"en vue · {by}","uContact":"U-Boot · {how} · {by}","uContactUnder":"U-Boot en plongée · {how} · {by}","wingPlaque":"{name} · {n} sqn · {aircraft} · {alt}","wingGathering":"rassemblement {n}/{of}","groupPlaque":"{name} · {n} gr. · {ships}","rallyAsap":"au plus tôt","rallyAir":"RV {name} · {time} · {alt}","rallySea":"RV {name} · {time}","escortCombat":"{name} · {n} · au combat","escortHunting":"{name} · {n} · en chasse","portBubble":"entrée au port","shipEnd":{"hold":"→ garde le cap","hunt":"⌖ chasse","escort":"⇢ rejoint {convoy}","port":"⚓ {port}"},"viewAir":"vue {km} km","viewSurface":"surface {km} km","viewSubmerged":"plongée {km} km"},"help":{"title":"Comment jouer","steps":["Kanalkampf, 10-24 juillet 1940. Trois choses à tenir : les convois, les stocks, la défense aérienne. Vue Atlantique (A), Grande-Bretagne (L) et Angleterre (G).","Convois : les HX 55 et HX 57 sont en mer. Tracez leur route (ou donnez-leur des étapes en Réaliste) jusqu'au chenal du nord de l'Irlande ou au canal Saint-Georges, où un pilote les conduit à Liverpool ou à la Clyde. Les cercles hachurés sont des U-Boote probables, repérés par radiogoniométrie : contournez-les, ou envoyez un groupe d'escorte au-devant du convoi.","Le convoi côtier CW 7 attend dans la Tamise avec du matériel pour Southampton. Faites-le appareiller quand vous pourrez le couvrir : de jour, la Luftwaffe l'attaque dans la Manche. Une escadrille peut « Couvrir » le convoi.","Logistique : les convois déchargent carburant et matériel dans les ports. Envoyez des trains vers les bases (carburant) et les usines (matériel), ou fixez un stock minimum dans la fiche d'une base : les trains partent seuls. Sans carburant, une escadrille ne refait pas le plein. Les usines remplacent les avions perdus.","Défense : à l'alerte, faites décoller une escadrille vers le raid, réglez son altitude (↑ ↓) pour arriver au-dessus. En Arcade, « Intercepter » (ou glisser jusqu'au raid) laisse le contrôleur la guider : sa chance dépend de la couverture radar. Le trait pointillé d'un raid manqué donne l'écart ; chaque raid finit par un rapport, rangé dans « Rapports ».","Tracés : cliquez une unité pour ouvrir sa fiche, à droite de la carte, et voir les carrés de sa route. Glissez un carré pour le déplacer, un « + » pour ajouter un point, l'anneau du bout pour prolonger ; double-cliquez un carré pour le retirer. Un point choisi prend une altitude avec ↑ ↓. En fin de tracé, l'escadrille orbite, sauf si vous choisissez autre chose dans l'onglet Route de sa fiche (se poser si le tracé finit dans la bulle d'un aérodrome).","Victoire si les convois livrent l'essentiel de leur cargaison, si 4 bases sur 5 sont en service et si la chasse garde 60 % de ses avions le 24 juillet. Défaite immédiate si toutes les bases restent sans carburant 24 heures."],"keys":"Espace : pause · 1 à 6 : vitesse · A : Atlantique · L : Grande-Bretagne · G : Angleterre · R ou Maj + glisser : règle (la croix de son encart l'efface) · Entrée : ajouter l'étape mesurée · C : couverture radar · Échap : annuler, puis fermer la fiche · ↑ ↓ : altitude (de l'unité choisie, ou du point choisi) · Suppr : retirer le point choisi · S : décoller · B : pleine vitesse · O : orbiter · P : rentrer · D : désengager du raid en cours · Question à l'écran : Entrée = oui (au rendez-vous : le choix du plan), Échap = non (au rendez-vous : partir)","close":"Compris","stepsTraining":["Carte de l'Atlantique : glissez depuis le convoi HX (à Halifax) pour tracer sa route jusqu'à Liverpool ou la Clyde, ou cliquez sur « Route de l'Amirauté ». En réglage Réaliste, on navigue au cap : mesurez avec la règle, ajoutez des étapes, puis appareillez. Près de l'entrée d'un chenal, un pilote prend le relais.","Accélérez le temps avec les boutons ×1 à ×14 400 (touches 1 à 6). Une alerte radar ralentit le temps et zoome sur l'Angleterre.","À l'alerte, glissez depuis un aérodrome vers le raid : l'escadrille prête décolle et suit votre tracé. Vous pouvez aussi lui donner un cap direct, ou une liste d'étapes (cap 170 pendant 6 min, puis cap 155 jusqu'en J5).","Réglez l'altitude (↑ ↓, par 1 000 ft) pour arriver au-dessus du raid. Les tiges montrent l'altitude de chaque formation, et l'écart s'affiche sur la plaque du raid quand une escadrille est choisie. La vue de profil de sa fiche montre si la montée sera finie à temps.","Un raid manqué est signalé par un trait pointillé : il donne l'écart en distance et en altitude. Chaque combat se termine par un rapport dans le journal.","Les installations bombardées (aérodromes, radars, ports) apparaissent dans l'onglet Installations : un radar hors service ouvre un trou dans la couverture, un aérodrome endommagé fait décoller plus lentement."],"common":["Tracés : cliquez une unité pour ouvrir sa fiche à droite de la carte. L'onglet Ordres regroupe ce qu'elle doit faire (décoller, missions, état d'alerte, attitude face à l'ennemi, formation) ; l'onglet Navigation, comment elle y va (route, étapes, cap, altitude, vitesse, fin de route, profil). Tant que la fiche est ouverte, la règle, Entrée et ↑ ↓ s'adressent à cette unité. La croix ou Échap la ferme. Glissez les carrés de la route, ajoutez-en avec « + », prolongez par l'anneau du bout, double-cliquez pour retirer. Maj + glisser mesure (règle) ; la croix de son encart l'efface.","Formations (menu du haut) : groupez des escadrilles en big wing, ou des groupes d'escorte en groupe de soutien. La formation devient une seule unité, avec une fiche et les mêmes ordres pour tous ; son chef (★) mène, le suivant prend la relève. Les fiches techniques (menu du haut) donnent vitesses, plafonds et autonomies.","Face à l'ennemi (onglet Ordres) : en Défense, une escadrille n'attaque pas d'elle-même et demande l'autorisation quand elle voit un raid ; en Attaque (le défaut), elle attaque les raids qui arrivent et demande avant de poursuivre un raid qui rentre ; en Attaque et poursuite, elle poursuit sans demander jusqu'à mi-Manche, puis demande. Une question passe le jeu à ×1 et y reste ; sans réponse en 60 s, c'est non. Une seule question par raid et par escadrille ; on peut couper les questions dans Réglages. Un tracé qui finit sur un raid, ou « Intercepter », vaut autorisation. « Désengager H05 » (touche D) sort l'unité du combat : elle tourne sur place et laisse ce raid tranquille jusqu'à un nouvel ordre sur lui. Passer à une attitude plus prudente retire les autorisations déjà données : une escadrille qui poursuivait rompt au round suivant.","États d'alerte : Repos (2 h : le personnel peut être n'importe où), Disponible (30 min), Alerte (5 min), Cockpit (2 min). Le délai est le temps pour être en l'air après l'ordre de décoller ; monter d'un état prend la différence (du repos à l'alerte : 1 h 55), descendre est immédiat. L'onglet Effectifs d'un aérodrome tient le plan de chaque jour (heures de 00:00 à 24:00) ; « Seulement les prochaines 24 h » ouvre un plan d'exception en heures H (H0 – H+6 repos, H+6 – H+9 alerte…), puis on revient au plan du jour. La durée se règle dans Réglages.","Programmer : « Décollage programmé » (ou « Appareillage programmé ») donne l'ordre à l'heure dite, avec la route tracée depuis la base ou les étapes préparées ; l'heure saisie est celle de l'ordre, le délai de l'état d'alerte s'y ajoute. « Rejoindre une formation » fait partir une escadrille à son heure pour rejoindre une big wing (ou un groupe de soutien).","Rassemblement (onglet d'une big wing ou d'un groupe de soutien) : sur le chef, ou sur un point à une heure donnée (ou au plus tôt), avec la route à suivre ensuite. Chaque membre a son heure de départ : en Arcade elles sont calculées, en Standard la fiche montre l'heure d'arrivée de chacun, en Réaliste à vous de compter (délai, montée, trajet). Avec une heure fixée, la formation part à cette heure (les premiers arrivés tournent) ; au plus tôt, dès que tous sont là. À l'heure, s'il manque quelqu'un : attendre (un temps maximum), ralentir vers la cible ou partir ; une big wing vous pose la question. Les retardataires suivent le plan en retard et rejoignent en route.","En mer (onglet Ordres d'un groupe d'escorte) : « Face aux U-Boote », Rester avec le convoi ou Chasser les contacts, pour une durée choisie (3 h par défaut) ; « Interrompre la chasse » ou tout autre ordre l'arrête. Un U-Boot tenu à l'ASDIC reçoit une passe de grenades toutes les 10 minutes. « Rentrer au port » laisse choisir le port ; les routes de mer contournent la terre, et un tracé qui finit dans la bulle d'un port y entre. Onglet Navigation : que faire en fin de tracé (s'arrêter, garder le cap, chasser sur place, rejoindre un convoi, entrer au port).","Chaque raid se termine par un rapport, rangé dans « Rapports », avec ce que la RAF en sait : le premier plot, la composition une fois le raid vu, les bombes tombées ; chaque attaque à la grenade d'un groupe d'escorte aussi. La partie est gardée dans le navigateur ; le menu « Scénario » permet de l'exporter dans un fichier."],"scenario":{"adlertag":["Adlertag, 12-18 août 1940. La Luftwaffe vise d'abord les radars de la côte (Dover, Rye, Pevensey, Ventnor), puis les aérodromes. Un radar détruit ouvre un trou dans la couverture : placez la station mobile (onglet Installations, « Déployer ») quand elle arrive.","Les raids sans bombardiers, très haut et rapides, sont des chasses libres de Bf 109 : elles cherchent à user vos escadrilles. Gardez vos forces pour les bombardiers. L'état d'alerte (repos 2 h, disponible 30 min, alerte 5 min, cockpit 2 min) règle le délai de décollage et la fatigue ; l'onglet Effectifs d'un aérodrome le programme.","Les bases de secteur (Biggin Hill, Kenley, Hornchurch, North Weald, Tangmere, Middle Wallop, Northolt) doivent rester en service. Sans munitions ni carburant, une base ne réarme plus : surveillez les stocks et les trains depuis Chilmark et les ports.","Victoire si 5 bases de secteur sur 7 et 7 radars sur 9 sont en service le 18 août au soir, si 90 avions ennemis sont abattus, si la chasse garde la moitié de ses avions et si le HX 62 livre 60 % de sa cargaison."],"quinze-septembre":["15 septembre 1940, une seule journée. Deux grandes vagues visent les docks de Londres, vers 11 h et vers 14 h, précédées de chasses libres.","Contre une escorte de cent chasseurs, engagez beaucoup d'escadrilles sur le même raid : la pression de l'escorte se partage entre elles. Les cinq escadrilles de Duxford peuvent voler en « Big Wing » : groupez-les dans « Formations » (menu du haut). Elles décollent ensemble, se rassemblent au-dessus du chef — ce qui prend du temps — puis volent à la vitesse des Hurricane.","Victoire si 40 avions ennemis sont abattus, si les docks restent sous 50 % de dégâts et si la chasse garde 70 % de ses avions."],"hiver-atlantique":["Hiver 1941, du 10 janvier au 31 mars. Les convois HX (Halifax, tous les cinq jours) et SC (Sydney, tous les huit jours, plus lents) partent seuls sur la route de l'Amirauté. Changez-la pour contourner les U-Boote repérés.","Envoyez un groupe d'escorte au-devant de chaque convoi qui approche : vos groupes ont sept ou huit jours d'autonomie et rentrent se ravitailler. « Chasser » laisse l'escorte poursuivre un contact frais le temps choisi ; « Rester » la garde serrée autour du convoi. Les nuits d'hiver sont longues : c'est alors que les meutes attaquent. Réglages, onglet Carte : les zones de vue montrent ce que voient vos navires et vos avions.","Le Coastal Command patrouille de jour au-dessus des convois et oblige les U-Boote à plonger ; le radar ASV des Hudson et des Sunderland voit aussi un sous-marin en surface. Les deux cercles d'un repère U-Boot montrent où il peut être, en surface et en plongée.","Onglet Logistique : la réserve de dollars paie la cargaison des convois. Réglez la part achetée, ou commandez des Hudson ou des Catalina en Amérique. Après le prêt-bail, tout est gratuit. Victoire si 6 800 t de carburant et 4 400 t de matériel sont déchargées et si moins de 8 % des navires sont perdus ; défaite si les pertes dépassent 20 %."]},"alerts":"Les alertes ralentissent le temps : un raid ramène à ×10 ; en mer, toute alerte ramène à ×1 (on décide, puis on accélère) ; une base à ×600. Chaque vitesse se règle dans Réglages, onglet Temps et alertes. Pendant une action ennemie, une vitesse élevée demande confirmation (réglable)."},"end":{"title":"Fin de service","bombersDown":"Bombardiers abattus : {n}","fightersDown":"Chasseurs ennemis abattus : {n}","rafLost":"Avions de la RAF perdus : {n}","groundLosses":"Dont détruits au sol : {n}","raidsIntercepted":"Raids interceptés avant leur cible : {n}","raidsRepelled":"Raids repoussés : {n}","targetsHit":"Bombardements subis : {n}","convoysArrived":"Convois arrivés : {n}","success":"Objectifs atteints.","failure":"Objectifs non atteints.","replay":"Rejouer","close":"Fermer","victory":"Victoire : tous les objectifs sont atteints.","defeat":"Défaite : des objectifs ne sont pas atteints.","defeatFuel":"Défaite : la chasse est restée clouée au sol, faute de carburant.","defeatFighters":"Défaite : Fighter Command n'a presque plus d'avions.","objectives":"Objectifs","shipsSunk":"Navires marchands perdus : {n}","uboatsSunk":"U-Boote coulés : {n}","unloaded":"Déchargé dans les ports : {fuel} t de carburant, {materiel} t de matériel","aircraftBuilt":"Avions construits : {n}, livrés aux escadrilles : {m}","fuelUsed":"Carburant consommé : {n} t","pilotsKilled":"Pilotes tués : {n}","ammoUsed":"Munitions consommées : {n} t","defeatShipping":"Défaite : les pertes de navires marchands sont trop lourdes, l'Amirauté suspend les départs.","dollars":"Dollars dépensés : {n} millions, sur {m}"},"success":{"title":"Objectifs atteints","text":"Le convoi est à quai et un raid a été intercepté avant sa cible. Vous pouvez continuer à jouer."," }","minShort":"min"},"legs":{"duration":"Cap {heading} pendant {d}","time":"Cap {heading} jusqu'à {time}","square":"Cap {heading} jusqu'en {ref}","position":"Cap {heading} jusqu'à {pos}","open":"Cap {heading} jusqu'à nouvel ordre","speed":" à {n} nœuds","current":"en cours","left":"reste {d}","eta":"fin vers {time}","alt":" à {alt}"},"profile":{"title":"Vue de profil","noRaid":"Aucun raid sur la table.","climb":"Montée à {ft} : {d}","level":"À l'altitude ordonnée","contact":"Contact prévu dans {d} : {verdict}","contactNone":"Le raid est trop loin ou trop rapide pour le contact au cap actuel.","verdict":{"above":"{ft} au-dessus du raid, idéal","level":"à hauteur du raid, sans avantage","low":"{ft} sous le raid, trop bas","high":"{ft} au-dessus du raid, trop haut"},"now":"maintenant","raid":"Raid {raid}","you":"{squadron}","window":"zone de combat possible","fighting":"Au combat avec le raid {raid}."},"desktop":{"title":"Conçu pour un ordinateur","text":"Ce jeu se joue sur un ordinateur, avec une souris et un clavier. Sur cet écran, la carte et les fiches seront à l'étroit.","continue":"Continuer quand même"},"types":{"Hurricane":"Hurricane","Spitfire":"Spitfire"},"resources":{"fuel":"carburant","materiel":"matériel","aircraft":"avions","fuelShort":"C","materielShort":"M","ammo":"munitions","ammoShort":"Mu"},"logistics":{"stocks":"Stocks","fuel":"Carburant","materiel":"Matériel","aircraft":"Avions prêts","tonnes":"{n} t","fuelDays":"{t} t (environ {d} j)","minStock":"Stock minimum","minHint":"Ordre permanent : quand le stock (trains en route compris) passe sous ce seuil, un train part du port le mieux placé. Vide : pas d'ordre.","minAuto":"Arcade : seuil automatique de {n} t.","apply":"Appliquer","sendTrain":"Envoyer un train","resource":"Chargement","to":"Vers","send":"Envoyer","trainHint":"Un train compte au plus {wagons} wagons : citernes de {fuel} t pour le carburant, wagons couverts de {materiel} t pour le reste. Au moins {min} t par train. Un petit train prend quand même un des trains de la ligne.","eta":"arrivée vers {time}","production":"Production","productionRate":"{n} {type} par jour","productionStopped":"arrêtée : plus de matériel","perAircraft":"{n} t de matériel par avion","unloading":"Déchargement en cours : {convoy}, reste {n} t","inbound":"Trains attendus","inboundLine":"{what}, {when}","none":"aucun","trainTitle":"Train {id}","trainLine":"{what} · {from} → {to}","trainState":{"loading":"chargement","waiting":"attend un sillon","moving":"en route","unloading":"déchargement"},"errors":{"place":"Destination invalide.","out":"Installation hors service : aucun train ne peut partir.","noLine":"Aucune ligne de chemin de fer ne relie ces deux points.","empty":"Stock vide.","tooMuch":"Trop lourd : un train compte au plus 20 wagons (citernes de 5 t, wagons couverts de 6 t).","tooLittle":"Un train emporte au moins 10 t."},"cargoPart":"{n} t de {resource}","and":"et","wagons":"Wagons","wagonsOf":"{n} sur {max}","ammo":"Munitions","ammoRate":"{n} t par jour (fabriques de munitions)"},"scenarios":{"kanalkampf":{"title":"Kanalkampf, juillet 1940","text":"10-24 juillet 1940. Deux convois HX traversent l'Atlantique, un convoi côtier attend dans l'estuaire de la Tamise. Répartissez le carburant et le matériel par le rail, protégez ports, radars, aérodromes et usines, et gardez la chasse en l'air pendant quinze jours."},"m0-july-1940":{"title":"Entraînement, juillet 1940","text":"Un scénario simple, sans logistique : un convoi à faire traverser, quelques raids à intercepter. Le tutoriel guidé y explique les gestes de base."},"play":"Jouer","adlertag":{"title":"Adlertag, août 1940","text":"12-18 août 1940. Göring lance « l'attaque de l'aigle » : la Luftwaffe veut détruire la chasse britannique, au sol et en l'air, avant l'invasion. Elle frappe d'abord les radars de la côte, puis les aérodromes, par vagues venues de Calais, d'Amiens et de Cherbourg. Les chasses libres de Bf 109, très haut, cherchent à attirer vos escadrilles : ne les gaspillez pas. Une station radar mobile arrive en renfort. Tenez les bases de secteur, gardez les radars en service et la chasse en état de se battre."},"quinze-septembre":{"title":"15 septembre 1940","text":"Dimanche 15 septembre 1940. Depuis le 7, la Luftwaffe bombarde Londres. Aujourd'hui, elle lance deux grands raids de jour sur les docks, précédés de chasses libres. Le 11 Group tient le sud-est ; de Duxford, le 12 Group peut envoyer une « Big Wing » de cinq escadrilles : faites-les voler en formation derrière un chef. Protégez les docks et abattez assez d'avions pour montrer que la RAF n'est pas vaincue, sans épuiser la chasse."},"hiver-atlantique":{"title":"Hiver dans l'Atlantique, 1941","text":"10 janvier - 31 mars 1941. Les convois HX partent d'Halifax tous les cinq jours, les SC, plus lents, de Sydney tous les huit jours. Les meutes de U-Boote les guettent au sud de l'Islande, la nuit, en surface. Quatre groupes d'escorte et le Coastal Command doivent les ramener. La Grande-Bretagne paie comptant ce qu'elle achète en Amérique : réglez la part de la cargaison que vous achetez, ou commandez des avions de patrouille. À Washington, le Congrès débat du prêt-bail."},"locked":"Se débloque en gagnant le scénario précédent de la campagne."},"reports":{"open":"Ouvrir le rapport","title":"Rapports de combat","none":"Aucun raid pour l'instant.","close":"Fermer","raid":"Raid {label}","ongoing":"en cours","outcome":{"destroyed":"Anéanti","repelled":"Repoussé","bombed":"Cible bombardée","unopposed":"Sans opposition","gone":"Rentré sans bombarder","phantom":"Fausse alerte","ongoing":"En cours","unseen":"Jamais vu","sweep":"Chasse libre"},"composition":"{bombers} {bomberType}, escorte de {escort} {escortType}.","compositionSweep":"{escort} {escortType}, sans bombardiers.","compositionAlone":"{bombers} {bomberType}, sans escorte.","seenBy":"Vu par {by} à {time}.","firstPlot":"Premier plot : {count} à {alt}.","notSeenYet":"Composition inconnue : pas encore vu par nos unités.","neverSeen":"Composition inconnue : jamais vu par nos unités.","targetConvoy":"le convoi {convoy}","hitSite":"Bombes sur {site} : dégâts {severity}, {n} % au total.","hitConvoy":"Convoi {convoy} : {n} navire(s) coulé(s).","groundLosses":"{n} avion(s) détruit(s) au sol.","noBombs":"Aucune bombe signalée.","unseenText":"Aucune de nos unités ne l'a vu et aucune bombe n'est signalée : raid reparti, ou fausse alerte du radar.","devTruth":"Mode développeur, en réalité : {force} Objectif : {target}.","devPhantom":"Mode développeur, en réalité : écho fantôme, aucun avion.","devOutcome":" Fin réelle : {outcome}.","squadron":"Escadrille","result":"Résultat","down":"Abattus","losses":"Pertes","engaged":"au combat","engagedAbove":"au combat, avec l'avantage de la hauteur","noContact":"sans contact","downCell":"{b} bomb. · {f} chass.","noSquadron":"Aucune escadrille ne l'a approché.","totals":"Bilan : {down} appareil(s) allemand(s) abattu(s) ({b} bombardiers, {f} chasseurs) pour {lost} avion(s) de la RAF perdu(s).","dayTotals":"{n} raid(s) · {down} abattus · {lost} pertes","miss":{"wide":"manqué : passé à {km} km","below":"manqué : {ft} trop bas","above":"manqué : {ft} trop haut","wideBelow":"manqué : à {km} km et {ft} trop bas","wideAbove":"manqué : à {km} km et {ft} trop haut","nothing":"rien vu"},"missGuided":" (guidage à {p} %)","naval":{"title":"{escort} contre un U-Boot","context":"{ships} escorteurs, partis de {convoy} ; trouvé : {how}.","contextAlone":"{ships} escorteurs ; trouvé : {how}.","pass":"passe {n}","passResult":{"nothing":"grenades, pas de résultat visible","damaged":"gazole et débris : touché, il rompt et rentre","lost":"contact perdu","sunk":"coulé"},"noPass":"Pas encore de passe : le groupe s'approche.","outcome":{"ongoing":"en cours","sunk":"coulé","damaged":"endommagé","lost":"perdu","brokenOff":"rompu"},"dayTotals":"{n} attaque(s) d'U-Boot, {sunk} coulé(s)"}},"reasonsScramble":{},"cards":{"title":"Fiches techniques","intro":"Les chiffres que le jeu utilise, proches de ceux de l'époque. Le plafond limite l'altitude qu'on peut ordonner.","open":"Voir la fiche technique","fighters":"Chasse (Fighter Command)","patrols":"Patrouilles","bombers":"Bombardiers allemands","escorts":"Chasseurs d'escorte allemands","sea":"En mer","cruise":"Vitesse de croisière","max":"Vitesse maximale","climb":"Montée","climbText":"{ft} ft par minute","ceiling":"Plafond","endurance":"Autonomie","minutes":"{n} min","armament":"Armement","crew":"Équipage","vsBombers":"Contre les bombardiers","vsFighters":"Contre les chasseurs","sight":"Vue (avions)","sightText":"{day} km de jour, {night} km de nuit","uboatSight":"U-Boot en surface","km":"{n} km","kg":"{n} kg","bombs":"Charge de bombes","vulnerability":"Résistance","range":"Rayon d'action","threat":"Danger pour la chasse","speedSea":"Vitesse","knots":"{n} nœuds","stragglers":"Traînards","stragglersText":"au-delà de {p} % de sa vitesse maximale, des navires décrochent","zigzag":"Zigzag","zigzagText":"{p} % plus lent, {h} % de coups au but en moins","asdic":"ASDIC (sous l'eau)","lookouts":"Vigies (surface)","lookoutsText":"{day} km de jour, {night} km de nuit","surface":"En surface","submerged":"En plongée","battery":"Batteries","batteryText":"environ {n} milles à 4 nœuds","torpedoes":"Torpilles","word":{"strong":"excellent","good":"bon","fair":"un peu en retrait","weak":"faible","vulnerable":"fragile","tough":"robuste","average":"moyen","dangerous":"redoutable"},"notes":{"Hurricane":"Le cheval de labour de 1940 : plus nombreux que le Spitfire, robuste, à son meilleur contre les bombardiers.","Spitfire":"Plus rapide et plus maniable : on l'envoie de préférence contre les chasseurs d'escorte.","Spitfire guet":"Une section qui patrouille haut au-dessus de la Manche pour signaler les raids, comme la 421 Flight créée en septembre 1940.","Anson":"Le patrouilleur côtier de 1940 : lent, peu armé, mais il oblige les U-Boote à plonger.","Hudson":"Plus rapide et mieux armé que l'Anson ; certains reçoivent le premier radar ASV fin 1940.","Sunderland":"Hydravion à très grande autonomie : il va loin au-dessus de l'Atlantique.","Do 17":"Le « crayon volant » : rapide pour un bombardier, vulnérable aux attaques de face.","Ju 87":"Le bombardier en piqué : précis, mais lent et très vulnérable sans escorte.","He 111":"Le plus gros bombardier de 1940 : robuste, la plus forte charge.","Bf 109":"Le meilleur chasseur allemand ; son faible rayon d'action limite son temps au-dessus de l'Angleterre.","Bf 110":"Chasseur lourd biplace : grand rayon d'action, mais pataud face aux Spitfire et Hurricane.","convoy":"Des dizaines de cargos et de pétroliers, en colonnes, à la vitesse du plus lent.","escort":"En 1940, quelques navires seulement pour un grand convoi ; l'ASDIC ne voit pas un U-Boot en surface.","uboat":"En 1940, il attaque surtout de nuit, en surface : presque invisible, plus rapide qu'en plongée.","Ju 88":"Le plus moderne des bombardiers de 1940 : rapide, capable d'attaquer en piqué.","Bf 110 Jabo":"Bf 110 armés de bombes, comme l'Erprobungsgruppe 210 : ils frappent vite et bas les radars et les aérodromes.","Catalina":"Hydravion américain à très grande autonomie : il couvre les convois loin dans l'Atlantique."}},"save":{"title":"Partie en cours","text":"La partie est enregistrée toute seule dans ce navigateur et reprend où vous l'avez laissée. Vous pouvez aussi l'emporter dans un fichier.","export":"Exporter la partie (.json)","import":"Importer une partie…","restart":"Recommencer ce scénario","importError":"Ce fichier n'est pas une partie de ce jeu, ou il vient d'une autre version.","exportError":"L'export n'a pas pu se faire ici. Le jeu reste enregistré dans ce navigateur."},"mru":{"title":"Stations radar mobiles","available":"{n} disponible(s)","deploy":"Déployer","placing":"Glissez sur la carte…","pending":"{name} en cours d'installation, prête vers {time}","hint":"Glissez depuis l'emplacement (sur la terre) vers la mer à surveiller.","errors":{"none":"Aucune station mobile disponible.","place":"Une station mobile s'installe sur la terre britannique."},"preview":"Station mobile · face au {az}°","mapPending":"{name} · prête à {time}"},"events":{"ok":"Compris","adlertag":{"intro":{"title":"Adlertag","text":"Prise de service, 12 août 1940. Ce matin, des Bf 110 chargés de bombes ont été vus au-dessus de Calais : les stations radar de la côte sont menacées. Le convoi HX 62 approche du nord de l'Irlande : tracez sa route."},"mru":{"title":"Station radar mobile","text":"Une station radar mobile (MRU) est prête. Onglet Installations, « Déployer », puis glissez sur la carte depuis son emplacement (sur la terre) vers la mer à surveiller : elle peut boucher le trou d'une station détruite. Il lui faut six heures pour se mettre en service, et elle porte moins loin qu'une station fixe."},"adlertag":{"title":"L'attaque de l'aigle","text":"13 août. Le mauvais temps du matin a désorganisé les premières vagues, mais Göring maintient « l'attaque de l'aigle ». Attendez-vous à des raids sur les aérodromes tout l'après-midi."},"relief":{"title":"Relève","text":"Le 266 Squadron (Spitfire) arrive à Hornchurch pour relever les escadrilles épuisées du 11 Group."},"blackThursday":{"title":"15 août","text":"15 août : la Luftwaffe fait son plus grand effort, jusque dans le nord de l'Angleterre. Dans le sud, attendez-vous à des raids toute la journée."},"hardestDay":{"title":"Le jour le plus dur","text":"18 août. Kenley et Biggin Hill sont visés en même temps. Des Stuka sont annoncés sur les aérodromes du Sussex et sur la station radar de Poling."}},"quinze-septembre":{"intro":{"title":"Dimanche 15 septembre","text":"Prise de service. Temps clair, quelques nuages. Toutes les escadrilles sont prêtes. Le Premier ministre est venu suivre la bataille au poste de commandement souterrain du 11 Group, à Uxbridge."},"uxbridge":{"title":"Uxbridge, 10 h 30","text":"Les radars voient des formations se rassembler au-dessus de Calais et de Boulogne. Engagez assez d'escadrilles sur chaque grand raid : quelques-unes ne suffiront pas contre une escorte de cent chasseurs. La Big Wing de Duxford peut décoller."},"afternoon":{"title":"Après-midi","text":"Début d'après-midi : de nouvelles formations, plus nombreuses que ce matin, se rassemblent au-dessus du Pas-de-Calais."}},"hiver-atlantique":{"intro":{"title":"Western Approaches","text":"Prise de service, 10 janvier 1941. Le HX 100 appareille d'Halifax. Les convois suivent la route de l'Amirauté ; vous pouvez la changer pour contourner les U-Boote repérés. Envoyez un groupe d'escorte au-devant de chaque convoi qui approche : vos escorteurs n'ont que sept ou huit jours d'autonomie. Les nuits d'hiver sont longues, et c'est la nuit que les U-Boote attaquent."},"packs":{"title":"Nouvelles meutes","text":"Février : de nouveaux U-Boote quittent Lorient et Saint-Nazaire. L'amiral Dönitz les groupe en meutes plus à l'ouest."},"packs2":{"title":"Encore des U-Boote","text":"Fin février : d'autres U-Boote prennent la mer. Ceux qui ont tiré leurs torpilles reviennent après une quinzaine de jours au port."},"lendLease":{"title":"Prêt-bail","text":"11 mars 1941. Le président Roosevelt signe la loi du prêt-bail. La Grande-Bretagne n'a plus à payer comptant : les convois qui partent désormais sont chargés à plein, sans dépense."},"catalina":{"title":"Catalina","text":"Les Catalina achetés en Amérique sont arrivés à Castle Archdale. Leur autonomie leur permet de couvrir les convois bien plus loin que les autres avions."},"hudson":{"title":"Hudson","text":"Les Hudson achetés en Amérique sont arrivés à Limavady."}}},"offers":{"title":"Achats en Amérique","intro":"Avant le prêt-bail, la Grande-Bretagne paie comptant. Les dollars achètent la cargaison des convois, ou des avions de patrouille.","stock":"Réserve : {n} millions de dollars (sur {m})","purchase":"Part achetée de chaque convoi qui part","purchaseHint":"Un convoi complet HX coûte environ {hx} millions, un SC {sc} millions. Ce qui n'est pas acheté part sur lest.","next":"Prochains départs","nextLine":"{convoy} : {date}, environ {cost} millions","lendLease":"Prêt-bail : les convois partent chargés à plein, sans dépense.","buy":"Commander ({cost} M$)","bought":"Commandé","arrives":"livraison {days} jours après la commande","catalina":"4 Catalina pour Castle Archdale","hudson":"6 Hudson avec radar ASV pour Limavady","refused":"Pas assez de dollars pour cette commande."},"campaign":{"title":"Campagne, acte I","intro":"Les scénarios se suivent : une victoire ouvre le suivant.","won":"Gagné","open":"À jouer","locked":"Verrouillé","training":"Entraînement","unlockAll":"Débloquer tous les scénarios","unlocked":"Victoire : le scénario « {title} » est débloqué.","tutorial":"Tutoriel guidé","carryNote":"Pertes reportées : {share} % des avions au départ (réglage « Campagne »)."},"tutorial":{"step":"Étape {n} sur {total}","next":"Suivant","finish":"Terminer","quit":"Quitter le tutoriel","waiting":"À vous…","welcome":{"title":"Bienvenue au poste de commandement","text":"Juillet 1940. Vous commandez le soutien allié : la chasse, les convois et les radars. Ce tutoriel vous guide pas à pas ; le temps est arrêté tant que vous lisez. Chaque étape passe toute seule quand vous avez fait ce qu'elle demande."},"convoy":{"title":"Faire partir le convoi","text":"Le convoi HX attend à Halifax, dans l'Atlantique. Sa fiche est ouverte à droite : cliquez « Route de l'Amirauté », ou glissez depuis le convoi jusqu'au nord de l'Irlande pour tracer sa route. Un pilote le conduira au port."},"time":{"title":"Lancer le temps","text":"Le convoi est en route. Lancez le temps (Espace) et accélérez avec les boutons ×1 à ×14 400 en haut, ou les touches 1 à 6. Une alerte radar ralentira le temps toute seule."},"radar":{"title":"Les radars veillent","text":"Les stations radar de la côte surveillent la Manche. Attendez la première alerte : un raid se rassemble au-dessus de la France vers midi."},"scramble":{"title":"Alerte !","text":"Un raid est détecté : sa plaque donne son numéro, le nombre d'avions et l'altitude. Faites décoller une escadrille proche (Biggin Hill, Croydon, Hornchurch) : glissez depuis son aérodrome jusqu'au raid, ou choisissez-la dans l'onglet Unités et cliquez « Décoller »."},"altitude":{"title":"Monter au-dessus","text":"Réglez l'altitude avec ↑ ↓ (par 1 000 ft) pour arriver au-dessus du raid : l'attaque en piqué donne l'avantage. La vue de profil de la fiche montre si la montée sera finie à temps. Corrigez la route si le raid change de cap."},"combat":{"title":"Tally-ho !","text":"Le combat se règle tout seul, passe après passe. Contre un gros raid, envoyez une deuxième escadrille. Une escadrille à court de munitions ou de carburant rentre d'elle-même."},"reports":{"title":"Le rapport","text":"Le combat est fini. Chaque raid se termine par un rapport : ouvrez « Rapports » dans le menu du haut pour le lire, ou passez à la suite."},"end":{"title":"À vous de jouer","text":"Vous connaissez l'essentiel. L'aide (?) résume le reste : stocks et trains, escortes, U-Boote, fiches techniques. La campagne commence avec Kanalkampf, dans le menu « Scénario »."}},"alerts":{"uboatAttack":{"title":"Convoi attaqué","text":"{convoy} est attaqué par des U-Boote (navires coulés : {n}).","missed":"Un U-Boot a tiré sur {convoy}, sans le toucher. D'autres peuvent suivre."},"convoyBombed":{"title":"Convoi bombardé","text":"Le raid {raid} bombarde {convoy} (navires coulés : {n})."},"convoySighted":{"title":"Convoi pisté","text":"Un U-Boot piste {convoy} : la meute peut attaquer dès la nuit."},"uboatPlot":{"title":"Contact U-Boot","text":"U-Boot repéré par {by}, à {km} km de {convoy}."},"straggler":{"title":"Traînards","text":"Des navires de {convoy} décrochent (traînards : {n}). Réduisez la vitesse ou envoyez une escorte."},"convoyInEscortRange":{"title":"Escorte","text":"{convoy} arrive à portée de vos escortes (groupes libres au port : {n}).","none":"{convoy} arrive à portée de vos escortes, mais aucun groupe n'est libre."},"escortLowFuel":{"title":"Escorte à court","text":"{escort} doit rentrer se ravitailler : {convoy} n'a plus d'escorte.","alone":"{escort} doit rentrer se ravitailler."},"convoyStopped":{"title":"Navires arrêtés","text":"{convoy} s'est arrêté avant la côte : donnez-lui une route."},"convoyWaiting":{"title":"En attente d'ordres","text":"{convoy} est au bout de sa route et attend vos ordres."},"siteOut":{"title":"Installation hors service","text":"{site} est hors service."},"noFuel":{"title":"Plus de carburant","text":"{airfield} n'a plus de carburant : {squadron} ne peut pas refaire le plein."},"noAmmo":{"title":"Munitions","text":"{airfield} manque de munitions : {squadron} n'est armée qu'à {n} %."},"lowFuel":{"title":"Carburant bas","text":"Carburant bas à {airfield} : moins d'un jour de vols. Envoyez un train."},"patrolBounced":{"title":"Patrouille surprise","text":"{squadron} est surprise par l'escorte du raid {raid} (avions restants : {n})."},"scheduleDelayed":{"title":"Ordre en attente","text":"{unit} : l'ordre programmé ne peut pas être exécuté ({reason}). Il partira dès que possible."},"escortEngaged":{"title":"Escorte au combat","text":"{escort} attaque un U-Boot près de {convoy}.","alone":"{escort} attaque un U-Boot."}},"speedConfirm":{"air":"Un raid est en cours. Passer vraiment à {speed} ?","naval":"Un convoi est attaqué. Passer vraiment à {speed} ?","yes":"Passer à {speed}","stay":"Rester à {speed}","stayPaused":"Rester en pause"},"dev":{"badge":"DEV","badgeTitle":"Mode développeur (Réglages) : les vraies positions ennemies sont affichées.","tab":"Ennemis","on":"Mode développeur activé : les vraies positions ennemies s'affichent (Réglages pour l'arrêter).","off":"Mode développeur arrêté.","phantom":"fausse alerte","nowhere":"nulle part","aircraft":"{n} avions","phase":{"pending":"en attente","assembling":"rassemblement","inbound":"en route","bombing":"sur l'objectif","outbound":"retour","done":"terminé","repelled":"repoussé, retour","destroyed":
